<script>
// =========================================================================
// UploadModule.html — Local-First Upload System
// V6 OVERHAUL: IndexedDB + Batch + Limited Retry + Pending Log Queue
// =========================================================================

// =========================================================================
// 1. INDEXEDDB — Persistent Local Storage for Upload Queue
// =========================================================================
var UPLOAD_DB_NAME = 'InLensUploadDB';
var UPLOAD_DB_VERSION = 1;
var STORE_QUEUE = 'localUploadQueue';
var STORE_BATCH = 'uploadBatch';
var STORE_PENDING_LOG = 'pendingLogQueue';
var _uploadDB = null;
var _uploadModuleInitialized = false;
var _activeUploadJob = null;
var _activeBatchProgress = null;
var _uploadPausedOffline = !navigator.onLine;
var _offlineToastShown = false;
var _onlineToastShown = false;
var _uploadOnlineWaiters = [];
var DRIVE_SLOW_NOTICE_MS = 12000;
var DRIVE_UPLOAD_TIMEOUT_MS = 60000;
var FINAL_SYNC_MAX_ATTEMPTS = 3;
var FINAL_SYNC_RETRY_DELAY_MS = 900;

function createUploadJob(totalCount, categories) {
  return {
    jobId: 'job_' + Date.now() + '_' + Math.random().toString(36).substr(2, 7),
    status: 'INIT',
    totalCount: totalCount || 0,
    categories: categories || [],
    successCount: 0,
    failedCount: 0,
    pendingLogCount: 0,
    syncPendingCount: 0,
    publicWarning: '',
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}

function setUploadJobStatus(job, status, updates) {
  if (!job) return null;
  job.status = status;
  job.updatedAt = Date.now();
  if (updates) {
    for (var key in updates) {
      if (updates.hasOwnProperty(key)) job[key] = updates[key];
    }
  }
  _activeUploadJob = job;
  return job;
}

function getUploadCategoryLabel(category) {
  if (category === 'palet') return CLIENT_CONFIG.PALET_SUBFOLDER || 'Palet';
  if (category === 'suratjalan') return CLIENT_CONFIG.SURAT_SUBFOLDER || 'Surat Jalan';
  return CLIENT_CONFIG.DOC_SUBFOLDER || 'Dokumen';
}

function setActiveBatchProgress(batch, phase, sent, total) {
  if (!batch) {
    _activeBatchProgress = null;
    return;
  }
  _activeBatchProgress = {
    jobId: batch.jobId || '',
    batchId: batch.batchId,
    label: batch.label || ('Batch ' + getUploadCategoryLabel(batch.category)),
    phase: phase || 'Menunggu',
    sent: sent || 0,
    total: total || batch.totalItems || 0
  };
}

function getActiveUploadJobId() {
  return _activeUploadJob && _activeUploadJob.status !== 'DONE' ? _activeUploadJob.jobId : '';
}

function isSameUploadJob(value, jobId) {
  return !!jobId && !!value && (value.jobId === jobId || (value.meta && value.meta.jobId === jobId));
}

function filterUploadJobItems(items, jobId) {
  if (!jobId) return [];
  return (items || []).filter(function(item) { return isSameUploadJob(item, jobId); });
}

function isUnfinishedLocalUpload(item) {
  if (!item || item.status === 'DONE' || item.status === 'FINAL_SYNCED') return false;
  return true;
}

function completeUploadJobIfClear_(jobId, items, pendingLogs) {
  if (!jobId || !_activeUploadJob || _activeUploadJob.jobId !== jobId) return false;
  if (String(_activeUploadJob.status || '') === 'INIT') return false;
  var hasUnfinished = (items || []).some(isUnfinishedLocalUpload);
  if (hasUnfinished || (pendingLogs || []).length > 0) return false;
  setUploadJobStatus(_activeUploadJob, 'DONE', {
    successCount: _activeUploadJob.totalCount || 0,
    failedCount: 0,
    pendingLogCount: 0
  });
  _activeBatchProgress = null;
  return true;
}

function assertGasSuccess(res, fallbackMessage) {
  if (!res || res.success === false) {
    throw new Error((res && res.message) || fallbackMessage || 'Server gagal memproses data');
  }
  return res;
}

function getUploadSessionId(item) {
  return String((item && (item.sessionId || (item.meta && item.meta.sessionId))) || '').trim();
}

function uploadSleep_(ms) {
  return new Promise(function(resolve) { setTimeout(resolve, ms); });
}

function showDrivePublicWarning_(warning) {
  warning = String(warning || '').trim();
  if (!warning) return;
  try {
    Toast.fire({
      icon: 'warning',
      title: 'Foto tersimpan, akses preview perlu dicek',
      text: warning.length > 120 ? warning.substring(0, 120) + '...' : warning
    });
  } catch (e) {}
}

function createLocalPlaceholder(meta, fileName) {
  meta = meta || {};
  var localId = _generateLocalId();
  var item = {
    localId: localId,
    batchId: '',
    category: meta.uploadType || 'dokumen',
    blob: null,
    previewUrl: '',
    fileName: fileName || meta.fileName || '',
    sessionId: meta.sessionId || '',
    containerId: meta.containerId || '',
    jobId: meta.jobId || '',
    uploadType: meta.uploadType || 'dokumen',
    meta: meta,
    fileId: null,
    status: 'COMPRESSING',
    attempts: 0,
    logAttempts: 0,
    errorMessage: '',
    errorType: '',
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  return _idbPut(STORE_QUEUE, item).then(function() { return item; });
}

function getVisiblePhotoIdMapFromState_() {
  var map = {};
  (state.containers || []).forEach(function(container) {
    (container.photos || []).forEach(function(photo) {
      var id = String((photo && photo.id) || '').trim();
      if (id) map[id] = true;
    });
  });
  return map;
}

function getMissingLoggedFileIds_(logItems) {
  var visible = getVisiblePhotoIdMapFromState_();
  var missing = [];
  (logItems || []).forEach(function(item) {
    var fileId = String((item && item.fileId) || '').trim();
    if (fileId && !visible[fileId]) missing.push(fileId);
  });
  return missing;
}

function applyUploadSyncResponse_(res, traceId) {
  if (!res || !res.success || !res.data) return false;
  var data = res.data || {};
  try {
    lastSyncHash = buildSyncHash(data.containers, data.sjQty, data.users, data.session);
  } catch (hashErr) {
    lastSyncHash = '';
  }
  state.containers = data.containers || [];
  state._users = data.users || [];
  state.sjQtyStatus = data.sjQty || null;
  if (data.session) {
    state.activeSession = {
      brand: data.session.brand,
      shipment: data.session.shipment,
      date: data.session.date,
      pic: data.session.pic,
      createdBy: data.session.createdBy,
      forwarder: data.session.forwarder || '',
      lossPreventionName: data.session.lossPreventionName || '',
      lossPreventionDate: data.session.lossPreventionDate || '',
      lossPreventionFilledBy: data.session.lossPreventionFilledBy || '',
      lossPreventionSignatureMode: data.session.lossPreventionSignatureMode || '',
      lossPreventionSignatureFileId: data.session.lossPreventionSignatureFileId || '',
      lossPreventionSignatureFileUrl: data.session.lossPreventionSignatureFileUrl || '',
      lossPreventionSignatureSignedAt: data.session.lossPreventionSignatureSignedAt || ''
    };
  }
  var me = (data.users || []).find(function(u) {
    return String(u.name || '').toLowerCase() === String(state.fullName || state.username || '').toLowerCase();
  });
  if (me) state.myStatus = me.status;
  save();
  var page = document.getElementById('page-session');
  if (page && page.classList.contains('active')) {
    renderSplitList(data);
    if (state.activeContainerId) renderSplitDetail();
  }
  if (typeof crudTraceAfterRender === 'function') {
    crudTraceAfterRender('uploadFinalSync', traceId || 'upload-final-sync', 'ui_render_done');
  }
  return true;
}

async function forceUploadCloudSync_(sessionId, traceId) {
  sessionId = String(sessionId || state.activeSessionId || '').trim();
  if (!sessionId) return { success: false, message: 'Session ID kosong.' };
  var res = await gasRun('syncSessionData', [sessionId, true, traceId], 30000);
  if (applyUploadSyncResponse_(res, traceId)) return res;
  return res || { success: false, message: 'Sync tidak mengembalikan data.' };
}

async function cleanupFinalSyncedLocalItems_(localIds) {
  for (var i = 0; i < (localIds || []).length; i++) {
    var localId = localIds[i];
    var item = await _idbGet(STORE_QUEUE, localId);
    if (item && item.previewUrl) {
      try { URL.revokeObjectURL(item.previewUrl); } catch (e) {}
    }
    await removeFromLocal(localId);
  }
}

async function finalizeLoggedItemsAfterSync_(localIds, logItems, job, traceId) {
  localIds = (localIds || []).filter(Boolean);
  logItems = (logItems || []).filter(function(item) { return item && item.fileId; });
  if (localIds.length === 0 || logItems.length === 0) return { success: true, finalizedCount: 0, pendingCount: 0 };

  for (var i = 0; i < localIds.length; i++) {
    await updateLocalItem(localIds[i], {
      status: 'SYNC_PENDING',
      errorMessage: 'Data tersimpan. Menunggu tampilan aplikasi tersinkron.'
    });
  }
  setUploadJobStatus(job || _activeUploadJob, 'SYNC_PENDING', { syncPendingCount: localIds.length });
  renderLocalThumbnails();
  renderUploadTrackerV2();

  var sessionId = (job && job.sessionId) || (logItems[0] && logItems[0].sessionId) || state.activeSessionId;
  var missing = getMissingLoggedFileIds_(logItems);
  for (var attempt = 0; attempt < FINAL_SYNC_MAX_ATTEMPTS && missing.length > 0; attempt++) {
    try {
      await forceUploadCloudSync_(sessionId, (traceId || 'upload-final-sync') + '-attempt-' + (attempt + 1));
    } catch (syncErr) {
      crudTrace('uploadFinalSync', traceId || 'upload-final-sync', 'sync_attempt_failed', {
        attempt: attempt + 1,
        message: syncErr && syncErr.message ? syncErr.message : String(syncErr)
      });
    }
    missing = getMissingLoggedFileIds_(logItems);
    if (missing.length === 0) break;
    await uploadSleep_(FINAL_SYNC_RETRY_DELAY_MS);
  }

  if (missing.length === 0) {
    await cleanupFinalSyncedLocalItems_(localIds);
    return { success: true, finalizedCount: localIds.length, pendingCount: 0 };
  }

  for (var p = 0; p < localIds.length; p++) {
    await updateLocalItem(localIds[p], {
      status: 'SYNC_PENDING',
      errorMessage: 'Data tersimpan, tetapi tampilan belum berhasil sinkron. Tekan Sinkronkan ulang.'
    });
  }
  setUploadJobStatus(job || _activeUploadJob, 'SYNC_PENDING', { syncPendingCount: localIds.length });
  return { success: false, finalizedCount: 0, pendingCount: localIds.length, missingFileIds: missing };
}

async function finalizeSyncPendingItems(jobId, isManual) {
  var items = await getLocalQueue();
  if (jobId) items = items.filter(function(item) { return item.jobId === jobId; });
  items = items.filter(function(item) { return item.status === 'SYNC_PENDING' && item.fileId; });
  if (items.length === 0) {
    if (isManual !== false) Toast.fire({ icon: 'info', title: 'Tidak ada sinkronisasi pending' });
    return;
  }
  var logItems = items.map(function(item) {
    return {
      localId: item.localId,
      jobId: item.jobId || '',
      sessionId: item.sessionId || (item.meta && item.meta.sessionId) || '',
      fileId: item.fileId,
      containerId: item.containerId,
      type: item.uploadType,
      fileName: item.fileName,
      paletName: (item.meta && item.meta.paletName) || '',
      paletKoli: (item.meta && item.meta.paletKoli) || ''
    };
  });
  var res = await finalizeLoggedItemsAfterSync_(
    items.map(function(item) { return item.localId; }),
    logItems,
    _activeUploadJob,
    'manual-final-sync-' + Date.now()
  );
  if (res.success) {
    lastSyncHash = '';
    renderLocalThumbnails();
    renderUploadTrackerV2();
    Toast.fire({ icon: 'success', title: items.length + ' foto sudah tersinkron final' });
  } else if (isManual !== false) {
    Toast.fire({ icon: 'warning', title: res.pendingCount + ' foto masih menunggu sinkronisasi' });
  }
}

function getUploadBlockingSummary(sessionId) {
  sessionId = String(sessionId || '').trim();
  return openUploadDB().then(function() {
    return getLocalQueue().then(function(items) {
      return _idbGetAll(STORE_PENDING_LOG).then(function(pendingLogs) {
        var summary = {
          blocking: false,
          uploadPending: 0,
          logPending: 0,
          syncPending: 0,
          failedUpload: 0,
          total: 0
        };
        var pendingLogIds = {};
        (pendingLogs || []).forEach(function(p) {
          if (sessionId && getUploadSessionId(p) !== sessionId) return;
          pendingLogIds[p.localId] = true;
        });
        (items || []).forEach(function(item) {
          if (!isUnfinishedLocalUpload(item)) return;
          if (sessionId && getUploadSessionId(item) !== sessionId) return;
          if (pendingLogIds[item.localId]) return;
          summary.total++;
          var status = String(item.status || '');
          if (status === 'SYNC_PENDING') {
            summary.logPending++;
            summary.syncPending++;
          } else if (status === 'FAILED_LOG' || status === 'FAILED_LOG_MANUAL' || status === 'LOG_PENDING' || status === 'UPLOAD_SUCCESS' || item.failureStage === 'log') {
            summary.logPending++;
          } else if (isManualActionStatus(status) || status === 'FAILED_UPLOAD' || status === 'WAITING_MANUAL_RETRY') {
            summary.failedUpload++;
          } else {
            summary.uploadPending++;
          }
        });
        (pendingLogs || []).forEach(function(p) {
          if (sessionId && getUploadSessionId(p) !== sessionId) return;
          summary.total++;
          summary.logPending++;
        });
        summary.blocking = summary.uploadPending > 0 || summary.logPending > 0 || summary.failedUpload > 0;
        return summary;
      });
    });
  });
}

function setOfflineBannerMessage(message) {
  var banner = document.getElementById('offline-banner');
  if (!banner) return;
  var span = banner.querySelector('span');
  if (span) span.textContent = message;
}

function waitForOnline() {
  if (navigator.onLine) return Promise.resolve();
  return new Promise(function(resolve) {
    _uploadOnlineWaiters.push(resolve);
  });
}

function handleUploadOffline() {
  _uploadPausedOffline = true;
  setOfflineBannerMessage('Tidak ada koneksi internet. Upload dijeda.');
  var banner = document.getElementById('offline-banner');
  if (banner) banner.classList.add('show');
  if (!_offlineToastShown) {
    _offlineToastShown = true;
    _onlineToastShown = false;
    Toast.fire({ icon:'warning', title:'Koneksi terputus, upload dijeda' });
  }
  renderUploadTrackerV2();
}

function handleUploadOnline() {
  _uploadPausedOffline = false;
  setOfflineBannerMessage('Tidak ada koneksi internet');
  var banner = document.getElementById('offline-banner');
  if (banner) banner.classList.remove('show');
  if (!_onlineToastShown) {
    _onlineToastShown = true;
    _offlineToastShown = false;
    Toast.fire({ icon:'success', title:'Koneksi kembali, upload dilanjutkan' });
  }
  var waiters = _uploadOnlineWaiters.splice(0);
  waiters.forEach(function(resolve) { resolve(); });
  renderUploadTrackerV2();
}

async function ensureOnlineBeforeUpload(localId) {
  if (navigator.onLine) return;
  await updateLocalItem(localId, {
    status: 'OFFLINE_PAUSED',
    errorMessage: 'Koneksi terputus. Upload dijeda.'
  });
  handleUploadOffline();
  await waitForOnline();
  await updateLocalItem(localId, {
    status: 'ONLINE_RESUMING',
    errorMessage: 'Koneksi kembali. Melanjutkan upload...'
  });
  renderLocalThumbnails();
  renderUploadTrackerV2();
}

function openUploadDB() {
  return new Promise(function(resolve, reject) {
    if (_uploadDB) return resolve(_uploadDB);
    var req = indexedDB.open(UPLOAD_DB_NAME, UPLOAD_DB_VERSION);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_QUEUE)) {
        var qs = db.createObjectStore(STORE_QUEUE, { keyPath: 'localId' });
        qs.createIndex('status', 'status', { unique: false });
        qs.createIndex('batchId', 'batchId', { unique: false });
        qs.createIndex('category', 'category', { unique: false });
        qs.createIndex('sessionId', 'sessionId', { unique: false });
        qs.createIndex('containerId', 'containerId', { unique: false });
      }
      if (!db.objectStoreNames.contains(STORE_BATCH)) {
        db.createObjectStore(STORE_BATCH, { keyPath: 'batchId' });
      }
      if (!db.objectStoreNames.contains(STORE_PENDING_LOG)) {
        var ps = db.createObjectStore(STORE_PENDING_LOG, { keyPath: 'localId' });
        ps.createIndex('status', 'status', { unique: false });
        ps.createIndex('batchId', 'batchId', { unique: false });
      }
    };
    req.onsuccess = function(e) {
      _uploadDB = e.target.result;
      resolve(_uploadDB);
    };
    req.onerror = function(e) {
      console.error('IndexedDB open failed:', e);
      reject(new Error('Gagal membuka penyimpanan lokal'));
    };
  });
}

function _idbPut(storeName, data) {
  return openUploadDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).put(data);
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function(e) { reject(e.target.error); };
    });
  });
}

function _idbGet(storeName, key) {
  return openUploadDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(storeName, 'readonly');
      var req = tx.objectStore(storeName).get(key);
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function(e) { reject(e.target.error); };
    });
  });
}

function _idbDelete(storeName, key) {
  return openUploadDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).delete(key);
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function(e) { reject(e.target.error); };
    });
  });
}

function _idbGetAll(storeName, indexName, indexValue) {
  return openUploadDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(storeName, 'readonly');
      var store = tx.objectStore(storeName);
      var req;
      if (indexName && indexValue !== undefined) {
        req = store.index(indexName).getAll(indexValue);
      } else {
        req = store.getAll();
      }
      req.onsuccess = function() { resolve(req.result || []); };
      req.onerror = function(e) { reject(e.target.error); };
    });
  });
}

function _idbClearStore(storeName) {
  return openUploadDB().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(storeName, 'readwrite');
      tx.objectStore(storeName).clear();
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function(e) { reject(e.target.error); };
    });
  });
}

function _generateLocalId() {
  return 'loc_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
}

// =========================================================================
// 2. LOCAL QUEUE OPERATIONS
// =========================================================================

function saveToLocal(blob, meta) {
  var localId = _generateLocalId();
  var previewUrl = URL.createObjectURL(blob);
  var item = {
    localId: localId,
    batchId: '',
    category: meta.uploadType || 'dokumen',
    blob: blob,
    previewUrl: previewUrl,
    fileName: meta.fileName || '',
    sessionId: meta.sessionId || '',
    containerId: meta.containerId || '',
    jobId: meta.jobId || '',
    uploadType: meta.uploadType || 'dokumen',
    meta: meta,
    fileId: null,
    status: 'LOCAL_SAVED',
    attempts: 0,
    logAttempts: 0,
    errorMessage: '',
    errorType: '',
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  return _idbPut(STORE_QUEUE, item).then(function() {
    return item;
  });
}

function updateLocalItem(localId, updates) {
  return _idbGet(STORE_QUEUE, localId).then(function(item) {
    if (!item) return null;
    for (var key in updates) {
      if (updates.hasOwnProperty(key)) item[key] = updates[key];
    }
    item.updatedAt = Date.now();
    return _idbPut(STORE_QUEUE, item).then(function() { return item; });
  });
}

function removeFromLocal(localId) {
  return _idbDelete(STORE_QUEUE, localId);
}

function getLocalQueue(filter) {
  if (filter && filter.jobId) {
    return _idbGetAll(STORE_QUEUE).then(function(items) {
      return items.filter(function(i) { return i.jobId === filter.jobId; });
    });
  }
  if (filter && filter.status) {
    return _idbGetAll(STORE_QUEUE, 'status', filter.status);
  }
  if (filter && filter.containerId) {
    return _idbGetAll(STORE_QUEUE, 'containerId', filter.containerId);
  }
  if (filter && filter.batchId) {
    return _idbGetAll(STORE_QUEUE, 'batchId', filter.batchId);
  }
  return _idbGetAll(STORE_QUEUE);
}

function getLocalQueueForContainer(containerId, category) {
  return _idbGetAll(STORE_QUEUE, 'containerId', containerId).then(function(items) {
    if (!category) return items;
    return items.filter(function(i) { return i.category === category; });
  });
}

// =========================================================================
// 3. BATCH MANAGER
// =========================================================================
var BATCH_MAX_SIZE = 10;
var UPLOAD_PARALLEL = 4;

function createBatches(items, category, jobId) {
  var batches = [];
  var grouped = {};
  var order = ['dokumen', 'palet', 'suratjalan'];

  items.forEach(function(item) {
    var cat = item.category || item.uploadType || category || 'dokumen';
    if (!grouped[cat]) grouped[cat] = [];
    grouped[cat].push(item);
    if (order.indexOf(cat) < 0) order.push(cat);
  });

  order.forEach(function(cat) {
    var group = grouped[cat] || [];
    if (!group.length) return;
    var prefix = cat === 'palet' ? 'PAL' : cat === 'suratjalan' ? 'SJ' : 'DOK';
    var totalCategoryBatches = Math.ceil(group.length / BATCH_MAX_SIZE);

    for (var i = 0; i < group.length; i += BATCH_MAX_SIZE) {
      var batchNum = Math.floor(i / BATCH_MAX_SIZE) + 1;
      var batchId = prefix + '-BATCH-' + String(batchNum).padStart(3, '0') + '-' + Date.now();
      var chunk = group.slice(i, i + BATCH_MAX_SIZE);
      var label = 'Batch ' + getUploadCategoryLabel(cat) + ' ' + batchNum + '/' + totalCategoryBatches;
      batches.push({
        batchId: batchId,
        jobId: jobId || '',
        category: cat,
        label: label,
        categoryBatchNo: batchNum,
        categoryBatchTotal: totalCategoryBatches,
        sessionId: chunk[0] ? chunk[0].sessionId : '',
        containerId: chunk[0] ? chunk[0].containerId : '',
        totalItems: chunk.length,
        uploadedCount: 0,
        loggedCount: 0,
        syncPendingCount: 0,
        failedCount: 0,
        status: 'PENDING',
        phase: 'Menunggu',
        createdAt: Date.now(),
        completedAt: null,
        itemIds: chunk.map(function(c) { return c.localId; })
      });
      for (var j = 0; j < chunk.length; j++) {
        chunk[j].batchId = batchId;
        chunk[j].jobId = jobId || chunk[j].jobId || '';
        chunk[j].status = 'WAITING_BATCH';
      }
    }
  });
  return batches;
}

// =========================================================================
// 4. ERROR CLASSIFICATION
// =========================================================================
var RETRYABLE_PATTERNS = [
  'failed to fetch', 'networkerror', 'net::err_', 'timeout',
  'server tidak merespons', 'ratelimitexceeded', 'userratelimitexceeded',
  'backenderror', 'internalerror', 'load failed',
  'the internet connection appears to be offline'
];
var RETRYABLE_STATUSES = [408, 429, 500, 502, 503, 504];

function isRetryableError(error) {
  var msg = String(error && error.message || error || '').toLowerCase();
  var status = error && error.status || 0;
  if (!navigator.onLine) return true;
  for (var i = 0; i < RETRYABLE_STATUSES.length; i++) {
    if (status === RETRYABLE_STATUSES[i]) return true;
  }
  for (var j = 0; j < RETRYABLE_PATTERNS.length; j++) {
    if (msg.indexOf(RETRYABLE_PATTERNS[j]) >= 0) return true;
  }
  return false;
}

function classifyDriveError(error) {
  var status = error && error.status || 0;
  var body = String(error && error.body || '').toLowerCase();
  var msg = String(error && error.message || error || '');

  if (status === 400) return { type: 'PERMANENT', message: 'Request tidak valid: ' + msg };
  if (status === 403 && body.indexOf('storagequotaexceeded') >= 0) return { type: 'PERMANENT', message: 'Storage Google Drive penuh' };
  if (status === 403 && body.indexOf('ratelimitexceeded') < 0) return { type: 'PERMANENT', message: 'Tidak punya akses ke folder Drive' };
  if (status === 404) return { type: 'PERMANENT', message: 'Folder Drive tidak ditemukan' };
  if (status === 401) return { type: 'RETRYABLE', message: 'Token expired, mencoba refresh...' };
  if (status === 429) return { type: 'RETRYABLE', message: 'Terlalu banyak request, menunggu...' };
  if (status >= 500) return { type: 'RETRYABLE', message: 'Server Drive error' };
  if (!navigator.onLine) return { type: 'RETRYABLE', message: 'Tidak ada koneksi internet' };
  if (msg.toLowerCase().indexOf('abort') >= 0) return { type: 'RETRYABLE', message: 'Jaringan lambat, masih mencoba...' };
  return { type: 'RETRYABLE', message: msg || 'Upload gagal' };
}

function isManualActionStatus(status) {
  return status === 'WAITING_MANUAL_RETRY'
    || status === 'FAILED_UPLOAD'
    || status === 'FAILED_UPLOAD_MANUAL'
    || status === 'FAILED_LOG_MANUAL'
    || status === 'NEED_USER_ACTION';
}

function getUploadStatusMessage(item) {
  var status = item && item.status;
  if (status === 'PREPARING') return 'Menyiapkan foto...';
  if (status === 'COMPRESSING') return 'Mengompres foto...';
  if (status === 'UPLOADING') return 'Mengirim foto...';
  if (status === 'SLOW_NETWORK') return 'Jaringan lambat, masih mencoba...';
  if (status === 'OFFLINE_PAUSED') return 'Koneksi terputus. Upload dijeda.';
  if (status === 'ONLINE_RESUMING') return 'Koneksi kembali. Melanjutkan upload...';
  if (status === 'RETRY_1_WAITING') return 'Mencoba ulang 1/2 dalam 2 detik...';
  if (status === 'RETRY_2_WAITING') return 'Mencoba ulang 2/2 dalam 4 detik...';
  if (status === 'WAITING_MANUAL_RETRY') return 'Gagal dikirim. Ketuk untuk kirim ulang.';
  if (status === 'LOG_PENDING' || status === 'UPLOAD_SUCCESS') return 'File sudah masuk Drive, sedang menyimpan data ke sistem...';
  if (status === 'SYNC_PENDING') return 'Data tersimpan. Menyinkronkan tampilan aplikasi...';
  if (status === 'FAILED_LOG') return 'Data belum tersimpan ke sistem. Simpan Data ke Sistem.';
  if (status === 'FAILED_UPLOAD_MANUAL') return 'Gagal dikirim. Periksa koneksi atau coba lagi.';
  if (status === 'FAILED_LOG_MANUAL') return 'File masuk Drive, data belum tersimpan ke sistem. Simpan Data ke Sistem.';
  if (status === 'NEED_USER_ACTION') return 'Butuh tindakan. Pilih coba lagi, simpan nanti, atau hapus.';
  if (status === 'FINAL_SYNCED') return 'Tersimpan final.';
  if (status === 'DONE') return 'Terkirim.';
  return item && item.errorMessage ? item.errorMessage : 'Menunggu...';
}

// =========================================================================
// 5. RETRY LOGIC — Max 2 Auto + Manual
// =========================================================================
var RETRY_DELAYS = [2000, 4000]; // 2 detik, 4 detik
var MAX_AUTO_RETRY = 2;
var LOG_RETRY_DELAYS = [3000, 6000]; // 3 detik, 6 detik
var MAX_LOG_AUTO_RETRY = 2;

// Active retry timers per localId — prevents double retry
var _activeRetryTimers = {};

function scheduleAutoRetryItem(localId, attemptNum) {
  if (attemptNum > MAX_AUTO_RETRY) return;
  if (_activeRetryTimers[localId]) clearTimeout(_activeRetryTimers[localId]);

  var delay = RETRY_DELAYS[attemptNum - 1] || 4000;

  updateLocalItem(localId, {
    status: 'RETRY_' + attemptNum + '_WAITING',
    errorMessage: 'Mencoba ulang ' + attemptNum + '/' + MAX_AUTO_RETRY + ' dalam ' + Math.round(delay / 1000) + ' detik'
  }).then(function() {
    renderLocalThumbnails();
    _activeRetryTimers[localId] = setTimeout(function() {
      delete _activeRetryTimers[localId];
      executeRetryUpload(localId, false);
    }, delay);
  });
}

function cancelAutoRetryItem(localId) {
  if (_activeRetryTimers[localId]) {
    clearTimeout(_activeRetryTimers[localId]);
    delete _activeRetryTimers[localId];
  }
}

// =========================================================================
// 6. UPLOAD PIPELINE — Core Upload Flow
// =========================================================================
var _uploadPipelineActive = false;
var _currentCredentials = null;
var _credentialMetaKey = '';
var _credentialsExpiresAt = 0;
var _credentialRefreshPromise = null;
var TOKEN_REFRESH_EARLY_MS = 5 * 60 * 1000;
var TOKEN_DEFAULT_TTL_MS = 50 * 60 * 1000;

function resetUploadTokenManager(meta) {
  _currentCredentials = null;
  _credentialMetaKey = meta ? buildCredentialMetaKey(meta) : '';
  _credentialsExpiresAt = 0;
  _credentialRefreshPromise = null;
}

function buildCredentialMetaKey(meta) {
  meta = meta || {};
  return [
    meta.sessionId || '',
    meta.containerId || '',
    meta.uploadType || '',
    meta.fleetNo || ''
  ].join('|');
}

async function ensureManagedUploadCredentials(meta, forceRefresh) {
  var key = buildCredentialMetaKey(meta);
  var now = Date.now();
  if (_credentialRefreshPromise) return _credentialRefreshPromise;
  if (!forceRefresh && _currentCredentials && _credentialMetaKey === key && now < (_credentialsExpiresAt - TOKEN_REFRESH_EARLY_MS)) {
    return _currentCredentials;
  }

  _credentialRefreshPromise = getUploadCredentials(meta).then(function(credentials) {
    _currentCredentials = credentials;
    _credentialMetaKey = key;
    var ttlMs = credentials && credentials.expiresIn ? Number(credentials.expiresIn) * 1000 : TOKEN_DEFAULT_TTL_MS;
    _credentialsExpiresAt = Date.now() + ttlMs;
    return _currentCredentials;
  }).finally(function() {
    _credentialRefreshPromise = null;
  });

  return _credentialRefreshPromise;
}

function createFolderMissingError(uploadType) {
  var err = new Error('Folder untuk ' + uploadType + ' tidak ditemukan');
  err.status = 404;
  return err;
}

function createTimeoutError() {
  var err = new Error('Jaringan lambat, request upload melebihi batas waktu');
  err.status = 408;
  return err;
}

function driveUploadWithTimeout(item, folderId, token) {
  return new Promise(function(resolve, reject) {
    var done = false;
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var slowTimer = setTimeout(function() {
      if (done) return;
      updateLocalItem(item.localId, {
        status: 'SLOW_NETWORK',
        errorMessage: 'Jaringan lambat, masih mencoba...'
      }).then(function() {
        renderLocalThumbnails();
        renderUploadTrackerV2();
      });
    }, DRIVE_SLOW_NOTICE_MS);
    var timeoutTimer = setTimeout(function() {
      if (done) return;
      done = true;
      clearTimeout(slowTimer);
      if (controller) {
        try { controller.abort(); } catch(e) {}
      }
      reject(createTimeoutError());
    }, DRIVE_UPLOAD_TIMEOUT_MS);

    directUploadToDrive(item.blob, item.fileName, folderId, token, null, controller ? { signal: controller.signal } : null)
      .then(function(fileId) {
        if (done) return;
        done = true;
        clearTimeout(slowTimer);
        clearTimeout(timeoutTimer);
        resolve(fileId);
      })
      .catch(function(err) {
        if (done) return;
        done = true;
        clearTimeout(slowTimer);
        clearTimeout(timeoutTimer);
        reject(err);
      });
  });
}

async function uploadFileWithManagedToken(item) {
  await ensureOnlineBeforeUpload(item.localId);
  var credentials = await ensureManagedUploadCredentials(item.meta, false);
  var folderId = credentials && credentials.folderIds ? credentials.folderIds[item.uploadType] : '';
  if (!folderId) throw createFolderMissingError(item.uploadType);

  try {
    return await driveUploadWithTimeout(item, folderId, credentials.token);
  } catch (e) {
    if (e && e.status === 401) {
      credentials = await ensureManagedUploadCredentials(item.meta, true);
      folderId = credentials && credentials.folderIds ? credentials.folderIds[item.uploadType] : '';
      if (!folderId) throw createFolderMissingError(item.uploadType);
      return await driveUploadWithTimeout(item, folderId, credentials.token);
    }
    throw e;
  }
}

async function deprecatedExecuteBatchUploadLegacy_(batch) {
  // Update batch status
  batch.status = 'IN_PROGRESS';
  await _idbPut(STORE_BATCH, batch);

  // Get all items for this batch
  var items = await getLocalQueue({ batchId: batch.batchId });
  items = items.filter(function(i) {
    return i.status === 'WAITING_BATCH' || i.status === 'READY_TO_UPLOAD';
  });

  if (items.length === 0) {
    batch.status = 'COMPLETED';
    batch.completedAt = Date.now();
    await _idbPut(STORE_BATCH, batch);
    return;
  }

  // Get credentials
  if (!_currentCredentials) {
    try {
      _currentCredentials = await getUploadCredentials(items[0].meta);
    } catch (e) {
      // All items in batch fail — retryable
      for (var fi = 0; fi < items.length; fi++) {
        await updateLocalItem(items[fi].localId, {
          status: 'WAITING_MANUAL_RETRY',
          attempts: items[fi].attempts + 1,
          errorMessage: 'Gagal mendapat akses Drive: ' + (e.message || e),
          errorType: 'RETRYABLE'
        });
      }
      batch.status = 'FAILED';
      batch.failedCount = items.length;
      await _idbPut(STORE_BATCH, batch);
      renderLocalThumbnails();
      renderUploadTrackerV2();
      return;
    }
  }

  // Parallel upload workers
  var cursor = 0;
  var successItems = [];
  var concurrency = Math.min(UPLOAD_PARALLEL, items.length);

  async function worker() {
    while (cursor < items.length) {
      var idx = cursor++;
      var item = items[idx];

      await updateLocalItem(item.localId, { status: 'UPLOADING' });
      renderLocalThumbnails();

      var folderId = _currentCredentials.folderIds[item.uploadType];
      if (!folderId) {
        await updateLocalItem(item.localId, {
          status: 'FAILED_UPLOAD',
          errorMessage: 'Folder untuk ' + item.uploadType + ' tidak ditemukan',
          errorType: 'PERMANENT'
        });
        batch.failedCount++;
        renderLocalThumbnails();
        continue;
      }

      try {
        var fileId = await directUploadToDrive(
          item.blob, item.fileName, folderId, _currentCredentials.token, item.meta
        );
        if (!fileId || typeof fileId !== 'string' || !fileId.trim()) {
          throw new Error('Drive API return fileId kosong');
        }
        fileId = fileId.trim();

        await updateLocalItem(item.localId, {
          status: 'UPLOAD_SUCCESS',
          fileId: fileId,
          attempts: item.attempts + 1
        });
        batch.uploadedCount++;
        successItems.push(item.localId);

      } catch (e) {
        var classified = classifyDriveError(e);
        var newAttempts = item.attempts + 1;

        if (classified.type === 'RETRYABLE' && newAttempts <= MAX_AUTO_RETRY) {
          // Schedule auto retry
          await updateLocalItem(item.localId, {
            attempts: newAttempts,
            errorMessage: classified.message,
            errorType: 'RETRYABLE'
          });
          scheduleAutoRetryItem(item.localId, newAttempts);
        } else if (classified.type === 'RETRYABLE') {
          // Max auto retry reached — manual retry
          await updateLocalItem(item.localId, {
            status: 'WAITING_MANUAL_RETRY',
            attempts: newAttempts,
            errorMessage: classified.message,
            errorType: 'RETRYABLE'
          });
          batch.failedCount++;
        } else {
          // Permanent error
          await updateLocalItem(item.localId, {
            status: 'FAILED_UPLOAD',
            attempts: newAttempts,
            errorMessage: classified.message,
            errorType: 'PERMANENT'
          });
          batch.failedCount++;
        }
      }

      await _idbPut(STORE_BATCH, batch);
      renderUploadTrackerV2();
      renderLocalThumbnails();
    }
  }

  var workers = [];
  for (var w = 0; w < concurrency; w++) workers.push(worker());
  await Promise.all(workers);

  // === LOG TO SHEET per batch ===
  if (successItems.length > 0) {
    await flushBatchLog(batch, successItems);
  }

  // Update batch final status
  if (batch.failedCount === 0 && batch.uploadedCount === batch.totalItems) {
    batch.status = 'COMPLETED';
  } else if (batch.uploadedCount > 0) {
    batch.status = 'PARTIAL_FAIL';
  } else {
    batch.status = 'FAILED';
  }
  batch.completedAt = Date.now();
  await _idbPut(STORE_BATCH, batch);
}

async function executeBatchUpload(batch, job) {
  var traceId = (job && job.traceId) || batch.traceId || '';
  crudTrace('uploadPhoto', traceId, 'batch_start', { batchId: batch.batchId, total: batch.totalItems });
  batch.status = 'IN_PROGRESS';
  batch.phase = 'Mengambil akses Drive';
  setUploadJobStatus(job || _activeUploadJob, 'UPLOADING');
  setActiveBatchProgress(batch, batch.phase, 0, batch.totalItems);
  await _idbPut(STORE_BATCH, batch);
  renderUploadTrackerV2();

  var items = await getLocalQueue({ batchId: batch.batchId });
  items = items.filter(function(i) {
    return i.status === 'WAITING_BATCH' || i.status === 'READY_TO_UPLOAD';
  });

  if (items.length === 0) {
    batch.status = 'COMPLETED';
    batch.phase = 'Selesai';
    batch.completedAt = Date.now();
    await _idbPut(STORE_BATCH, batch);
    return;
  }

  if (!navigator.onLine) {
    await ensureOnlineBeforeUpload(items[0].localId);
  }

  try {
    crudTrace('uploadPhoto', traceId, 'drive_credentials_start', { batchId: batch.batchId });
    await ensureManagedUploadCredentials(items[0].meta, false);
    crudTrace('uploadPhoto', traceId, 'drive_credentials_end', { batchId: batch.batchId });
  } catch (e) {
    crudTrace('uploadPhoto', traceId, 'drive_credentials_error', { batchId: batch.batchId, message: e && e.message ? e.message : String(e) });
    for (var fi = 0; fi < items.length; fi++) {
      var failAttempts = items[fi].attempts + 1;
      await updateLocalItem(items[fi].localId, {
        attempts: failAttempts,
        errorMessage: 'Gagal mendapat akses Drive: ' + (e.message || e),
        errorType: 'RETRYABLE'
      });
      if (failAttempts <= MAX_AUTO_RETRY) {
        scheduleAutoRetryItem(items[fi].localId, failAttempts);
      } else {
        await updateLocalItem(items[fi].localId, { status: 'WAITING_MANUAL_RETRY' });
      }
    }
    batch.status = 'FAILED';
    batch.phase = 'Sebagian gagal';
    batch.failedCount = items.length;
    await _idbPut(STORE_BATCH, batch);
    setUploadJobStatus(job || _activeUploadJob, 'PARTIAL_FAILED');
    renderLocalThumbnails();
    renderUploadTrackerV2();
    return;
  }

  batch.phase = 'Mengirim foto';
  setActiveBatchProgress(batch, batch.phase, 0, items.length);
  await _idbPut(STORE_BATCH, batch);

  var cursor = 0;
  var successItems = [];
  var completedInBatch = 0;
  var concurrency = Math.min(UPLOAD_PARALLEL, items.length);
  crudTrace('uploadPhoto', traceId, 'drive_upload_start', { batchId: batch.batchId, items: items.length });

  async function worker() {
    while (cursor < items.length) {
      var idx = cursor++;
      var item = items[idx];

      await updateLocalItem(item.localId, { status: 'UPLOADING' });
      renderLocalThumbnails();

      try {
        var fileId = await uploadFileWithManagedToken(item);
        if (!fileId || typeof fileId !== 'string' || !fileId.trim()) {
          throw new Error('Drive API return fileId kosong');
        }
        fileId = fileId.trim();

        await updateLocalItem(item.localId, {
          status: 'UPLOAD_SUCCESS',
          fileId: fileId,
          attempts: item.attempts + 1
        });
        batch.uploadedCount++;
        successItems.push(item.localId);

      } catch (e) {
        var classified = classifyDriveError(e);
        var newAttempts = item.attempts + 1;

        if (classified.type === 'RETRYABLE' && newAttempts <= MAX_AUTO_RETRY) {
          await updateLocalItem(item.localId, {
            attempts: newAttempts,
            errorMessage: classified.message,
            errorType: 'RETRYABLE'
          });
          scheduleAutoRetryItem(item.localId, newAttempts);
        } else if (classified.type === 'RETRYABLE') {
          await updateLocalItem(item.localId, {
            status: 'WAITING_MANUAL_RETRY',
            attempts: newAttempts,
            errorMessage: classified.message,
            errorType: 'RETRYABLE'
          });
          batch.failedCount++;
        } else {
          await updateLocalItem(item.localId, {
            status: 'FAILED_UPLOAD',
            attempts: newAttempts,
            errorMessage: classified.message,
            errorType: 'PERMANENT'
          });
          batch.failedCount++;
        }
      }

      completedInBatch++;
      setActiveBatchProgress(batch, batch.phase, completedInBatch, items.length);
      await _idbPut(STORE_BATCH, batch);
      renderUploadTrackerV2();
      renderLocalThumbnails();
    }
  }

  var workers = [];
  for (var w = 0; w < concurrency; w++) workers.push(worker());
  await Promise.all(workers);
  crudTrace('uploadPhoto', traceId, 'drive_upload_end', { batchId: batch.batchId, uploaded: successItems.length, failed: batch.failedCount || 0 });

  if (successItems.length > 0) {
      batch.phase = 'Menyimpan data ke sistem';
    setUploadJobStatus(job || _activeUploadJob, 'LOG_PENDING');
    setActiveBatchProgress(batch, batch.phase, successItems.length, successItems.length);
    await _idbPut(STORE_BATCH, batch);
    renderUploadTrackerV2();
    await flushBatchLog(batch, successItems);
  }

  if (batch.syncPendingCount > 0) {
    batch.status = 'SYNC_PENDING';
    batch.phase = 'Menunggu sinkronisasi tampilan';
    setUploadJobStatus(job || _activeUploadJob, 'SYNC_PENDING', { syncPendingCount: batch.syncPendingCount });
  } else if (batch.failedCount === 0 && batch.loggedCount === batch.totalItems) {
    batch.status = 'COMPLETED';
    batch.phase = 'Selesai';
  } else if (batch.uploadedCount > 0 || batch.failedCount > 0) {
    batch.status = 'PARTIAL_FAIL';
    batch.phase = 'Sebagian gagal';
    setUploadJobStatus(job || _activeUploadJob, 'PARTIAL_FAILED');
  } else {
    batch.status = 'FAILED';
    batch.phase = 'Gagal';
    setUploadJobStatus(job || _activeUploadJob, 'FAILED');
  }
  batch.completedAt = Date.now();
  await _idbPut(STORE_BATCH, batch);
}

async function executeRetryUpload(localId, isManual) {
  var item = await _idbGet(STORE_QUEUE, localId);
  if (!item) return;
  if (isPaletMissingDetails_(item) && (item.blob || item.fileId || item.status !== 'FAILED_UPLOAD')) {
    if (!isManual) {
      await markPaletItemsNeedUserAction_([item]);
      renderLocalThumbnails();
      renderUploadTrackerV2();
      return;
    }
    var draftKeySuffix = getPaletDraftSuffixForItems_([item], 'item_' + localId);
    var paletDetails = await promptPaletDetailsWithDraft([item], draftKeySuffix);
    if (!paletDetails) {
      await markPaletItemsNeedUserAction_([item]);
      renderLocalThumbnails();
      renderUploadTrackerV2();
      return;
    }
    var updatedItems = await applyPaletDetailsToLocalItems_([item], paletDetails, draftKeySuffix);
    item = (updatedItems && updatedItems[0]) || await _idbGet(STORE_QUEUE, localId);
    renderLocalThumbnails();
    renderUploadTrackerV2();
    if (!item) return;
  }
  if (item.status === 'UPLOADING') return;
  if (item.status === 'SYNC_PENDING') {
    await finalizeSyncPendingItems(item.jobId, true);
    return;
  }
  if (item.fileId && (item.status === 'FAILED_LOG' || item.status === 'FAILED_LOG_MANUAL' || item.status === 'NEED_USER_ACTION' || item.status === 'UPLOAD_SUCCESS' || item.status === 'LOG_PENDING' || item.failureStage === 'log')) {
    await logSingleItemToSheet(localId, isManual);
    return;
  }
  if (!item.blob) {
    await updateLocalItem(localId, {
      status: 'FAILED_UPLOAD',
      failureStage: 'upload',
      errorMessage: 'File lokal tidak tersedia. Pilih ulang foto dari kamera/galeri.',
      errorType: 'PERMANENT'
    });
    renderLocalThumbnails();
    renderUploadTrackerV2();
    return;
  }

  await updateLocalItem(localId, { status: 'UPLOADING' });
  renderLocalThumbnails();
  renderUploadTrackerV2();

  try {
    var fileId = await uploadFileWithManagedToken(item);
    if (!fileId || typeof fileId !== 'string' || !fileId.trim()) {
      throw new Error('Drive API return fileId kosong');
    }
    fileId = fileId.trim();

    await updateLocalItem(localId, {
      status: 'UPLOAD_SUCCESS',
      fileId: fileId
    });

    await logSingleItemToSheet(localId);

  } catch (e) {
    var classified = classifyDriveError(e);
    var attempts = item.attempts + 1;
    await updateLocalItem(localId, { attempts: attempts });

    if (!isManual && classified.type === 'RETRYABLE' && attempts <= MAX_AUTO_RETRY) {
      scheduleAutoRetryItem(localId, attempts);
    } else {
      await updateLocalItem(localId, {
        status: isManual ? 'NEED_USER_ACTION' : (classified.type === 'PERMANENT' ? 'FAILED_UPLOAD' : 'WAITING_MANUAL_RETRY'),
        failureStage: isManual ? 'upload' : '',
        manualStatus: isManual ? 'FAILED_UPLOAD_MANUAL' : '',
        errorMessage: classified.message,

async function flushBatchLog(batch, successLocalIds) {
  // Gather all success items
  var logItems = [];
  for (var i = 0; i < successLocalIds.length; i++) {
    var item = await _idbGet(STORE_QUEUE, successLocalIds[i]);
    if (!item || !item.fileId) continue;
    await updateLocalItem(item.localId, { status: 'LOG_PENDING' });
    logItems.push({
      localId: item.localId,
      jobId: item.jobId || batch.jobId || (item.meta && item.meta.jobId) || '',
      sessionId: item.sessionId || (item.meta && item.meta.sessionId) || '',
      fileId: item.fileId,
      containerId: item.containerId,
      type: item.uploadType,
      fileName: item.fileName,
      paletName: (item.meta && item.meta.paletName) || '',
      paletKoli: (item.meta && item.meta.paletKoli) || ''
    });
  }

  if (logItems.length === 0) return;

  var firstItem = await _idbGet(STORE_QUEUE, successLocalIds[0]);
  var meta = firstItem ? firstItem.meta : {};
  var traceId = meta && meta.traceId;
  crudTrace('uploadPhoto', traceId, 'log_sheet_client_start', { batchId: batch.batchId, items: logItems.length });

  // Try logging with auto retry
  var logSuccess = false;
  var lastLogRes = null;
  for (var attempt = 0; attempt <= MAX_LOG_AUTO_RETRY; attempt++) {
    try {
      crudTrace('uploadPhoto', traceId, 'log_sheet_client_attempt', { attempt: attempt + 1 });
      var logRes = assertGasSuccess(await gasRun('logDirectUploads', [{ meta: meta, items: logItems }], 30000), 'Log ke Sheet gagal');
      lastLogRes = logRes;
      crudTrace('uploadPhoto', traceId, 'log_sheet_server_ack', {
        rowsWritten: logRes.rowsWritten,
        duplicateCount: logRes.duplicateCount,
        invalidCount: logRes.invalidCount
      });
      logSuccess = true;
      break;
    } catch (e) {
      if (attempt < MAX_LOG_AUTO_RETRY) {
        var delay = LOG_RETRY_DELAYS[attempt] || 6000;
        await new Promise(function(r) { setTimeout(r, delay); });
      }
    }
  }

  if (logSuccess) {
    crudTrace('uploadPhoto', traceId, 'log_sheet_client_success', { batchId: batch.batchId, items: successLocalIds.length });
    showDrivePublicWarning_(lastLogRes && lastLogRes.publicWarning);
    // Data sudah masuk Sheet; tahan thumbnail lokal sampai hasil sync menampilkan fileId yang sama.
    for (var si = 0; si < successLocalIds.length; si++) {
      await updateLocalItem(successLocalIds[si], { status: 'SYNC_PENDING' });
    }
    batch.loggedCount = (batch.loggedCount || 0) + successLocalIds.length;
    await _idbPut(STORE_BATCH, batch);

    batch.phase = 'Sinkronisasi tampilan';
    setActiveBatchProgress(batch, batch.phase, successLocalIds.length, successLocalIds.length);
    var finalSync = await finalizeLoggedItemsAfterSync_(successLocalIds, logItems, _activeUploadJob, traceId);
    batch.syncPendingCount = finalSync.pendingCount || 0;
    if (finalSync.success) {
      batch.phase = 'Tersimpan final';
    } else {
      batch.status = 'SYNC_PENDING';
      batch.phase = 'Menunggu sinkronisasi tampilan';
      setUploadJobStatus(_activeUploadJob, 'SYNC_PENDING', { syncPendingCount: batch.syncPendingCount });
    }
    await _idbPut(STORE_BATCH, batch);
  } else {
    crudTrace('uploadPhoto', traceId, 'log_sheet_client_pending_queue', { batchId: batch.batchId, items: logItems.length });
    // Log failed — move to pending log queue
    for (var pi = 0; pi < logItems.length; pi++) {
      var pendingItem = {
        localId: logItems[pi].localId,
        batchId: batch.batchId,
        jobId: batch.jobId || meta.jobId || '',
        sessionId: meta.sessionId || '',
        containerId: logItems[pi].containerId,
        uploadType: logItems[pi].type,
        fileId: logItems[pi].fileId,
        fileName: logItems[pi].fileName,
        paletName: logItems[pi].paletName || '',
        paletKoli: logItems[pi].paletKoli || '',
        meta: meta,
        attempts: MAX_LOG_AUTO_RETRY + 1,
        status: 'FAILED',
        errorMessage: 'Data gagal tersimpan ke sistem setelah ' + (MAX_LOG_AUTO_RETRY + 1) + ' percobaan',
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
      await _idbPut(STORE_PENDING_LOG, pendingItem);
      await updateLocalItem(logItems[pi].localId, { status: 'FAILED_LOG' });
    }
    batch.failedCount = (batch.failedCount || 0) + logItems.length;
    batch.status = 'PARTIAL_FAIL';
    batch.phase = 'Data pending';
    setUploadJobStatus(_activeUploadJob, 'PARTIAL_FAILED');
    await _idbPut(STORE_BATCH, batch);
  }

  renderLocalThumbnails();
  renderUploadTrackerV2();
}

async function retryPendingLogs(jobId, isManual) {
  var pending = await _idbGetAll(STORE_PENDING_LOG);
  if (jobId) {
    pending = pending.filter(function(p) { return p.jobId === jobId || (p.meta && p.meta.jobId === jobId); });
  }
  if (pending.length === 0) {
    Toast.fire({ icon: 'info', title: 'Tidak ada data pending' });
    return;
  }

  var groups = {};
  pending.forEach(function(p) {
    var key = [
      p.sessionId || (p.meta && p.meta.sessionId) || '',
      p.containerId || '',
      p.uploadType || '',
      p.batchId || ''
    ].join('|');
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });

  var saved = 0;
  var failed = 0;
  var syncPending = 0;
  var keys = Object.keys(groups);

  for (var g = 0; g < keys.length; g++) {
    var group = groups[keys[g]];
    var meta = group[0].meta || {};
    var logItems = group.map(function(p) {
      return {
        localId: p.localId || '',
        jobId: p.jobId || (p.meta && p.meta.jobId) || '',
        sessionId: p.sessionId || (p.meta && p.meta.sessionId) || '',
        fileId: p.fileId,
        containerId: p.containerId,
        type: p.uploadType,
        fileName: p.fileName,
        paletName: p.paletName || (p.meta && p.meta.paletName) || '',
        paletKoli: p.paletKoli || (p.meta && p.meta.paletKoli) || ''
      };
    });

    try {
      var logRes = assertGasSuccess(await gasRun('logDirectUploads', [{ meta: meta, items: logItems }], 30000), 'Log ke Sheet gagal');
      crudTrace('uploadPhoto', meta && meta.traceId, 'log_sheet_server_ack_retry', {
        rowsWritten: logRes.rowsWritten,
        duplicateCount: logRes.duplicateCount,
        invalidCount: logRes.invalidCount
      });
      showDrivePublicWarning_(logRes && logRes.publicWarning);
      var groupLocalIds = [];
      for (var i = 0; i < group.length; i++) {
        await _idbDelete(STORE_PENDING_LOG, group[i].localId);
        await updateLocalItem(group[i].localId, { status: 'SYNC_PENDING' });
        groupLocalIds.push(group[i].localId);
      }
      var finalSync = await finalizeLoggedItemsAfterSync_(groupLocalIds, logItems, _activeUploadJob, meta && meta.traceId);
      saved += finalSync.finalizedCount || 0;
      if (!finalSync.success) syncPending += finalSync.pendingCount || 0;
    } catch (e) {
      failed += group.length;
      if (isManual !== false) {
        for (var fi = 0; fi < group.length; fi++) {
          await updateLocalItem(group[fi].localId, {
            status: 'NEED_USER_ACTION',
            failureStage: 'log',
            manualStatus: 'FAILED_LOG_MANUAL',
            errorMessage: 'File masuk Drive, data belum tersimpan ke sistem. Simpan Data ke Sistem.'
          });
        }
      }
    }
  }

  if (failed > 0) {
    Toast.fire({ icon: 'error', title: failed + ' data masih gagal disimpan' });
  } else if (syncPending > 0) {
    Toast.fire({ icon: 'warning', title: syncPending + ' foto tersimpan, tampilan belum final' });
  } else {
    Toast.fire({ icon: 'success', title: saved + ' data berhasil disimpan' });
  }

  renderLocalThumbnails();
  renderUploadTrackerV2();
}

function handleRetryPhoto(localId) {
  cancelAutoRetryItem(localId);
  _idbGet(STORE_QUEUE, localId).then(function(item) {
    if (!item) return;
    if (item.status === 'UPLOADING') return;
    if (item.status === 'SYNC_PENDING') {
      finalizeSyncPendingItems(item.jobId, true);
      return;
    }
    if (item.status === 'FAILED_LOG' || item.status === 'FAILED_LOG_MANUAL' || (item.status === 'NEED_USER_ACTION' && item.failureStage === 'log')) {
      retryPendingLogs(item.jobId, true);
      return;
    }
    executeRetryUpload(localId, true);
  });
}

function handleRetryAll(jobId) {
  getLocalQueue().then(async function(items) {
    if (jobId) items = items.filter(function(i) { return i.jobId === jobId; });
    var retryable = items.filter(function(i) {
      return i.status === 'FAILED_LOG' || isManualActionStatus(i.status);
    });
    if (retryable.length === 0) {
      Toast.fire({ icon: 'info', title: 'Tidak ada foto gagal' });
      return;
    }

    // Separate upload failures from log failures
    var uploadFails = retryable.filter(function(i) { return i.status !== 'FAILED_LOG' && i.failureStage !== 'log'; });
    var logFails = retryable.filter(function(i) { return i.status === 'FAILED_LOG' || i.failureStage === 'log'; });
    var paletMissing = sortPaletItemsForPrompt_(uploadFails.filter(isPaletMissingDetails_));
    if (paletMissing.length > 0) {
      var draftKeySuffix = getPaletDraftSuffixForItems_(paletMissing, jobId ? ('job_' + jobId) : 'retry_all_' + Date.now());
      var paletDetails = await promptPaletDetailsWithDraft(paletMissing, draftKeySuffix);
      if (paletDetails) {
        await applyPaletDetailsToLocalItems_(paletMissing, paletDetails, draftKeySuffix);
      } else {
        await markPaletItemsNeedUserAction_(paletMissing);
        var missingIds = {};
        paletMissing.forEach(function(item) { missingIds[item.localId] = true; });
        uploadFails = uploadFails.filter(function(item) { return !missingIds[item.localId]; });
      }
    }

    var cursor = 0;
    async function retryWorker() {
      while (cursor < uploadFails.length) {
        var item = uploadFails[cursor++];
        cancelAutoRetryItem(item.localId);
        await executeRetryUpload(item.localId, true);
      }
    }
    var workers = [];
    for (var w = 0; w < Math.min(UPLOAD_PARALLEL, uploadFails.length); w++) workers.push(retryWorker());
    await Promise.all(workers);

    if (logFails.length > 0) {
      retryPendingLogs(jobId, true);
    }
  });
}

var PALET_DRAFT_STORAGE_PREFIX = 'inlens_palet_upload_draft_v1:';
var PALET_DRAFT_ITEM_PREFIX = 'inlens_palet_upload_item_draft_v1:';

function getPaletDraftKey_(draftKeySuffix) {
  return PALET_DRAFT_STORAGE_PREFIX + String(draftKeySuffix || 'default');
}

function getPaletItemDraftKey_(localId) {
  return PALET_DRAFT_ITEM_PREFIX + String(localId || '');
}

function readPaletDraftJson_(key) {
  if (!key) return null;
  try {
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function writePaletDraftJson_(key, value) {
  if (!key) return;
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {}
}

function removePaletDraftKey_(key) {
  if (!key) return;
  try { localStorage.removeItem(key); } catch (e) {}
}

function isPaletMissingDetails_(item) {
  if (!item) return false;
  var type = item.uploadType || item.category || (item.meta && item.meta.uploadType);
  var meta = item.meta || {};
  return type === 'palet' && !cleanPaletName(meta.paletName || item.paletName || '');
}

function sortPaletItemsForPrompt_(items) {
  return (items || []).slice().sort(function(a, b) {
    var ai = Number(a && a.meta && a.meta.sourceIndex);
    var bi = Number(b && b.meta && b.meta.sourceIndex);
    if (!isFinite(ai)) ai = 999999;
    if (!isFinite(bi)) bi = 999999;
    if (ai !== bi) return ai - bi;
    return String((a && a.localId) || '').localeCompare(String((b && b.localId) || ''));
  });
}

function getPaletDraftSuffixForItems_(items, fallback) {
  items = items || [];
  if (items.length === 1 && items[0] && items[0].localId) return 'item_' + items[0].localId;
  var jobId = '';
  for (var i = 0; i < items.length; i++) {
    var current = items[i] && (items[i].jobId || (items[i].meta && items[i].meta.jobId));
    if (!current) return fallback || 'draft';
    if (!jobId) jobId = current;
    if (jobId !== current) return fallback || 'draft';
  }
  return jobId ? 'job_' + jobId : (fallback || 'draft');
}

function getPaletDraftDefaults_(items, draftKeySuffix) {
  items = items || [];
  var groupDraft = readPaletDraftJson_(getPaletDraftKey_(draftKeySuffix)) || {};
  var groupRows = Array.isArray(groupDraft) ? groupDraft : (groupDraft.items || []);
  var groupByLocalId = {};
  for (var g = 0; g < groupRows.length; g++) {
    var row = groupRows[g] || {};
    if (row.localId) groupByLocalId[row.localId] = row;
  }

  return items.map(function(item, index) {
    var localId = item && item.localId;
    var meta = (item && item.meta) || {};
    var itemDraft = localId ? (readPaletDraftJson_(getPaletItemDraftKey_(localId)) || {}) : {};
    var groupRow = (localId && groupByLocalId[localId]) || groupRows[index] || {};
    var name = meta.paletName || item.paletName || itemDraft.paletName || groupRow.paletName || '';
    var koli = meta.paletKoli || item.paletKoli || itemDraft.paletKoli || groupRow.paletKoli || '';
    return {
      paletName: cleanPaletName(name),
      paletKoli: cleanPaletKoli(koli) || ''
    };
  });
}

function savePaletDetailsDraft_(items, draftKeySuffix, values) {
  items = items || [];
  values = values || [];
  var rows = values.map(function(value, index) {
    var item = items[index] || {};
    var row = {
      localId: item.localId || '',
      fileName: item.fileName || '',
      sourceIndex: item.meta && item.meta.sourceIndex,
      paletName: cleanPaletName(value && value.paletName),
      paletKoli: cleanPaletKoli(value && value.paletKoli) || ''
    };
    if (row.localId) writePaletDraftJson_(getPaletItemDraftKey_(row.localId), row);
    return row;
  });
  writePaletDraftJson_(getPaletDraftKey_(draftKeySuffix), {
    updatedAt: Date.now(),
    items: rows
  });
}

function clearPaletDetailsDraft_(items, draftKeySuffix) {
  removePaletDraftKey_(getPaletDraftKey_(draftKeySuffix));
  (items || []).forEach(function(item) {
    if (item && item.localId) removePaletDraftKey_(getPaletItemDraftKey_(item.localId));
  });
}

function collectPaletModalValues_() {
  var rows = Array.prototype.slice.call(document.querySelectorAll('.palet-upload-row'));
  return rows.map(function(row) {
    var nameInput = row.querySelector('.palet-name-input');
    var koliInput = row.querySelector('.palet-koli-input');

    };

}

function promptPaletDetailsWithDraft(items, draftKeySuffix) {
  items = sortPaletItemsForPrompt_(items || []);
  if (items.length === 0) return Promise.resolve([]);
  draftKeySuffix = draftKeySuffix || getPaletDraftSuffixForItems_(items, 'draft_' + Date.now());
  var defaults = getPaletDraftDefaults_(items, draftKeySuffix);
  var previewUrls = items.map(function(item) { return item.previewUrl || ''; });
  var rows = items.map(function(item, index) {
    var defaultName = defaults[index] ? defaults[index].paletName : '';
    var defaultKoli = defaults[index] ? defaults[index].paletKoli : '';
    var label = item.fileName || (item.meta && item.meta.originalFileName) || ('Foto ' + (index + 1));
    var localId = item.localId || '';

async function applyPaletDetailsToLocalItems_(items, paletDetails, draftKeySuffix) {
  items = sortPaletItemsForPrompt_(items || []);
  var updated = [];
  for (var i = 0; i < items.length; i++) {
    var detail = paletDetails && paletDetails[i];
    if (!items[i] || !items[i].localId || !detail) continue;
    var latest = await _idbGet(STORE_QUEUE, items[i].localId);
    if (!latest) continue;
    var meta = JSON.parse(JSON.stringify(latest.meta || {}));
    meta.paletName = cleanPaletName(detail.paletName);
    meta.paletKoli = cleanPaletKoli(detail.paletKoli);
    var sourceIndex = Number(meta.sourceIndex);
    if (!isFinite(sourceIndex)) sourceIndex = i;
    var fileName = generatePhotoFileName('palet', sourceIndex, meta);
    meta.fileName = fileName;
    var nextStatus = latest.fileId ? 'UPLOAD_SUCCESS' : 'READY_TO_UPLOAD';
    var updatedItem = await updateLocalItem(latest.localId, {
      meta: meta,
      fileName: fileName,
      status: nextStatus,
      failureStage: '',
      manualStatus: '',
      errorMessage: '',
      errorType: ''
    });
    updated.push(updatedItem || latest);
  }
  clearPaletDetailsDraft_(items, draftKeySuffix);
  return updated;
}

async function markPaletItemsNeedUserAction_(items) {
  items = items || [];
  for (var i = 0; i < items.length; i++) {
    if (!items[i] || !items[i].localId) continue;
    await updateLocalItem(items[i].localId, {
      status: 'NEED_USER_ACTION',
      failureStage: 'metadata',
      manualStatus: 'PALET_DETAILS_PENDING',
      errorMessage: 'Data palet belum lengkap. Ketuk untuk melengkapi.',
      errorType: 'USER_ACTION_REQUIRED'
    });
  }
}

function getRecoveryNoticeTargetLocalId_(oldItems, oldPendingLogs) {
  oldItems = oldItems || [];
  oldPendingLogs = oldPendingLogs || [];
  var activeContainerId = String(state.activeContainerId || '');
  var activeTab = String(state.activeTab || '');
  var preferred = oldItems.filter(function(item) {
    return item && String(item.containerId || '') === activeContainerId
      && String(item.category || item.uploadType || '') === activeTab;
  });
  var candidates = preferred.length ? preferred : oldItems;
  candidates = candidates.filter(function(item) {
    return item && item.localId && (isManualActionStatus(item.status) || item.status === 'FAILED_LOG' || item.status === 'FAILED_LOG_MANUAL');
  });
  if (candidates.length > 0) return candidates[0].localId;
  if (oldPendingLogs.length > 0 && oldPendingLogs[0].localId) return oldPendingLogs[0].localId;
  return '';
}

        + '<button onclick="handleRetryAll()" style="flex:1;padding:6px;border:none;border-radius:6px;background:#1d4ed8;font-size:11px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit">Kirim ulang semua</button></div>';
    }

    if (logPending > 0 && failed === 0) {

        + '<div style="width:28px;height:28px;border-radius:7px;background:#fffbeb;display:flex;align-items:center;justify-content:center;flex-shrink:0">'
        + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2">'

        + '<line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div>'
