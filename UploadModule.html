function renderRecoveryNotice(oldItems, oldPendingLogs) {
  var count = (oldItems || []).length + (oldPendingLogs || []).length;
  var el = document.getElementById('upload-recovery-notice');
  if (count === 0) {
    _recoveryNoticeTargetLocalId = '';
    _recoveryNoticeDismissKey = '';
    if (el) el.remove();
    return;
  }
  _recoveryNoticeTargetLocalId = getRecoveryNoticeTargetLocalId_(oldItems, oldPendingLogs);
  var newestUpdatedAt = 0;
  (oldItems || []).forEach(function(item) {
    newestUpdatedAt = Math.max(newestUpdatedAt, Number(item && (item.updatedAt || item.createdAt)) || 0);
  });
  (oldPendingLogs || []).forEach(function(log) {
    newestUpdatedAt = Math.max(newestUpdatedAt, Number(log && (log.updatedAt || log.createdAt)) || 0);
  });
  _recoveryNoticeDismissKey = 'uploadRecoveryDismissed_' + count + '_' + newestUpdatedAt;
  try {
    if (sessionStorage.getItem(_recoveryNoticeDismissKey)) {
      if (el) el.remove();
      return;
    }
  } catch (e) {}
  if (!el) {
    el = document.createElement('div');
    el.id = 'upload-recovery-notice';
    el.style.cssText = 'position:fixed;left:8px;right:8px;bottom:148px;z-index:750;pointer-events:auto;'
      + 'background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px 12px;'
      + 'font-family:Poppins,sans-serif;box-shadow:0 6px 18px rgba(0,0,0,0.08);';
    document.body.appendChild(el);
  }
  el.innerHTML = '<div style="display:flex;align-items:center;gap:10px">'
    + '<div style="width:26px;height:26px;border-radius:7px;background:#f59e0b;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px">!</div>'
    + '<div style="flex:1"><div style="font-size:12px;font-weight:700;color:#92400e">Ada upload lama yang belum selesai</div>'
    + '<div style="font-size:11px;color:#b45309">' + count + ' item upload belum selesai.</div></div>'
    + '<button type="button" onclick="openRecoveryNoticeTarget()" style="padding:6px 10px;border:none;border-radius:7px;background:#f59e0b;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">Lihat</button>'
    + '<button type="button" onclick="dismissRecoveryNotice()" aria-label="Tutup notifikasi upload lama" style="width:28px;height:28px;border:1px solid #fde68a;border-radius:7px;background:#fff7ed;color:#92400e;font-size:17px;font-weight:700;line-height:1;cursor:pointer;font-family:inherit">&times;</button></div>';
}

function clampUploadTrackerPercent_(value) {
  value = Number(value) || 0;
  if (value < 0) return 0;
  if (value > 100) return 100;
  return Math.round(value);
}

function getUploadTrackerPhaseMeta_(activeProgress, counts, basePct) {
  counts = counts || {};
  var phase = String(activeProgress && activeProgress.phase || '');
  var sent = Number(activeProgress && activeProgress.sent || 0);
  var batchTotal = Number(activeProgress && activeProgress.total || 0);
  var batchPct = batchTotal > 0 ? clampUploadTrackerPercent_(sent / batchTotal * 100) : 0;
  var meta = {
    tone: 'info',
    badge: 'Berjalan',
    title: 'Upload sedang diproses',
    detail: 'Sistem sedang menyiapkan dan mengirim foto.',
    step: 'Proses upload',
    progressPct: Math.max(clampUploadTrackerPercent_(basePct), counts.waiting > 0 ? 5 : 0),
    batchPct: batchPct,
    batchText: batchTotal > 0 ? sent + '/' + batchTotal + ' foto' : '',
    indeterminate: true
  };

  if (_uploadPausedOffline || !navigator.onLine) {
    meta.tone = 'danger';
    meta.badge = 'Dijeda';
    meta.title = 'Koneksi terputus';
    meta.detail = 'Upload aman tersimpan di perangkat dan akan lanjut saat koneksi kembali.';
    meta.step = 'Menunggu koneksi';
    meta.progressPct = Math.max(meta.progressPct, 5);
    return meta;
  }

  if (counts.retrying > 0) {
    meta.tone = 'warning';
    meta.badge = 'Retry';
    meta.title = 'Menunggu coba ulang otomatis';
    meta.detail = counts.retrying + ' foto akan dikirim ulang otomatis.';
    meta.step = 'Retry upload';
    meta.progressPct = Math.max(meta.progressPct, 12);
    return meta;
  }

  if (phase.indexOf('Mengompres') >= 0 || phase.indexOf('Menyiapkan foto') >= 0) {
    meta.badge = 'Kompresi';
    meta.title = 'Mengompres foto';
    meta.detail = 'Foto sedang diproses di perangkat sebelum dikirim.';
    meta.step = 'Menyiapkan foto';
    meta.progressPct = Math.max(meta.progressPct, 6 + Math.round(batchPct * 0.12));
    meta.batchText = batchTotal > 0 ? sent + '/' + batchTotal + ' foto diproses' : '';
    meta.indeterminate = sent < batchTotal;
    return meta;
  }

  if (phase.indexOf('Sinkronisasi') >= 0 || counts.syncPending > 0) {
    meta.tone = 'info';
    meta.badge = 'Sinkronisasi';
    meta.title = 'Menyinkronkan tampilan';
    meta.detail = 'Data sudah tersimpan. Aplikasi sedang memastikan foto muncul di session detail, dashboard, SJ Qty, dan handover.';
    meta.step = 'Verifikasi final';
    meta.progressPct = Math.max(meta.progressPct, 96);
    meta.batchPct = 100;
    meta.batchText = counts.syncPending > 0 ? counts.syncPending + ' foto menunggu tampilan final' : 'Menunggu tampilan final';
    meta.indeterminate = true;
    return meta;
  }

  if (phase.indexOf('Mengambil akses') >= 0) {
    meta.badge = 'Akses Drive';
    meta.title = 'Menyiapkan akses Drive';
    meta.detail = 'Foto belum dikirim. Sistem sedang meminta token akses Drive.';
    meta.step = 'Langkah 1 dari 3';
    meta.progressPct = Math.max(meta.progressPct, 8);
    meta.batchText = batchTotal > 0 ? '0/' + batchTotal + ' foto disiapkan' : '';
    return meta;
  }

  if (phase.indexOf('Mengirim foto') >= 0) {
    meta.badge = 'Kirim Drive';
    meta.title = 'Mengirim foto ke Drive';
    meta.detail = batchTotal > 0
      ? sent + ' dari ' + batchTotal + ' foto sudah masuk Drive.'
      : 'Foto sedang dikirim ke Drive.';
    meta.step = 'Langkah 2 dari 3';
    meta.progressPct = Math.max(meta.progressPct, 18 + Math.round(batchPct * 0.62));
    meta.batchText = batchTotal > 0 ? sent + '/' + batchTotal + ' foto terkirim' : '';
    meta.indeterminate = sent < batchTotal;
    return meta;
  }

  if (phase.indexOf('Menyimpan data') >= 0 || counts.logPending > 0) {
    meta.tone = 'warning';
    meta.badge = 'Simpan data';
    meta.title = 'Menyimpan data ke sistem';
    meta.detail = 'File sudah masuk Drive. Data sedang disimpan agar muncul di laporan.';
    meta.step = 'Langkah 3 dari 3';
    meta.progressPct = Math.max(meta.progressPct, 88);
    meta.batchPct = 100;
    meta.batchText = batchTotal > 0 ? batchTotal + '/' + batchTotal + ' foto masuk Drive' : '';
    meta.indeterminate = true;
    return meta;
  }

  if (counts.waiting > 0) {
    meta.badge = 'Antrean';
    meta.title = 'Menyiapkan antrean upload';
    meta.detail = counts.waiting + ' foto sudah diproses di perangkat dan menunggu batch dimulai.';
    meta.step = 'Menunggu giliran';
    meta.progressPct = Math.max(meta.progressPct, 5);
    return meta;
  }

  if (counts.failed > 0) {
    meta.tone = 'danger';
    meta.badge = 'Butuh tindakan';
    meta.title = 'Sebagian foto belum terkirim';
    meta.detail = 'Cek foto gagal atau kirim ulang semua.';
    meta.step = 'Perlu dicek';
    meta.indeterminate = false;
  }

  return meta;
}

function isUploadPausedForResult_() {
  if (typeof isUploadOfflineNow === 'function') return isUploadOfflineNow();
  var banner = document.getElementById('offline-banner');
  return _uploadPausedOffline || !navigator.onLine || !!(banner && banner.classList.contains('show'));
}

function showUploadPausedResult_(successCount, pendingUpload, pendingLog, failed, syncPending, jobId) {
  successCount = Math.max(0, Number(successCount) || 0);
  pendingUpload = Math.max(0, Number(pendingUpload) || 0);
  pendingLog = Math.max(0, Number(pendingLog) || 0);
  failed = Math.max(0, Number(failed) || 0);
  syncPending = Math.max(0, Number(syncPending) || 0);
  var title = pendingUpload > 0 ? 'Upload dijeda' : (syncPending > 0 ? 'Data tersimpan, tampilan belum final' : 'Upload belum bisa diverifikasi');
  var note = pendingUpload > 0
    ? 'Koneksi sedang offline. Foto yang belum selesai tetap tersimpan di perangkat dan akan dilanjutkan saat koneksi kembali.'
    : (syncPending > 0
      ? 'Data sudah tersimpan ke sistem, tetapi aplikasi belum berhasil memastikan foto tampil di session detail, dashboard, SJ Qty, dan handover.'
      : 'Koneksi sedang offline, jadi aplikasi belum menampilkan status selesai sampai sinkronisasi benar-benar aman.');
  var actionButton = syncPending > 0
    ? '<button onclick="Swal.close();finalizeSyncPendingItems(\'' + (jobId || '') + '\', true)" style="width:100%;margin-top:10px;padding:9px;border:none;border-radius:8px;background:#2563eb;color:#fff;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer">Sinkronkan ulang tampilan</button>'
    : '';
  Swal.fire({
    icon: 'warning',
    title: title,
    html: '<div style="text-align:left">'
      + '<p style="font-size:13px;color:#64748b;margin-bottom:12px">' + note + '</p>'
      + '<div style="display:flex;gap:8px;margin-bottom:12px">'
      + '<div style="flex:1;background:#f0fdf4;border-radius:8px;padding:10px;text-align:center">'
      + '<div style="font-size:20px;font-weight:700;color:#15803d">' + successCount + '</div><div style="font-size:11px;color:#22c55e">Selesai</div></div>'
      + '<div style="flex:1;background:#fffbeb;border-radius:8px;padding:10px;text-align:center">'
      + '<div style="font-size:20px;font-weight:700;color:#92400e">' + (pendingUpload + pendingLog + syncPending) + '</div><div style="font-size:11px;color:#f59e0b">Menunggu</div></div>'
      + '<div style="flex:1;background:#fef2f2;border-radius:8px;padding:10px;text-align:center">'
      + '<div style="font-size:20px;font-weight:700;color:#dc2626">' + failed + '</div><div style="font-size:11px;color:#ef4444">Gagal</div></div></div>'
      + '<p style="font-size:12px;color:#64748b;margin:0">Jangan klik selesai/finish sampai banner offline hilang dan tracker upload bersih.</p>' + actionButton + '</div>',
    confirmButtonText: 'OK',
    customClass: { popup: 'custom-swal', confirmButton: 'btn-primary' },
    buttonsStyling: false
  });
}

function renderUploadTrackerV2() {
  getLocalQueue().then(function(allItems) {
    return _idbGetAll(STORE_PENDING_LOG).then(function(pendingLogs) {
      return { allItems: allItems, pendingLogs: pendingLogs };
    });
  }).then(function(data) {
    var allItems = data.allItems || [];
    var pendingLogs = data.pendingLogs || [];
    var activeJobId = getActiveUploadJobId();
    var items = filterUploadJobItems(allItems, activeJobId);
    var activePendingLogs = activeJobId ? pendingLogs.filter(function(p) { return isSameUploadJob(p, activeJobId); }) : [];
    var oldItems = allItems.filter(function(item) {
      return isUnfinishedLocalUpload(item) && (!activeJobId || !isSameUploadJob(item, activeJobId));
    });
    var oldPendingLogs = pendingLogs.filter(function(p) {
      return !activeJobId || !isSameUploadJob(p, activeJobId);
    });
    renderRecoveryNotice(oldItems, oldPendingLogs);

    var el = document.getElementById('upload-tracker');
    if (completeUploadJobIfClear_(activeJobId, items, activePendingLogs)) {
      if (el) { el.style.opacity = '0'; setTimeout(function() { if (el) el.remove(); }, 250); }
      return;
    }
    if (!activeJobId) {
      if (el) { el.style.opacity = '0'; setTimeout(function() { if (el) el.remove(); }, 250); }
      return;
    }

    var uploading = 0, retrying = 0, failed = 0, logPending = 0, waiting = 0, syncPending = 0;
    var pendingLogIds = {};
    activePendingLogs.forEach(function(p) { pendingLogIds[p.localId] = true; });
    items.forEach(function(i) {
      if (i.status === 'UPLOADING' || i.status === 'COMPRESSING' || i.status === 'PREPARING' || i.status === 'READY_TO_UPLOAD' || i.status === 'SLOW_NETWORK' || i.status === 'OFFLINE_PAUSED' || i.status === 'ONLINE_RESUMING') uploading++;
      else if (i.status && i.status.indexOf('RETRY') >= 0) retrying++;
      else if (isManualActionStatus(i.status)) failed++;
      else if (i.status === 'SYNC_PENDING') syncPending++;
      else if (i.status === 'FAILED_LOG' || i.status === 'LOG_PENDING' || i.status === 'UPLOAD_SUCCESS') {
        if (!pendingLogIds[i.localId]) logPending++;
      }
      else if (i.status === 'LOCAL_SAVED' || i.status === 'WAITING_BATCH') waiting++;
    });
    logPending += activePendingLogs.length;

    var total = (_activeUploadJob && _activeUploadJob.totalCount) || items.length;
    var isActive = uploading > 0 || retrying > 0 || waiting > 0 || syncPending > 0;
    var hasIssues = failed > 0 || logPending > 0;
    var activeProgress = _activeBatchProgress && _activeBatchProgress.jobId === activeJobId ? _activeBatchProgress : null;

    if (!isActive && !hasIssues && total === 0) {
      if (el) { el.style.opacity = '0'; setTimeout(function() { if (el) el.remove(); }, 300); }
      return;
    }

    if (!el) {
      el = document.createElement('div');
      el.id = 'upload-tracker';
      document.body.appendChild(el);
      requestAnimationFrame(function() { el.style.opacity = '1'; });
    }
    el.style.cssText = 'position:fixed;bottom:18px;right:16px;left:auto;width:min(430px,calc(100vw - 24px));'
      + 'max-height:calc(100vh - 36px);overflow:auto;background:#fff;border:1px solid #dbe4f0;border-radius:12px;'
      + 'padding:12px 14px;z-index:720;box-shadow:0 12px 32px rgba(15,23,42,0.16);'
      + 'font-family:Poppins,sans-serif;transition:opacity 0.3s;opacity:' + (el.style.opacity || '1') + ';';

    var successCount = total - failed - logPending - uploading - retrying - waiting - syncPending;
    if (successCount < 0) successCount = 0;
    var pct = total > 0 ? Math.round(successCount / total * 100) : 0;
    var phaseMeta = getUploadTrackerPhaseMeta_(activeProgress, {
      waiting: waiting,
      retrying: retrying,
      failed: failed,
      logPending: logPending,
      uploading: uploading,
      syncPending: syncPending
    }, pct);
    el.className = 'upload-tracker-card upload-tracker-' + phaseMeta.tone + (phaseMeta.indeterminate ? ' is-indeterminate' : '');

    var html = '<div class="upload-tracker-head">'
      + '<div class="upload-tracker-title-wrap">'
      + '<span class="upload-tracker-spinner" aria-hidden="true"></span>'
      + '<div class="upload-tracker-copy">'
      + '<div class="upload-tracker-title-row">'
      + '<span class="upload-tracker-title">Upload ' + total + ' foto</span>'
      + '<span class="upload-tracker-badge">' + escapeHtml(phaseMeta.badge) + '</span></div>'
      + '<div class="upload-tracker-message">' + escapeHtml(phaseMeta.title) + '</div></div></div>'
      + '<div class="upload-tracker-count" style="display:flex;align-items:center;gap:6px">'
      + '<div><strong>' + phaseMeta.progressPct + '%</strong><span>' + successCount + '/' + total + ' selesai</span></div>'
      + '<button onclick="dismissUploadTrackerV2()" title="Tutup pop-up" style="background:transparent;border:none;font-size:18px;color:#94a3b8;cursor:pointer;padding:0 4px">&times;</button></div></div>'
      + '<div class="upload-tracker-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + phaseMeta.progressPct + '">'
      + '<div class="upload-tracker-fill" style="width:' + phaseMeta.progressPct + '%"></div></div>'
      + '<div class="upload-tracker-detail"><span>' + escapeHtml(phaseMeta.step) + '</span><span>' + escapeHtml(phaseMeta.detail) + '</span></div>';

    if (activeProgress) {
      html += '<div class="upload-tracker-batch">'
        + '<div class="upload-tracker-batch-top"><span>' + escapeHtml(activeProgress.label) + '</span><strong>' + escapeHtml(phaseMeta.batchText || (activeProgress.sent + '/' + activeProgress.total + ' foto')) + '</strong></div>'
        + '<div class="upload-tracker-mini-bar"><div style="width:' + phaseMeta.batchPct + '%"></div></div>'
        + '<div class="upload-tracker-phase">' + escapeHtml(activeProgress.phase) + '</div></div>';
    }

    if (_uploadPausedOffline || !navigator.onLine) {
      html += '<div style="font-size:11px;color:#dc2626;font-weight:700;margin-bottom:6px">Koneksi terputus. Upload dijeda dan tersimpan di perangkat ini.</div>';
    } else if (retrying > 0) {
      html += '<div style="font-size:11px;color:#f59e0b;font-weight:600;margin-bottom:6px">' + retrying + ' foto menunggu retry otomatis.</div>';
    } else if (logPending > 0 && failed === 0) {
      html += '<div style="font-size:11px;color:#92400e;font-weight:600;margin-bottom:6px">File sudah masuk Drive, data sistem sedang/menunggu tersimpan.</div>';
    } else if (syncPending > 0) {
      html += '<div style="font-size:11px;color:#2563eb;font-weight:600;margin-bottom:6px">Data tersimpan, sedang memastikan tampilan sudah final.</div>';
    }

    if (failed > 0) {
      html += '<div style="display:flex;align-items:center;gap:8px;margin-top:8px;margin-bottom:8px">'
        + '<div style="width:28px;height:28px;border-radius:7px;background:#fef2f2;display:flex;align-items:center;justify-content:center;flex-shrink:0">'
        + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2">'
        + '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>'
        + '<div style="flex:1"><div style="font-size:13px;font-weight:600;color:#1e293b">' + failed + ' foto butuh tindakan</div>'
        + '<div style="font-size:11px;color:#64748b">Foto tetap tersimpan di perangkat ini.</div></div></div>'
        + '<div style="display:flex;gap:6px">'
        + '<button onclick="scrollToFirstFailedPhoto()" style="flex:1;padding:6px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;font-size:11px;color:#334155;cursor:pointer;font-family:inherit">Lihat foto gagal</button>'
        + '<button onclick="handleRetryAll(\'' + activeJobId + '\')" style="flex:1;padding:6px;border:none;border-radius:6px;background:#1d4ed8;font-size:11px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit">Kirim ulang semua</button></div>';
    }

    if (logPending > 0 && failed === 0) {
      html += '<button onclick="retryPendingLogs(\'' + activeJobId + '\')" style="width:100%;padding:6px;border:none;border-radius:6px;background:#f59e0b;font-size:11px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit">Simpan Data ke Sistem</button>';
    } else if (syncPending > 0 && failed === 0) {
      html += '<button onclick="finalizeSyncPendingItems(\'' + activeJobId + '\', true)" style="width:100%;padding:6px;border:none;border-radius:6px;background:#2563eb;font-size:11px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit">Sinkronkan ulang tampilan</button>';
    }

    el.innerHTML = html;
  });
}

window.dismissUploadTrackerV2 = function() {
  var el = document.getElementById('upload-tracker');
  if (el) { el.style.opacity = '0'; setTimeout(function(){ if (el) el.remove(); }, 300); }
  if (_activeUploadJob) _activeUploadJob.status = 'DISMISSED';
  _activeBatchProgress = null;
  renderLocalThumbnails();
};

async function deprecatedShowUploadResultLegacy_(totalCount) {
  var items = await getLocalQueue();
  var pendingLogs = await _idbGetAll(STORE_PENDING_LOG);

  var failed = items.filter(function(i) {
    return isManualActionStatus(i.status);
  }).length;
  var logPending = items.filter(function(i) { return i.status === 'FAILED_LOG'; }).length + pendingLogs.length;
  var uploading = items.filter(function(i) {
    return i.status === 'UPLOADING'
      || i.status === 'COMPRESSING'
      || i.status === 'READY_TO_UPLOAD'
      || i.status === 'SLOW_NETWORK'
      || i.status === 'OFFLINE_PAUSED'
      || i.status === 'ONLINE_RESUMING'
      || (i.status && i.status.indexOf('RETRY') >= 0);
  }).length;
  var waiting = items.filter(function(i) {
    return i.status === 'LOCAL_SAVED' || i.status === 'WAITING_BATCH';
  }).length;

  var successCount = totalCount - failed - logPending - uploading - waiting;
  if (successCount < 0) successCount = 0;
  var pendingUpload = Math.max(0, totalCount - successCount - failed - logPending);

  if (isUploadPausedForResult_() || uploading > 0 || waiting > 0) {
    showUploadPausedResult_(successCount, pendingUpload, logPending, failed);
    renderUploadTrackerV2();
    return;
  }

  if (failed === 0 && logPending === 0 && uploading === 0 && waiting === 0) {
    // All success
    Toast.fire({ icon: 'success', title: 'Upload ' + successCount + ' foto selesai!' });
  } else if (logPending > 0 && failed === 0) {
    // Drive OK but Sheet failed
    Swal.fire({
      icon: 'warning',
      title: 'Foto sudah di Drive',

async function showUploadResult(totalCount, job) {
  var allItems = await getLocalQueue();
  var pendingLogs = await _idbGetAll(STORE_PENDING_LOG);
  var jobId = job && job.jobId;
  var items = jobId ? allItems.filter(function(i) { return i.jobId === jobId; }) : allItems;
  var jobPendingLogs = jobId ? pendingLogs.filter(function(p) {
    return p.jobId === jobId || (p.meta && p.meta.jobId === jobId);
  }) : pendingLogs;
  var unfinishedItems = items.filter(isUnfinishedLocalUpload);

  var failed = items.filter(function(i) {
    return isManualActionStatus(i.status) && i.failureStage !== 'log';
  }).length;
  var pendingLogIds = {};
  jobPendingLogs.forEach(function(p) { pendingLogIds[p.localId] = true; });
  var logPending = items.filter(function(i) {
    return (i.status === 'FAILED_LOG' || i.status === 'LOG_PENDING' || i.status === 'UPLOAD_SUCCESS') && !pendingLogIds[i.localId];
  }).length + jobPendingLogs.length;
  var syncPending = items.filter(function(i) {
    return i.status === 'SYNC_PENDING';
  }).length;
  var uploading = items.filter(function(i) {
    return i.status === 'UPLOADING' || i.status === 'COMPRESSING' || i.status === 'PREPARING' || i.status === 'READY_TO_UPLOAD' || i.status === 'SLOW_NETWORK' || i.status === 'OFFLINE_PAUSED' || i.status === 'ONLINE_RESUMING' || (i.status && i.status.indexOf('RETRY') >= 0);
  }).length;
  var waiting = items.filter(function(i) {
    return i.status === 'LOCAL_SAVED' || i.status === 'WAITING_BATCH';
  }).length;
  var activeRetryCount = Object.keys(_activeRetryTimers).filter(function(localId) {
    return items.some(function(item) { return item.localId === localId; });
  }).length;
  var successCount = totalCount - failed - logPending - syncPending - uploading - waiting;
  if (successCount < 0) successCount = 0;
  var pendingDisplay = logPending || jobPendingLogs.length;
  var pendingUpload = Math.max(0, totalCount - successCount - failed - pendingDisplay - syncPending);
  var pausedForResult = isUploadPausedForResult_()
    || uploading > 0
    || waiting > 0
    || activeRetryCount > 0
    || syncPending > 0;

  if (pausedForResult) {
    setUploadJobStatus(job || _activeUploadJob, 'UPLOADING', {
      successCount: successCount,
      failedCount: failed,
      pendingLogCount: pendingDisplay,
      syncPendingCount: syncPending
    });
    renderUploadTrackerV2();
    showUploadPausedResult_(successCount, pendingUpload, pendingDisplay, failed, syncPending, jobId);
    return;
  }

  if (failed === 0 && logPending === 0 && syncPending === 0 && uploading === 0 && waiting === 0 && activeRetryCount === 0 && jobPendingLogs.length === 0 && unfinishedItems.length === 0) {
    setUploadJobStatus(job || _activeUploadJob, 'DONE', {
      successCount: totalCount,
      failedCount: 0,
      pendingLogCount: 0,
      syncPendingCount: 0
    });
    _activeBatchProgress = null;
    Toast.fire({ icon: 'success', title: 'Upload ' + totalCount + ' foto selesai!' });
    return;
  }

  var nextStatus = syncPending > 0 && failed === 0 ? 'SYNC_PENDING' : (pendingDisplay > 0 && failed === 0 ? 'LOG_PENDING' : (successCount > 0 ? 'PARTIAL_FAILED' : 'FAILED'));
  setUploadJobStatus(job || _activeUploadJob, nextStatus, {
    successCount: successCount,
    failedCount: failed,
    pendingLogCount: pendingDisplay,
    syncPendingCount: syncPending
  });

  if (pendingDisplay > 0 && failed === 0) {
    Swal.fire({
      icon: 'warning',
      title: 'File sudah di Drive',
      html: '<div style="text-align:left">'
        + '<p style="font-size:13px;color:#64748b;margin-bottom:12px">File sudah tersimpan di Drive, tetapi data belum tersimpan ke sistem.</p>'
        + '<div style="display:flex;gap:8px;margin-bottom:12px">'
        + '<div style="flex:1;background:#f0fdf4;border-radius:8px;padding:10px;text-align:center">'
        + '<div style="font-size:20px;font-weight:700;color:#15803d">' + successCount + '</div><div style="font-size:11px;color:#22c55e">Di Drive</div></div>'
        + '<div style="flex:1;background:#fffbeb;border-radius:8px;padding:10px;text-align:center">'
        + '<div style="font-size:20px;font-weight:700;color:#92400e">' + pendingDisplay + '</div><div style="font-size:11px;color:#f59e0b">Data pending</div></div></div></div>',
      showCancelButton: true,
      confirmButtonText: 'Simpan Data ke Sistem',
      cancelButtonText: 'Nanti saja',
      customClass: { popup: 'custom-swal', confirmButton: 'btn-primary', cancelButton: 'btn-primary' },
      buttonsStyling: false
    }).then(function(r) {
      if (r.isConfirmed) retryPendingLogs(jobId);
    });
  } else {
    Swal.fire({
      icon: 'warning',
      title: 'Sebagian foto belum terkirim',
      html: '<div style="text-align:left">'
        + '<div style="display:flex;gap:8px;margin-bottom:12px">'
        + '<div style="flex:1;background:#f0fdf4;border-radius:8px;padding:10px;text-align:center">'
        + '<div style="font-size:20px;font-weight:700;color:#15803d">' + successCount + '</div><div style="font-size:11px;color:#22c55e">Berhasil</div></div>'
        + '<div style="flex:1;background:#fef2f2;border-radius:8px;padding:10px;text-align:center">'
        + '<div style="font-size:20px;font-weight:700;color:#dc2626">' + failed + '</div><div style="font-size:11px;color:#ef4444">Gagal</div></div>'
        + '<div style="flex:1;background:#fffbeb;border-radius:8px;padding:10px;text-align:center">'
        + '<div style="font-size:20px;font-weight:700;color:#92400e">' + pendingDisplay + '</div><div style="font-size:11px;color:#f59e0b">Pending</div></div></div>'
        + '<p style="font-size:12px;color:#64748b;margin:0">Foto gagal tetap tampil. Gunakan tombol retry di tengah thumbnail.</p></div>',
      showDenyButton: true,
      showCancelButton: true,
      confirmButtonText: 'Kirim ulang semua',
      denyButtonText: 'Lihat foto gagal',
      cancelButtonText: 'OK',
      customClass: { popup: 'custom-swal', confirmButton: 'btn-primary', denyButton: 'btn-primary', cancelButton: 'btn-primary' },
      buttonsStyling: false
    }).then(function(r) {
      if (r.isConfirmed) handleRetryAll(jobId);
      else if (r.isDenied) scrollToFirstFailedPhoto();
    });
  }
}

// In-memory cache of local items for current container/tab
var _localThumbnailCache = [];
var localBatchSelectedIds = [];

function isLocalBatchSelectModeActive_() {
  return typeof batchSelectMode !== 'undefined' && !!batchSelectMode;
}

function isLocalItemSelectableForBatch_(item) {
  if (!item) return false;
  if (item.status === 'DONE' || item.status === 'FINAL_SYNCED') return false;
  if (item.status === 'UPLOADING' || item.status === 'COMPRESSING' || item.status === 'PREPARING') return false;
  if (String(item.status || '').indexOf('RETRY') >= 0) return false;
  return isManualActionStatus(item.status) || item.status === 'FAILED_LOG' || item.status === 'FAILED_LOG_MANUAL';
}

function getSelectableLocalBatchItems_(items) {
  return (items || []).filter(isLocalItemSelectableForBatch_);
}

function syncLocalBatchSelection_(items) {
  var selectable = {};
  getSelectableLocalBatchItems_(items).forEach(function(item) { selectable[item.localId] = true; });
  localBatchSelectedIds = localBatchSelectedIds.filter(function(localId) { return !!selectable[localId]; });
  if (!isLocalBatchSelectModeActive_()) localBatchSelectedIds = [];
}

function toggleLocalPhotoSelect(localId) {
  if (!isLocalBatchSelectModeActive_()) return;
  var idx = localBatchSelectedIds.indexOf(localId);
  if (idx >= 0) localBatchSelectedIds.splice(idx, 1);
  else localBatchSelectedIds.push(localId);
  renderLocalThumbnails();
}

function localBatchSelectAll() {
  if (!isLocalBatchSelectModeActive_()) return;
  var selectable = getSelectableLocalBatchItems_(_localThumbnailCache);
  if (selectable.length === 0) return;
  if (localBatchSelectedIds.length === selectable.length) {
    localBatchSelectedIds = [];
  } else {
    localBatchSelectedIds = selectable.map(function(item) { return item.localId; });
  }
  renderLocalThumbnails();
}

async function handleRetrySelectedLocalPhotos() {
  var ids = localBatchSelectedIds.slice();
  if (ids.length === 0) {
    Toast.fire({ icon: 'info', title: 'Pilih foto gagal dulu' });
    return;
  }
  var items = [];
  for (var i = 0; i < ids.length; i++) {
    var item = await _idbGet(STORE_QUEUE, ids[i]);
    if (item && isLocalItemSelectableForBatch_(item)) items.push(item);
  }
  if (items.length === 0) {
    localBatchSelectedIds = [];
    renderLocalThumbnails();
    Toast.fire({ icon: 'info', title: 'Tidak ada foto gagal yang bisa diproses' });
    return;
  }

  var paletMissing = sortPaletItemsForPrompt_(items.filter(isPaletMissingDetails_));
  if (paletMissing.length > 0) {
    var draftKeySuffix = getPaletDraftSuffixForItems_(paletMissing, 'selected_local_' + Date.now());
    var paletDetails = await promptPaletDetailsWithDraft(paletMissing, draftKeySuffix);
    if (paletDetails) {
      await applyPaletDetailsToLocalItems_(paletMissing, paletDetails, draftKeySuffix);
    } else {
      await markPaletItemsNeedUserAction_(paletMissing);
      var missingMap = {};
      paletMissing.forEach(function(item) { missingMap[item.localId] = true; });
      items = items.filter(function(item) { return !missingMap[item.localId]; });
    }
  }

  localBatchSelectedIds = [];
  renderLocalThumbnails();
  renderUploadTrackerV2();

  for (var r = 0; r < items.length; r++) {
    cancelAutoRetryItem(items[r].localId);
    await executeRetryUpload(items[r].localId, true);
  }
  renderLocalThumbnails();
  renderUploadTrackerV2();
}

function renderLocalBatchBar_(grid, items) {
  var selectable = getSelectableLocalBatchItems_(items);
  var oldBar = grid.querySelector('.local-batch-bar');
  if (oldBar) oldBar.remove();
  if (!isLocalBatchSelectModeActive_() || selectable.length === 0) return;

  var selectedCount = localBatchSelectedIds.length;
  var bar = document.createElement('div');
  bar.className = 'local-batch-bar';
  bar.style.cssText = 'grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:8px 12px;'
    + 'background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;margin-bottom:2px;';
  bar.innerHTML = '<span style="flex:1;font-size:12px;font-weight:700;color:#c2410c">'
    + selectedCount + ' dari ' + selectable.length + ' foto gagal lokal dipilih</span>'
    + '<button type="button" onclick="event.stopPropagation();localBatchSelectAll()" style="padding:4px 10px;border:1px solid #fdba74;border-radius:6px;background:#fff;font-size:10px;font-weight:700;color:#c2410c;cursor:pointer;font-family:inherit">'
    + (selectedCount === selectable.length && selectable.length > 0 ? 'Batal semua' : 'Pilih semua')
    + '</button>'
    + '<button type="button" onclick="event.stopPropagation();handleRetrySelectedLocalPhotos()" style="padding:4px 10px;border:none;border-radius:6px;background:' + (selectedCount > 0 ? '#ea580c' : '#e2e8f0') + ';font-size:10px;font-weight:700;color:' + (selectedCount > 0 ? '#fff' : '#94a3b8') + ';cursor:pointer;font-family:inherit"'
    + (selectedCount === 0 ? ' disabled' : '') + '>Proses</button>';
  grid.insertBefore(bar, grid.firstChild);
}

function renderLocalThumbnails() {
  if (!state.activeContainerId) return;
  var containerId = state.activeContainerId;
  var category = state.activeTab;

  getLocalQueueForContainer(containerId, category).then(function(items) {
    _localThumbnailCache = items;
    syncLocalBatchSelection_(items);
    var grid = document.getElementById('photo-grid');
    if (!grid) return;

    // Remove old local thumbnails
    var oldLocals = grid.querySelectorAll('.photo-local, .local-batch-bar');
    oldLocals.forEach(function(el) { el.remove(); });

    // Get the "add" button to insert before it
    var addBtn = grid.querySelector('.photo-add');
    renderLocalBatchBar_(grid, items);

    items.forEach(function(item) {
      if (item.status === 'DONE' || item.status === 'FINAL_SYNCED') return; // Already synced, skip

      var box = document.createElement('div');
      var failedLike = isManualActionStatus(item.status) || item.status === 'FAILED_LOG';
      var localSelectMode = isLocalBatchSelectModeActive_() && isLocalItemSelectableForBatch_(item);
      var localSelected = localBatchSelectedIds.indexOf(item.localId) >= 0;
      box.className = 'photo-box photo-local' + (failedLike ? ' failed-state' : '') + (localSelected ? ' selected' : '');
      box.setAttribute('data-local-id', item.localId);
      box.style.position = 'relative';
      if (localSelected) box.style.outline = '3px solid #ea580c';
      if (localSelected) box.style.outlineOffset = '-3px';

      // Thumbnail image
      var imgSrc = item.previewUrl || '';
      var imgHtml = imgSrc
        ? '<img src="' + imgSrc + '" alt="Local foto" style="width:100%;height:100%;object-fit:cover;border-radius:6px">'
        : '<div style="width:100%;height:100%;border-radius:6px;background:#f8fafc;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:11px;font-weight:700;text-align:center;padding:8px;box-sizing:border-box">Menyiapkan foto</div>';

      // Status overlay
      var overlayHtml = '';
      var statusHtml = '';

      if (item.status === 'UPLOADING' || item.status === 'COMPRESSING' || item.status === 'PREPARING' || item.status === 'SLOW_NETWORK' || item.status === 'OFFLINE_PAUSED' || item.status === 'ONLINE_RESUMING') {
        overlayHtml = '<div class="photo-overlay-uploading"></div>';
        statusHtml = '<div class="photo-status-badge uploading"><span class="spinner-small"></span> ' + escapeHtml(getUploadStatusMessage(item)) + '</div>';
        box.onclick = function() { showLocalLightbox(item.localId); };

      } else if (String(item.status || '').indexOf('RETRY') >= 0 && String(item.status || '').indexOf('WAITING') >= 0) {
        var retryNum = item.status.replace(/[^0-9]/g, '') || '?';
        overlayHtml = '<div class="photo-overlay-retrying"></div>';
        statusHtml = '<div class="photo-status-badge retrying info">Mencoba ulang ' + retryNum + '/' + MAX_AUTO_RETRY + '...</div>'
          + '<button class="btn-retry-now-mini" onclick="event.stopPropagation();handleRetryPhoto(\'' + item.localId + '\')" title="Kirim sekarang">Kirim sekarang</button>';
        box.onclick = function(e) {
          if (e.target.closest('.btn-retry-now-mini')) return;
          showLocalLightbox(item.localId);
        };

      } else if (item.status === 'WAITING_MANUAL_RETRY' || item.status === 'FAILED_UPLOAD' || item.status === 'FAILED_UPLOAD_MANUAL') {
        overlayHtml = '<div class="photo-overlay-failed"></div>';
        if (localSelectMode) {
          statusHtml = '<div class="photo-status-badge failed">Pilih untuk proses ulang</div>';
          box.onclick = function(e) { e.stopPropagation(); toggleLocalPhotoSelect(item.localId); };
        } else {
          statusHtml = '<button class="photo-status-badge failed clickable" onclick="event.stopPropagation();handleRetryPhoto(\'' + item.localId + '\')">Gagal dikirim. Ketuk untuk kirim ulang.</button>';
          overlayHtml += '<button class="btn-retry-center" onclick="event.stopPropagation();handleRetryPhoto(\'' + item.localId + '\')" aria-label="Kirim ulang foto" title="Kirim ulang">'
            + '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">'
            + '<path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>';
          box.onclick = function(e) {
            if (e.target.closest('.btn-retry-center') || e.target.closest('.photo-status-badge.clickable')) return;
            showLocalLightbox(item.localId);
          };
        }

      } else if (item.status === 'FAILED_LOG' || item.status === 'FAILED_LOG_MANUAL') {
        overlayHtml = '<div class="photo-overlay-log-pending"></div>';
        if (localSelectMode) {
          statusHtml = '<div class="photo-status-badge log-pending">Pilih untuk simpan data</div>';
          box.onclick = function(e) { e.stopPropagation(); toggleLocalPhotoSelect(item.localId); };
        } else {
          statusHtml = '<button class="photo-status-badge log-pending clickable" onclick="event.stopPropagation();retryPendingLogs(\'' + item.jobId + '\', true)">Data belum tersimpan ke sistem. Simpan Data ke Sistem.</button>';
          box.onclick = function(e) {
            if (e.target.closest('.photo-status-badge.clickable')) return;
            showLocalLightbox(item.localId);
          };
        }

      } else if (item.status === 'NEED_USER_ACTION') {
        overlayHtml = '<div class="photo-overlay-failed"></div>';
        if (localSelectMode) {
          statusHtml = '<div class="photo-status-badge failed">Pilih untuk dilengkapi</div>';
          box.onclick = function(e) { e.stopPropagation(); toggleLocalPhotoSelect(item.localId); };
        } else {
          overlayHtml += '<button class="btn-retry-center" onclick="event.stopPropagation();handleRetryPhoto(\'' + item.localId + '\')" aria-label="Coba lagi" title="Coba lagi">'
            + '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5">'
            + '<path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>';
          statusHtml = '<button class="photo-status-badge failed clickable" onclick="event.stopPropagation();showUploadItemActions(\'' + item.localId + '\')">Butuh tindakan</button>';
          box.onclick = function(e) {
            if (e.target.closest('.btn-retry-center') || e.target.closest('.photo-status-badge.clickable')) return;
            showLocalLightbox(item.localId);
          };
        }

      } else if (item.status === 'SYNC_PENDING') {
        overlayHtml = '<div class="photo-overlay-log-pending"></div>';
        statusHtml = '<button class="photo-status-badge log-pending clickable" onclick="event.stopPropagation();finalizeSyncPendingItems(\'' + item.jobId + '\', true)">Tersimpan. Sinkronkan tampilan.</button>';
        box.onclick = function(e) {
          if (e.target.closest('.photo-status-badge.clickable')) return;
          showLocalLightbox(item.localId);
        };

      } else if (item.status === 'UPLOAD_SUCCESS' || item.status === 'LOG_PENDING') {
        statusHtml = '<div class="photo-status-badge log-pending" style="background:#fffbeb;color:#92400e">Menyimpan data ke sistem...</div>';
        box.onclick = function() { showLocalLightbox(item.localId); };

      } else {
        // LOCAL_SAVED, WAITING_BATCH etc
        overlayHtml = '<div class="photo-overlay-waiting"></div>';
        statusHtml = '<div class="photo-status-badge waiting">Menunggu...</div>';
        box.onclick = function() { showLocalLightbox(item.localId); };
      }

      if (localSelectMode) {
        overlayHtml += '<div style="position:absolute;top:4px;left:4px;z-index:8;width:22px;height:22px;border-radius:50%;border:2px solid ' + (localSelected ? '#ea580c' : '#fdba74') + ';background:' + (localSelected ? '#ea580c' : 'rgba(255,255,255,0.9)') + ';display:flex;align-items:center;justify-content:center;pointer-events:none">'
          + (localSelected ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>' : '')
          + '</div>';
      }

      box.innerHTML = imgHtml + overlayHtml + statusHtml;

      if (addBtn) {
        grid.insertBefore(box, addBtn);
      } else {
        grid.appendChild(box);
      }
    });
  });
}

function showLocalLightbox(localId) {
  _idbGet(STORE_QUEUE, localId).then(function(item) {
    if (!item || !item.blob) return;
    var url = URL.createObjectURL(item.blob);
    showLightbox(url);
    // Revoke after close — attach one-time listener
    var lb = document.getElementById('lightbox');
    function onClose() {
      URL.revokeObjectURL(url);
      lb.removeEventListener('transitionend', onClose);
    }
    if (lb) {
      // We'll revoke when lightbox is hidden
      var origClose = window.closeLightbox;
      window.closeLightbox = function() {
        origClose();
        URL.revokeObjectURL(url);
        window.closeLightbox = origClose;
      };
    }
  });
}

async function recoverPendingUploads() {
  try {
    await openUploadDB();
  } catch (e) {
    console.warn('IndexedDB not available:', e);
    return;
  }

  var items = await getLocalQueue();
  var pendingLogs = await _idbGetAll(STORE_PENDING_LOG);

  // Re-create previewUrls for items still in queue
  var recoveredCount = 0;
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    if (item.status === 'DONE') {
      await removeFromLocal(item.localId);
      continue;
    }

    // Recreate preview URL from blob
    if (item.blob) {
      try {
        item.previewUrl = URL.createObjectURL(item.blob);
        await _idbPut(STORE_QUEUE, item);
      } catch (e) {
        // Blob might be corrupt
        console.warn('Failed to recreate preview for', item.localId);
      }
    }

    if (isPaletMissingDetails_(item) && (item.blob || item.fileId)) {
      await updateLocalItem(item.localId, {
        status: 'NEED_USER_ACTION',
        failureStage: 'metadata',
        manualStatus: 'PALET_DETAILS_PENDING',
        errorMessage: 'Data palet belum lengkap. Ketuk untuk melengkapi.',
        errorType: 'USER_ACTION_REQUIRED'
      });
      recoveredCount++;
      continue;
    }

    // Reset uploading items back to retry state
    if (item.status === 'UPLOADING' || item.status === 'COMPRESSING' || item.status === 'PREPARING' || item.status === 'READY_TO_UPLOAD') {
      await updateLocalItem(item.localId, {
        status: 'WAITING_MANUAL_RETRY',
        errorMessage: 'Upload terputus karena halaman dimuat ulang'
      });
    }
    // Reset retrying items
    if (String(item.status || '').indexOf('RETRY') >= 0 && String(item.status || '').indexOf('WAITING') < 0) {
      await updateLocalItem(item.localId, {
        status: 'WAITING_MANUAL_RETRY',
        errorMessage: 'Retry terputus karena halaman dimuat ulang'
      });
    }

    recoveredCount++;
  }

  if (recoveredCount > 0 || pendingLogs.length > 0) {
    console.log('Recovered ' + recoveredCount + ' upload items, ' + pendingLogs.length + ' pending logs');
    renderUploadTrackerV2();
    // Will render thumbnails when user navigates to the appropriate container
  }
}

// =========================================================================
// 13. MAIN UPLOAD ENTRY — Replaces old handleMultiUpload pipeline
// =========================================================================

async function handleMultiUploadV2(input) {
  var uploadTabType = state.activeTab;
  var files = Array.from(input.files);
  if (!files.length) return;
  if (!ensureCanEditSession('upload foto')) { input.value = ''; return; }
  var c = state.containers.find(function(x) { return x.id === state.activeContainerId; });
  if (!c) { Toast.fire({ icon: 'warning', title: 'Pilih armada dulu' }); input.value = ''; return; }
  if (typeof ensureCanUploadToContainer === 'function' && !ensureCanUploadToContainer(c, 'upload foto')) { input.value = ''; return; }
  var isPaletUpload = uploadTabType === 'palet';

  var uploadTraceId = createCrudTraceId('uploadPhoto');
  crudTrace('uploadPhoto', uploadTraceId, 'client_click', { count: files.length, type: uploadTabType });
  var uploadJob = createUploadJob(files.length, [uploadTabType]);
  uploadJob.sessionId = state.activeSessionId;
  uploadJob.traceId = uploadTraceId;
  var paletDraftSuffix = 'active_draft_' + String(c.id);
  setUploadJobStatus(uploadJob, 'INIT');
  _activeBatchProgress = null;
  uploadInProgress = true;
  input.value = '';

  var sess = state.activeSession || {};
  var baseMeta = {
    sessionId: state.activeSessionId, brand: sess.brand || '',
    shipment: sess.shipment || '', date: sess.date || '', pic: sess.pic || '',
    fleetNo: c.number, uploadedBy: state.username,
    containerId: c.id, jobId: uploadJob.jobId,
    uploadType: uploadTabType,
    traceId: uploadTraceId,
    driver: c.driver || '', plate: c.plate || '', type: c.type || ''
  };

  // === PHASE 1: Compress + Save to IndexedDB ===
  var localItems = [];
  var COMPRESS_C = CLIENT_CONFIG.COMPRESS_CONCURRENCY || 3;
  var compressCursor = 0;
  var compressedCount = 0;

  async function compressAndSaveWorker() {
    while (compressCursor < files.length) {
      var idx = compressCursor++;
      var item = null;
      try {
        var meta = JSON.parse(JSON.stringify(baseMeta));
        meta.containerId = c.id;
        meta.sourceIndex = idx;
        meta.originalFileName = files[idx] && files[idx].name ? files[idx].name : '';
        var fileName = generatePhotoFileName(uploadTabType, idx, null);
        meta.fileName = fileName;
        item = await createLocalPlaceholder(meta, fileName);
        localItems.push(item);
        setActiveBatchProgress({
          jobId: uploadJob.jobId,
          batchId: 'compress-' + uploadJob.jobId,
          label: 'Menyiapkan foto',
          totalItems: files.length
        }, 'Mengompres foto', compressedCount, files.length);
        setUploadJobStatus(uploadJob, 'PREPARING');
        renderUploadTrackerV2();
        renderLocalThumbnails();

        var blob = await compressImgToBlob(files[idx]);
        var previewUrl = URL.createObjectURL(blob);
        item = await updateLocalItem(item.localId, {
          blob: blob,
          previewUrl: previewUrl,
          fileName: fileName,
          status: 'LOCAL_SAVED'
        });
        compressedCount++;
        setActiveBatchProgress({
          jobId: uploadJob.jobId,
          batchId: 'compress-' + uploadJob.jobId,
          label: 'Menyiapkan foto',
          totalItems: files.length
        }, 'Mengompres foto', compressedCount, files.length);
      } catch (e) {
        console.warn('Compress/save failed for file ' + idx + ':', e);
        if (item && item.localId) {
          await updateLocalItem(item.localId, {
            status: 'FAILED_UPLOAD',
            failureStage: 'upload',
            errorMessage: 'Foto gagal diproses: ' + (e && e.message ? e.message : String(e)),
            errorType: 'PERMANENT'
          });
        }
      }
      renderLocalThumbnails();
      renderUploadTrackerV2();
    }
  }

  var cWorkers = [];
  for (var ci = 0; ci < Math.min(COMPRESS_C, files.length); ci++) cWorkers.push(compressAndSaveWorker());
  Swal.fire({
    title: 'Menyimpan foto lokal...',
    html: '<p style="font-size:13px;color:#64748b;margin:0">Foto diamankan dulu ke perangkat sebelum proses berikutnya.</p>',
    allowOutsideClick: false,
    allowEscapeKey: false,
    customClass: { popup: 'custom-swal' },
    didOpen: function() { Swal.showLoading(); }
  });
  try {
    await Promise.all(cWorkers);
  } finally {
    Swal.close();
  }

  if (localItems.length === 0) {
    uploadInProgress = false;
    setUploadJobStatus(uploadJob, 'FAILED');
    Swal.fire({ icon: 'error', title: 'Gagal', text: 'Tidak ada foto yang berhasil diproses.', customClass: { popup: 'custom-swal' } });
    return;
  }
  setUploadJobStatus(uploadJob, 'LOCAL_SAVED');
  crudTrace('uploadPhoto', uploadTraceId, 'local_saved', { items: localItems.length });
  var savedLocalItems = sortPaletItemsForPrompt_((await getLocalQueue()).filter(function(item) {
    return item.status === 'LOCAL_SAVED' && item.meta && item.meta.containerId === c.id && item.meta.uploadType === uploadTabType;
  }));
  if (isPaletUpload && savedLocalItems.length > 0) {
    crudTrace('uploadPhoto', uploadTraceId, 'palet_details_prompt_start', { items: savedLocalItems.length });
    var paletDetails = await promptPaletDetailsWithDraft(savedLocalItems, paletDraftSuffix);
    if (!paletDetails || paletDetails === 'ISI_NANTI' || paletDetails === 'KAMERA') {
      uploadInProgress = false;
      _activeBatchProgress = null;
      renderUploadTrackerV2();
      renderLocalThumbnails();
      
      if (paletDetails === 'KAMERA') {
        setUploadJobStatus(uploadJob, 'PENDING_CAMERA');
        crudTrace('uploadPhoto', uploadTraceId, 'palet_details_camera');
      } else {
        await markPaletItemsNeedUserAction_(savedLocalItems);
        setUploadJobStatus(uploadJob, 'FAILED', { failedCount: savedLocalItems.length });
        crudTrace('uploadPhoto', uploadTraceId, 'palet_details_pending', { items: savedLocalItems.length });
        Toast.fire({ icon: 'info', title: 'Foto palet tersimpan. Lengkapi data palet dari thumbnail.' });
      }
      return;
    }
    await applyPaletDetailsToLocalItems_(savedLocalItems, paletDetails, paletDraftSuffix);
    crudTrace('uploadPhoto', uploadTraceId, 'palet_details_saved', { items: savedLocalItems.length });
    renderLocalThumbnails();
    renderUploadTrackerV2();
  }

  var uploadableItems = (await getLocalQueue()).filter(function(item) {
    return (item.status === 'LOCAL_SAVED' || item.status === 'READY_TO_UPLOAD') && item.meta && item.meta.containerId === c.id && item.meta.uploadType === uploadTabType;
  });
  if (uploadableItems.length === 0) {
    uploadInProgress = false;
    setUploadJobStatus(uploadJob, 'FAILED');
    await showUploadResult(uploadJob.totalCount, uploadJob);
    renderUploadTrackerV2();
    renderLocalThumbnails();
    return;
  }

  // === PHASE 2: Create Batches ===
  var batches = createBatches(uploadableItems, uploadTabType, uploadJob.jobId);

  // Save batches and update items in IndexedDB
  for (var bi = 0; bi < batches.length; bi++) {
    await _idbPut(STORE_BATCH, batches[bi]);
    for (var bj = 0; bj < batches[bi].itemIds.length; bj++) {
      await updateLocalItem(batches[bi].itemIds[bj], {
        batchId: batches[bi].batchId,
        jobId: uploadJob.jobId,
        status: 'WAITING_BATCH'
      });
    }
  }

  // === PHASE 3: Execute Batches Sequentially ===
  resetUploadTokenManager(baseMeta);
  crudTrace('uploadPhoto', uploadTraceId, 'upload_batches_start', { batches: batches.length });
  for (var bk = 0; bk < batches.length; bk++) {
    await executeBatchUpload(batches[bk], uploadJob);
  }
  crudTrace('uploadPhoto', uploadTraceId, 'upload_batches_end');

  // === PHASE 4: Show Result ===
  uploadInProgress = false;
  await showUploadResult(uploadJob.totalCount, uploadJob);
  crudTrace('uploadPhoto', uploadTraceId, 'client_done');
  renderUploadTrackerV2();
  renderLocalThumbnails();
}

// =========================================================================
// 14. INIT — Called from showApp()
// =========================================================================
function initUploadModule() {
  if (_uploadModuleInitialized) return;
  _uploadModuleInitialized = true;
  openUploadDB().then(function() {
    if (!navigator.onLine) handleUploadOffline();
    recoverPendingUploads();
  }).catch(function(e) {
    console.warn('Upload module init failed:', e);
  });
}
</script>
