<script>
// =========================================================================
// CLIENT CONFIG — semua nilai default di sini akan di-overwrite dari AppConfig
// TIDAK ADA hardcode yang tersisa — semua diambil dari server saat login
// =========================================================================
var CLIENT_CONFIG = {
  MAX_IMAGE_PX: 1000, JPEG_QUALITY: 0.65,
  COMPRESS_CONCURRENCY: 2, UPLOAD_CONCURRENCY: 2,
  SYNC_INTERVAL_MS: 15000, TOAST_DURATION_MS: 2500,
  LOGIN_ENABLED: true, REQUIRE_PHOTO_TO_FINISH: true,
  REQUIRE_ALL_DONE_TO_FINISH: true,
  APP_TITLE: 'InLens', SIDEBAR_BRAND: 'InLens', APP_VERSION: 'v5.0.0',
  DOC_SUBFOLDER: 'Unloading', PALET_SUBFOLDER: 'Palet', SURAT_SUBFOLDER: 'Surat Jalan',
  DASHBOARD_TITLE: 'Sesi Aktif', DEBUG_PERFORMANCE: false
};

function loadServerConfig() {
  google.script.run
    .withFailureHandler(function(err) {
      console.warn('loadServerConfig gagal:', err);
      // App tetap jalan dengan CLIENT_CONFIG default — tidak critical
    })
    .withSuccessHandler(function(res) {
    if (!res || !res.success || !res.data) return;
    var d = res.data;
    CLIENT_CONFIG.MAX_IMAGE_PX           = d.maxImagePx            || 1000;
    CLIENT_CONFIG.JPEG_QUALITY           = d.jpegQuality            || 0.65;
    CLIENT_CONFIG.COMPRESS_CONCURRENCY   = d.compressConcurrency    || 4;
    CLIENT_CONFIG.UPLOAD_CONCURRENCY     = d.uploadConcurrency      || 8;
    CLIENT_CONFIG.SYNC_INTERVAL_MS       = d.syncIntervalMs         || 15000;
    CLIENT_CONFIG.TOAST_DURATION_MS      = d.toastDurationMs        || 2500;
    CLIENT_CONFIG.LOGIN_ENABLED          = d.loginEnabled           !== false;
    CLIENT_CONFIG.REQUIRE_PHOTO_TO_FINISH     = d.requirePhotoToFinish     !== false;
    CLIENT_CONFIG.REQUIRE_ALL_DONE_TO_FINISH  = d.requireAllDoneToFinish   !== false;
    CLIENT_CONFIG.APP_TITLE              = d.appTitle               || 'InLens';
    CLIENT_CONFIG.SIDEBAR_BRAND          = d.sidebarBrand           || 'InLens';
    CLIENT_CONFIG.APP_VERSION            = d.appVersion             || 'v5.0.0';
    CLIENT_CONFIG.DOC_SUBFOLDER          = d.docSubfolderName       || 'Unloading';
    CLIENT_CONFIG.PALET_SUBFOLDER        = d.paletSubfolderName     || 'Palet';
    CLIENT_CONFIG.SURAT_SUBFOLDER        = d.suratSubfolderName     || 'Surat Jalan';
    CLIENT_CONFIG.DASHBOARD_TITLE        = d.dashboardTitle         || 'Sesi Aktif';
    CLIENT_CONFIG.DEBUG_PERFORMANCE      = d.debugPerformance === true;

    document.title = CLIENT_CONFIG.APP_TITLE;
    var el;
    el = document.getElementById('sidebar-brand-text'); if(el) el.textContent = CLIENT_CONFIG.SIDEBAR_BRAND;
    el = document.getElementById('sidebar-version');    if(el) el.textContent = CLIENT_CONFIG.APP_VERSION;
    el = document.getElementById('login-version');      if(el) el.textContent = 'Versi ' + CLIENT_CONFIG.APP_VERSION;
    el = document.getElementById('login-title');        if(el) el.textContent = 'Welcome to ' + CLIENT_CONFIG.APP_TITLE + '!';
  }).getAppConfig();
}

var Toast = Swal.mixin({ toast:true, position:'top-end', showConfirmButton:false, timer:2500, customClass:{popup:'custom-swal'} });

// =========================================================================
// PERFORMANCE UTILITY: gasRun() — Timeout wrapper untuk google.script.run
// Mencegah UI hang selamanya jika server tidak merespons.
// Default timeout: 30 detik
// =========================================================================
function gasRun(fnName, args, timeoutMs) {
  timeoutMs = timeoutMs || 30000;
  return new Promise(function(resolve, reject) {
    var timer = setTimeout(function() {
      reject(new Error('Server tidak merespons dalam ' + Math.round(timeoutMs/1000) + ' detik. Coba lagi.'));
    }, timeoutMs);
    var runner = google.script.run
      .withSuccessHandler(function(res) { clearTimeout(timer); resolve(res); })
      .withFailureHandler(function(err) { clearTimeout(timer); reject(err); });
    if (args && args.length) { runner[fnName].apply(runner, args); }
    else { runner[fnName](); }
  });
}

function createCrudTraceId(action) {
  return String(action || 'action') + '-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
}

function crudTrace(action, requestId, step, extra) {
  if (!CLIENT_CONFIG.DEBUG_PERFORMANCE) return;
  var msg = '[CRUD_TRACE] action=' + (action || '-')
    + ' requestId=' + (requestId || '-')
    + ' step=' + (step || '-')
    + ' time=' + new Date().toISOString()
    + ' perf=' + Math.round(performance.now());
  if (extra !== undefined) {
    try { msg += ' data=' + JSON.stringify(extra); }
    catch(e) { msg += ' data=' + String(extra); }
  }
  console.log(msg);
}

function crudTraceAfterRender(action, requestId, step, extra) {
  if (!CLIENT_CONFIG.DEBUG_PERFORMANCE) return;
  requestAnimationFrame(function() {
    crudTrace(action, requestId, step || 'ui_render_done', extra);
  });
}

// Debounce utility
function debounce(fn, delay) {
  var timer = null;
  return function() {
    var args = arguments, ctx = this;
    if (timer) clearTimeout(timer);
    timer = setTimeout(function() { fn.apply(ctx, args); }, delay);
  };
}

function escapeHtml(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
  });
}

function toTitleCaseText(value) {
  return String(value || '')
    .trim()
    .replace(/\s+/g, ' ')
    .toLowerCase()
    .replace(/(^|[\s.'"-])([a-z])/g, function(match, prefix, letter) {
      return prefix + letter.toUpperCase();
    });
}

function getLocalDateInputValue(dateValue) {
  var d = dateValue ? new Date(dateValue) : new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, '0');
  var day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

// =========================================================================
// STATE
// =========================================================================
var state;
try { state = JSON.parse(localStorage.getItem('inlens_v5') || 'null'); } catch(e) { state = null; }
if (!state) {
  state = { loggedIn:false, username:'', fullName:'', role:'', activeSessionId:null, activeSession:null, containers:[], activeTab:'dokumen', activeContainerId:null, myStatus:'WORKING', dropdowns:{brands:[],pics:[],vehicles:[]}, darkMode:false, viewMode:false };
}
function save() { try { localStorage.setItem('inlens_v5', JSON.stringify(state)); } catch(e) {} }

var uploadInProgress = false, deleteInProgress = false;
var lastSyncHash = '', syncFailCount = 0, _syncRunning = false, _syncQueuedForceFresh = false;
var _syncRequestSeq = 0, _sessionLoadSeq = 0, _stateMutationSeq = 0;
var SYNC_ACTIVE = 12000, SYNC_IDLE = 30000, SYNC_DEEP_IDLE = 60000;
var lastActivity = Date.now(), adaptiveSyncTimer = null;

function markLocalMutation_(reason) {
  _stateMutationSeq++;
  crudTrace('localState', 'local-' + _stateMutationSeq, reason || 'mutation', { mutationSeq: _stateMutationSeq });
  return _stateMutationSeq;
}

var _crudInFlight = {};
function beginCrudAction_(action, message) {
  if (_crudInFlight[action]) {
    Toast.fire({icon:'info',title:message||'Proses sebelumnya masih berjalan'});
    return false;
  }
  _crudInFlight[action] = true;
  return true;
}
function endCrudAction_(action) {
  delete _crudInFlight[action];
}

// =========================================================================
// DEPRECATED UPLOAD TRACKER - retained only for old upload fallback path.
// =========================================================================
var deprecatedUploadRetryQueue_ = [];
var deprecatedUploadTracker_ = {
  total: 0, compressed: 0, uploaded: 0, logged: 0, failed: 0,
  failedItems: [], // { index, fileName, blob, meta, attempts, error }
  active: false
};

function deprecatedAddToRetryQueue_(blob, meta, fileName, photoIndex, error) {
  var existing = deprecatedUploadRetryQueue_.find(function(q){ return q.fileName === fileName; });
  if (existing) return;
  deprecatedUploadRetryQueue_.push({
    blob: blob, meta: meta, fileName: fileName,
    photoIndex: photoIndex || 0, attempts: 0,
    error: error || 'Upload gagal'
  });
  deprecatedUploadTracker_.failed = deprecatedUploadRetryQueue_.length;
  deprecatedRenderUploadTracker_();
}

var _trackerRenderPending = false;
var _trackerRenderTimer = null;
function deprecatedRenderUploadTracker_(force) {
  if (!force && deprecatedUploadTracker_.active) {
    // Throttle: max 1 render per 150ms saat upload aktif
    if (_trackerRenderPending) return;
    _trackerRenderPending = true;
    _trackerRenderTimer = setTimeout(function() {
      _trackerRenderPending = false;
      deprecatedRenderUploadTrackerNow_();
    }, 150);
    return;
  }
  // Force render atau tidak aktif — langsung render
  if (_trackerRenderTimer) { clearTimeout(_trackerRenderTimer); _trackerRenderPending = false; }
  deprecatedRenderUploadTrackerNow_();
}

function deprecatedRenderUploadTrackerNow_() {
  var el = document.getElementById('upload-tracker');
  var hasQueue = deprecatedUploadRetryQueue_.length > 0;
  var isActive = deprecatedUploadTracker_.active;

  if (!isActive && !hasQueue) {
    if (el) { el.style.opacity='0'; setTimeout(function(){ if(el)el.remove(); },300); }
    return;
  }

  if (!el) {
    el = document.createElement('div');
    el.id = 'upload-tracker';
    el.style.cssText = 'position:fixed;bottom:64px;left:8px;right:8px;'
      + 'background:#fff;border:1px solid #e2e8f0;border-radius:14px;'
      + 'padding:14px 16px;z-index:600;box-shadow:0 8px 24px rgba(0,0,0,0.12);'
      + 'font-family:Poppins,sans-serif;transition:opacity 0.3s;opacity:0';
    document.body.appendChild(el);
    requestAnimationFrame(function(){ el.style.opacity='1'; });
  }

  var html = '';

  if (isActive) {
    var pctCompress = deprecatedUploadTracker_.total > 0 ? Math.round(deprecatedUploadTracker_.compressed / deprecatedUploadTracker_.total * 100) : 0;
    var pctUpload = deprecatedUploadTracker_.total > 0 ? Math.round(deprecatedUploadTracker_.uploaded / deprecatedUploadTracker_.total * 100) : 0;
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
      + '<span style="font-size:13px;font-weight:600;color:#1e293b">Upload ' + deprecatedUploadTracker_.total + ' foto</span>'
      + '<span style="font-size:11px;color:#64748b">' + deprecatedUploadTracker_.uploaded + '/' + deprecatedUploadTracker_.total + ' selesai</span></div>';

    // Dual progress bar
    html += '<div style="display:flex;gap:4px;margin-bottom:6px">'
      + '<div style="flex:1"><div style="font-size:9px;color:#94a3b8;margin-bottom:2px">Kompres</div>'
      + '<div style="height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden">'
      + '<div style="height:100%;width:' + pctCompress + '%;background:#3b82f6;border-radius:3px;transition:width 0.2s"></div></div></div>'
      + '<div style="flex:1"><div style="font-size:9px;color:#94a3b8;margin-bottom:2px">Upload</div>'
      + '<div style="height:6px;background:#f1f5f9;border-radius:3px;overflow:hidden">'
      + '<div style="height:100%;width:' + pctUpload + '%;background:#22c55e;border-radius:3px;transition:width 0.2s"></div></div></div></div>';

    if (deprecatedUploadTracker_.failed > 0) {
      html += '<div style="font-size:11px;color:#dc2626;font-weight:500">'
        + deprecatedUploadTracker_.failed + ' foto gagal (auto-retry setelah selesai)</div>';
    }
  }

  if (!isActive && hasQueue) {
    html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
      + '<div style="width:28px;height:28px;border-radius:7px;background:#fef2f2;display:flex;'
      + 'align-items:center;justify-content:center;flex-shrink:0">'
      + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2">'
      + '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/>'
      + '<line x1="9" y1="9" x2="15" y2="15"/></svg></div>'
      + '<div style="flex:1"><div style="font-size:13px;font-weight:600;color:#1e293b">'
      + deprecatedUploadRetryQueue_.length + ' foto gagal upload</div>'
      + '<div style="font-size:11px;color:#64748b">Ketuk untuk lihat detail</div></div>'
      + '<button onclick="deprecatedRetryFailedUploads_(false)" style="padding:6px 14px;border:none;border-radius:8px;'
      + 'background:#1d4ed8;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">'
      + 'Kirim ulang</button></div>';

    // Daftar foto gagal (tampilkan max 5, sisanya "dan X lainnya")
    var showMax = Math.min(deprecatedUploadRetryQueue_.length, 5);
    html += '<div style="background:#fef2f2;border-radius:8px;padding:8px 10px;margin-bottom:6px">';
    for (var i = 0; i < showMax; i++) {
      var q = deprecatedUploadRetryQueue_[i];
      html += '<div style="display:flex;align-items:center;gap:6px;padding:3px 0;'
        + (i < showMax - 1 ? 'border-bottom:1px solid #fecaca;' : '') + '">'
        + '<span style="font-size:11px;color:#991b1b;font-weight:600;min-width:28px">Foto ' + (q.photoIndex + 1) + '</span>'
        + '<span style="font-size:10px;color:#dc2626;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
        + q.error + '</span>'
        + '<span style="font-size:9px;color:#f87171">×' + (q.attempts + 1) + '</span></div>';
    }
    if (deprecatedUploadRetryQueue_.length > 5) {
      html += '<div style="font-size:10px;color:#991b1b;padding-top:4px;font-weight:500">'
        + 'dan ' + (deprecatedUploadRetryQueue_.length - 5) + ' foto lainnya</div>';
    }
    html += '</div>';

    // Tampilkan tombol sesuai state auto-retry
    if (_autoRetryTimer && !_autoRetryStopped) {
      // Sedang menunggu auto-retry — tampilkan countdown + tombol hentikan
      html += '<div style="display:flex;gap:6px">'
        + '<button onclick="stopAutoRetry()" style="flex:1;padding:6px;border:1px solid #fca5a5;'
        + 'border-radius:6px;background:#fef2f2;font-size:11px;color:#dc2626;cursor:pointer;font-family:inherit">'
        + 'Hentikan</button>'
        + '<button onclick="deprecatedRetryFailedUploads_(false)" style="flex:2;padding:6px;border:none;border-radius:6px;'
        + 'background:#1d4ed8;font-size:11px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit">'
        + 'Kirim ulang sekarang</button></div>';
    } else {
      html += '<div style="display:flex;gap:6px">'
        + '<button onclick="dismissRetryQueue()" style="flex:1;padding:6px;border:1px solid #e2e8f0;'
        + 'border-radius:6px;background:#fff;font-size:11px;color:#64748b;cursor:pointer;font-family:inherit">'
        + 'Abaikan</button>'
        + '<button onclick="deprecatedRetryFailedUploads_(false)" style="flex:2;padding:6px;border:none;border-radius:6px;'
        + 'background:#1d4ed8;font-size:11px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit">'
        + 'Kirim ulang ' + deprecatedUploadRetryQueue_.length + ' foto</button></div>';
    }
  }

  el.innerHTML = html;
}

// =========================================================================
// UPLOAD RETRY-UNTIL-SUCCESS
// V6 FIX: Foto gagal akan terus dicoba ulang secara otomatis sampai berhasil.
// Backoff: 5s → 10s → 20s → 30s (cap), berhenti saat semua berhasil.
// User bisa tekan "Hentikan" untuk membatalkan auto-retry.
// =========================================================================
var _autoRetryTimer = null;
var _autoRetryRound = 0;
var _autoRetryStopped = false;

function scheduleAutoRetry(delayMs) {
  if (_autoRetryStopped) return;
  if (_autoRetryTimer) clearTimeout(_autoRetryTimer);
  var sec = Math.round(delayMs / 1000);
  // Update tracker dengan countdown info
  var el = document.getElementById('upload-tracker');
  if (el) {
    var countdown = el.querySelector('.retry-countdown');
    if (!countdown) {
      countdown = document.createElement('div');
      countdown.className = 'retry-countdown';
      countdown.style.cssText = 'font-size:11px;color:#64748b;text-align:center;padding:4px 0';
      el.appendChild(countdown);
    }
    countdown.textContent = 'Kirim ulang otomatis dalam ' + sec + ' detik...';
  }
  _autoRetryTimer = setTimeout(function() {
    if (!_autoRetryStopped && deprecatedUploadRetryQueue_.length > 0) {
      deprecatedRetryFailedUploads_(true); // true = auto mode
    }
  }, delayMs);
}

function stopAutoRetry() {
  _autoRetryStopped = true;
  _autoRetryRound = 0;
  if (_autoRetryTimer) { clearTimeout(_autoRetryTimer); _autoRetryTimer = null; }
  var el = document.getElementById('upload-tracker');
  if (el) { var cd = el.querySelector('.retry-countdown'); if(cd) cd.textContent = 'Auto-retry dihentikan.'; }
  Toast.fire({icon:'info', title:'Auto-retry dihentikan'});
}

async function deprecatedRetryFailedUploads_(isAuto) {
  if (deprecatedUploadTracker_.active) return;
  var queue = deprecatedUploadRetryQueue_.splice(0);
  if (!queue.length) return;

  // Reset stop flag saat user klik manual (bukan auto)
  if (!isAuto) { _autoRetryStopped = false; _autoRetryRound = 0; }

  deprecatedUploadTracker_ = {
    total: queue.length, compressed: queue.length,
    uploaded: 0, logged: 0, failed: 0,
    failedItems: [], active: true
  };
  deprecatedRenderUploadTracker_();

  var successItems = [], stillFailed = [];
  var CONCURRENCY = CLIENT_CONFIG.UPLOAD_CONCURRENCY || 3;
  var credentials = null;

  // Ambil credentials — retry setelah 5 detik jika gagal
  try {
    credentials = await getUploadCredentials(queue[0].meta);
  } catch(e) {
    queue.forEach(function(item){ item.attempts++; });
    deprecatedUploadRetryQueue_ = queue; // kembalikan semua — tidak ada batas percobaan
    deprecatedUploadTracker_.active = false;
    deprecatedRenderUploadTracker_();
    if (!_autoRetryStopped) {
      _autoRetryRound++;
      var delay = Math.min(5000 * Math.pow(2, Math.min(_autoRetryRound - 1, 3)), 30000);
      Toast.fire({icon:'warning', title:'Gagal mendapat akses Drive', text:'Mencoba ulang dalam ' + Math.round(delay/1000) + 's'});
      scheduleAutoRetry(delay);
    }
    return;
  }

  // Upload paralel pakai pool
  var cursor = 0;
  async function worker() {
    while (cursor < queue.length) {
      var idx = cursor++;
      var item = queue[idx];
      var folderId = credentials.folderIds[item.meta.uploadType];
      try {
        var fileId = await directUploadToDrive(
          item.blob, item.fileName, folderId, credentials.token, item.meta
        );
        successItems.push({
          fileId: fileId, containerId: item.meta.containerId, type: item.meta.uploadType
        });
        deprecatedUploadTracker_.uploaded++;
      } catch(e) {
        item.attempts++;
        item.error = e.message || 'Upload gagal';
        stillFailed.push(item); // SELALU tambah kembali — tidak ada batas percobaan
        deprecatedUploadTracker_.failed++;
      }
      deprecatedRenderUploadTracker_();
    }
  }

  var workers = [];
  for (var w = 0; w < Math.min(CONCURRENCY, queue.length); w++) workers.push(worker());
  await Promise.all(workers);

  // Log batch ke server
  if (successItems.length > 0) {
    var LOG_CHUNK = 20;
    for (var b = 0; b < successItems.length; b += LOG_CHUNK) {
      var chunk = successItems.slice(b, b + LOG_CHUNK);
      await new Promise(function(resolve) {
        google.script.run
          .withSuccessHandler(function(){ resolve(); })
          .withFailureHandler(function(){ resolve(); })
          .logDirectUploads({ meta: queue[0].meta, items: chunk });
      });
    }
    lastSyncHash = ''; cloudSync(true);
  }

  deprecatedUploadRetryQueue_ = stillFailed;
  deprecatedUploadTracker_.active = false;
  deprecatedRenderUploadTracker_();

  if (successItems.length > 0 && stillFailed.length === 0) {
    // SEMUA BERHASIL
    _autoRetryRound = 0; _autoRetryStopped = false;
    Swal.fire({
      icon:'success', title:'Semua foto berhasil dikirim!',
      html:'<div style="text-align:center"><div style="font-size:36px;font-weight:700;color:#15803d">'
        + successItems.length + '</div><div style="font-size:13px;color:#64748b">foto berhasil diupload ulang</div></div>',
      confirmButtonText:'OK',
      customClass:{popup:'custom-swal',confirmButton:'btn-primary'}, buttonsStyling:false
    });
  } else if (stillFailed.length > 0) {
    // MASIH ADA YANG GAGAL — auto-retry
    if (!_autoRetryStopped) {
      _autoRetryRound++;
      var delay = Math.min(5000 * Math.pow(2, Math.min(_autoRetryRound - 1, 3)), 30000);
      // Notifikasi + countdown
      var partialMsg = successItems.length > 0
        ? successItems.length + ' berhasil, ' + stillFailed.length + ' masih gagal.'
        : stillFailed.length + ' foto masih gagal.';
      Toast.fire({icon:'warning', title: partialMsg, text:'Kirim ulang otomatis dalam ' + Math.round(delay/1000) + 's'});
      scheduleAutoRetry(delay);
    } else {
      deprecatedRenderUploadTracker_(); // tampilkan tombol retry manual
    }
  }
}

function dismissRetryQueue() {
  _autoRetryStopped = true;
  _autoRetryRound = 0;
  if (_autoRetryTimer) { clearTimeout(_autoRetryTimer); _autoRetryTimer = null; }
  deprecatedUploadRetryQueue_ = [];
  deprecatedUploadTracker_.failed = 0;
  deprecatedRenderUploadTracker_();
}

// =========================================================================
// GLOBAL ERROR HANDLER — tangkap error JS yang tidak tertangani
// =========================================================================
window.onerror = function(msg, url, line, col, error) {
  console.error('Unhandled error:', msg, 'at line', line);
  if (msg && msg.indexOf && msg.indexOf('Script error') < 0) {
    Toast.fire({ icon: 'error', title: 'Terjadi kesalahan teknis' });
  }
  return false;
};
window.addEventListener('unhandledrejection', function(event) {
  console.error('Unhandled promise rejection:', event.reason);
});

['click','scroll','touchstart','keydown'].forEach(function(ev) {
  document.addEventListener(ev, function() { lastActivity = Date.now(); }, { passive:true });
});
function getAdaptiveInterval() {
  var idle = Date.now() - lastActivity;
  if (idle < 120000) return SYNC_ACTIVE;
  if (idle < 180000) return SYNC_IDLE;
  return SYNC_DEEP_IDLE;
}

var _actionInProgress = {};
function guardAction(name, fn) {
  if (_actionInProgress[name]) return;
  _actionInProgress[name] = true;
  try { var r = fn(); if (r && typeof r.then === 'function') { r.finally(function(){_actionInProgress[name]=false;}); } else { _actionInProgress[name] = false; } }
  catch(e) { _actionInProgress[name] = false; throw e; }
}

function renderSkeleton(count) {
  var h = ''; for (var i=0;i<(count||3);i++) h += '<div class="skeleton skeleton-card"></div>'; return h;
}

function isOfflineBannerVisible() {
  var banner = document.getElementById('offline-banner');
  return !!(banner && banner.classList.contains('show'));
}

function isUploadOfflineNow() {
  return !navigator.onLine
    || isOfflineBannerVisible()
    || (typeof _uploadPausedOffline !== 'undefined' && _uploadPausedOffline);
}

window.addEventListener('offline', function() {
  if (typeof handleUploadOffline === 'function') handleUploadOffline();
  else document.getElementById('offline-banner').classList.add('show');
});
window.addEventListener('online', function() {
  if (typeof handleUploadOnline === 'function') handleUploadOnline();
  else {
  document.getElementById('offline-banner').classList.remove('show');
  Toast.fire({icon:'success',title:'Koneksi kembali — menyinkronkan...'});
  }
  // Auto sync + retry queue saat koneksi kembali
  if (state.activeSessionId) { lastSyncHash=''; cloudSync(true); }

function comparePalletNoNatural(a,b){
  var left=cleanPaletName(typeof a==='object'?(a.palletNo||a.pallet||a.palletKey||''):a);
  var right=cleanPaletName(typeof b==='object'?(b.palletNo||b.pallet||b.palletKey||''):b);
  var lp=left.match(/\d+|\D+/g)||[left];
  var rp=right.match(/\d+|\D+/g)||[right];
  var len=Math.min(lp.length,rp.length);
  for(var i=0;i<len;i++){
    var ln=/^\d+$/.test(lp[i]),rn=/^\d+$/.test(rp[i]);
    if(ln&&rn){
      var diff=Number(lp[i])-Number(rp[i]);
      if(diff!==0)return diff;
    }else{
      var cmp=lp[i].localeCompare(rp[i]);
      if(cmp!==0)return cmp;
    }
  }
  return lp.length-rp.length||left.localeCompare(right);
}
function sortSjActualRows(rows){

function getDuplicatePalletRows(rows){

    var key=row&&row.palletKey;
    if(!key)return;

    seen[key]=(seen[key]||0)+1;
  });
  return dups;
}

function getSjValidationBuckets(rows,data){

  });
  if(!buckets.sjOnly.length)(data&&data.missingInActual||[]).forEach(function(item){buckets.sjOnly.push(typeof item==='string'?item:(item.palletNo||item.palletKey||''));});
  if(!buckets.actualOnly.length)(data&&data.missingInSj||[]).forEach(function(item){buckets.actualOnly.push(typeof item==='string'?item:(item.palletNo||item.palletKey||''));});
  if(!buckets.variance.length)(data&&data.qtyMismatch||[]).forEach(function(item){buckets.variance.push(typeof item==='string'?item:(item.palletNo||item.palletKey||''));});
  (data&&data.duplicateActual||[]).forEach(function(item){buckets.duplicate.push(typeof item==='string'?item:(item.palletNo||item.palletKey||''));});
  (data&&data.duplicateSj||[]).forEach(function(item){buckets.duplicate.push(typeof item==='string'?item:(item.palletNo||item.palletKey||''));});

function getSjQtyInvalidExplanation(data){

  var status=String(data.status||'').toUpperCase();
  var actualCount=Number(data.actualCount||0);
  var sjCount=Number(data.sjCount||0);
  if(status==='NOT_FINAL'||status==='CHECKING'||data.validationFinal===false){
    return data.subText||'Validasi final dari server belum berhasil. Sinkronkan ulang sebelum print atau finish.';
  }

    return 'Data validasi belum terbaca oleh server. Pastikan upload/log selesai, SJ Qty sudah tersimpan, lalu sinkronkan ulang.';
  }
  if(status==='EMPTY'||sjCount===0){
    return 'SJ Qty belum tersimpan atau belum terbaca oleh server. Import atau input manual SJ Qty sebelum handover.';
  }
  if(status==='WAITING_ACTUAL'||actualCount===0){

function getSjManualPalletKey(row){
  row=row||{};

function getSjManualQtyValue(row){
  row=row||{};
  var value;
  if(row.sjQty!==undefined&&row.sjQty!==null)value=row.sjQty;
  else if(row.sj!==undefined&&row.sj!==null)value=row.sj;
  else if(row.qty!==undefined&&row.qty!==null)value=row.qty;
  else return '';
  return String(value).trim()===''?'':value;
}
function buildSjManualExistingMap(rows){

  (rows||[]).forEach(function(row){
    var key=getSjManualPalletKey(row);
    if(!key||map[key])return;
    var qty=getSjManualQtyValue(row);
    if(qty===''||qty===undefined||qty===null)return;
    map[key]={palletKey:key,palletNo:row.palletNo||row.pallet||key,sjQty:qty};
  });
  return map;
}
function getSjQtyManualFallbackRows(){

    if(key&&qty!=='')rows.push({palletKey:key,palletNo:row.palletNo||row.pallet||key,sjQty:qty});
  });
  (sj.detailRows||[]).forEach(function(row){
    var key=getSjManualPalletKey(row);

function mergeSjQtyManualRowsIntoOpenForm(rows,modalSeq){

function saveSjQtyTemplateFile_(data,sessionId){

  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;

function ensureNoPendingUploadForHandover(sessionId){
  var activeJob=(typeof _activeUploadJob!=='undefined')?_activeUploadJob:null;
  var activeJobSession=String(activeJob&&activeJob.sessionId||'').trim();
  if(activeJob&&sessionId&&activeJobSession&&activeJobSession!==String(sessionId||'').trim())activeJob=null;
  var activeStatus=activeJob&&activeJob.status?String(activeJob.status):'';
  if(uploadInProgress||(activeStatus&&activeStatus!=='DONE')){
    var activeSyncPending=activeStatus==='SYNC_PENDING'?Number(activeJob&&activeJob.syncPendingCount||activeJob&&activeJob.totalCount||1):0;
    var activeLogPending=activeStatus==='LOG_PENDING'?Number(activeJob&&activeJob.pendingLogCount||1):Number(activeJob&&activeJob.pendingLogCount||0);
    var activeFailed=activeStatus==='FAILED'||activeStatus==='PARTIAL_FAILED'?Number(activeJob&&activeJob.failedCount||1):Number(activeJob&&activeJob.failedCount||0);
    var activeUploadPending=(activeSyncPending>0||activeLogPending>0||activeFailed>0)?0:(Number(activeJob&&activeJob.totalCount||0)||1);
    showUploadPendingForHandoverAlert({
      uploadPending:activeUploadPending,
      logPending:activeLogPending,
      syncPending:activeSyncPending,
      failedUpload:activeFailed,
      activeStatus:activeStatus||'RUNNING',
      activeMessage:'Upload di perangkat ini masih berstatus '+(activeStatus||'berjalan')+'. Tunggu sampai benar-benar Done sebelum print atau finish.'
    });
    return Promise.resolve(false);
  }
  if(typeof getUploadBlockingSummary!=='function')return Promise.resolve(true);
  return getUploadBlockingSummary(sessionId).then(function(summary){
    if(summary&&summary.blocking){
      showUploadPendingForHandoverAlert(summary);
      return false;
    }
    return true;
  }).catch(function(err){
    console.warn('Gagal membaca status upload lokal:',err);
    showUploadPendingForHandoverAlert({
      uploadPending:0,
      logPending:0,
      failedUpload:0,
      activeStatus:'UNKNOWN',
      activeMessage:'Status upload lokal gagal dibaca. Muat ulang halaman, pastikan upload/log selesai, lalu coba lagi.'
    });
    return false;
  });
}

function cleanPaletName(value) {
  if (!value) return '';
  return String(value).toUpperCase().replace(/[^A-Z0-9\s\-]/g, '').replace(/\s+/g, ' ').trim();

function cleanPaletKoli(value) {
  if (!value) return 0;

function safeFileSegment(value) {

        document.getElementById('palet-btn-kamera').addEventListener('click', function() {

          resolve('KAMERA');

function generatePhotoFileName(tab, globalIndex, paletMeta) {

  var now = new Date();

  c.reopenedAt=life.reopenedAt||c.reopenedAt||'';
  c.reopenedAtMs=life.reopenedAtMs||c.reopenedAtMs||0;
  c.reopenedAtText=life.reopenedAtText||c.reopenedAtText||'';

function buildSyncHash(containers, sjQty, users, session){
  var containerHash=(containers||[]).map(function(c){
    var photoHash=(c.photos||[]).map(function(p){
      return String((p&&p.id)||'').trim()+'~'+normalizePhotoType(p&&p.type)+'~'+String((p&&p.paletName)||'').trim()+'~'+String((p&&p.paletKoli)||'').trim();
    }).sort().join(',');
    return [
      String((c&&c.id)||'').trim(),
      String((c&&c.number)||'').trim(),
      String((c&&c.driver)||'').trim(),
      String((c&&c.plate)||'').trim(),
      String((c&&c.qtyKoli)||0).trim(),
      getFleetWorkStatus(c),
      String((c&&c.startedAtMs)||0).trim(),
      String((c&&c.completedAtMs)||0).trim(),
      String((c&&c.reopenedAtMs)||0).trim(),
      photoHash
    ].join(':');
  }).join('|');
  var userHash=(users||[]).map(function(u){
    return String((u&&u.name)||'').trim().toLowerCase()+':'+String((u&&u.status)||'').trim()+':'+(u&&u.isAdmin?'1':'0');
  }).sort().join('|');
  var sessionHash=session?[
    String(session.brand||''),
    String(session.shipment||''),
    String(session.forwarder||''),
    String(session.lossPreventionName||''),
    String(session.lossPreventionDate||'')
  ].join(':'):'';
  return containerHash+'::users='+userHash+'::session='+sessionHash+'::sj='+(sjQty?[
    String(sjQty.status||''),
    String(sjQty.sjCount||0),
    String(sjQty.actualCount||0),
    String(sjQty.matchedCount||0),
    String(sjQty.totalSjQty||0),
    String(sjQty.totalVariance||0),
    sjQty.canHandover===true?'1':'0',
    sjQty.validationFinal===true?'1':'0',
    String(sjQty.reasonCode||''),
    String((sjQty.qtyMismatch||[]).length||0)
  ].join(':'):'');
}

var loginInProgress = false;
function handleLogin() {
  if (loginInProgress) return;
  var user = document.getElementById('login-user').value.trim();
  var pass = document.getElementById('login-pass').value.trim();
  var errEl = document.getElementById('login-error');
  var btn   = document.getElementById('btn-login');
  if (!user || !pass) {
    errEl.style.display='block';
    errEl.textContent='Username dan password harus diisi.';
    errEl.style.animation='shake 0.4s ease';
    setTimeout(function(){errEl.style.animation='';},400);
    return;
  }
  loginInProgress=true; errEl.style.display='none'; btn.disabled=true; btn.textContent='LOGGING IN...';
  google.script.run
    .withSuccessHandler(function(res){
      loginInProgress=false; btn.disabled=false; btn.textContent='LOGIN'; validateLoginInputs();
      if(res.success){state.loggedIn=true;state.username=res.data.username;state.fullName=res.data.fullName||res.data.username;state.role=res.data.role||'staff';save();showApp();}
      else{errEl.style.display='block';errEl.textContent=res.message;btn.style.animation='shake 0.4s ease';setTimeout(function(){btn.style.animation='';},400);}
    })
    .withFailureHandler(function(){loginInProgress=false;btn.disabled=false;btn.textContent='LOGIN';validateLoginInputs();errEl.style.display='block';errEl.textContent='Gagal terhubung ke server. Coba lagi.';})
    .verifyLogin(user, pass);
}

function validateLoginInputs(){
  var u=document.getElementById('login-user');
  var p=document.getElementById('login-pass');
  var b=document.getElementById('btn-login');
  if(!u||!p||!b)return;
  if(!loginInProgress)b.disabled=!(u.value.trim().length>0&&p.value.trim().length>0);
}

function showApp(){

  var ini=dn.split(' ').map(function(w){return w[0]||'';}).join('').substring(0,2).toUpperCase();

  document.getElementById('dd-role').textContent=state.username;

  var DROPDOWN_CACHE_KEY='inlens_dropdown_cache', DROPDOWN_CACHE_TTL=3600000, cachedDD=null;
  try{cachedDD=JSON.parse(localStorage.getItem(DROPDOWN_CACHE_KEY));}catch(e){}
  if(cachedDD&&cachedDD.ts&&(Date.now()-cachedDD.ts<DROPDOWN_CACHE_TTL)){state.dropdowns=cachedDD.data;save();populateDropdowns();}
  else{
    google.script.run
      .withSuccessHandler(function(res){
        if(res && res.success){
          state.dropdowns=res.data;save();populateDropdowns();
          try{localStorage.setItem(DROPDOWN_CACHE_KEY,JSON.stringify({data:res.data,ts:Date.now()}));}catch(e){}

        if(sel)sel.innerHTML='<option value="">Gagal muat - muat ulang halaman</option>';
        Toast.fire({icon:'error',title:'Dropdown gagal dimuat',text:'Periksa koneksi internet lalu muat ulang halaman'});
      })

  var dmt=document.getElementById('dark-mode-toggle');if(dmt)dmt.checked=!!state.darkMode;
  document.body.classList.toggle('dark-mode',!!state.darkMode);
  var dateEl=document.getElementById('in-date');if(dateEl)dateEl.value=getLocalDateInputValue();

function refreshDropdowns(){
  try{localStorage.removeItem('inlens_dropdown_cache');}catch(e){}
  var sel=document.getElementById('in-brand');
  if(sel)sel.innerHTML='<option value="">Memuat...</option>';
  google.script.run
    .withSuccessHandler(function(res){
      if(res && res.success){
        state.dropdowns=res.data;save();populateDropdowns();
        try{localStorage.setItem('inlens_dropdown_cache',JSON.stringify({data:res.data,ts:Date.now()}));}catch(e){}
        Toast.fire({icon:'success',title:'Dropdown diperbarui'});

  document.querySelectorAll('.sidebar-item').forEach(function(i){i.classList.remove('active');});

  var mi=document.querySelector('.mnav-item[data-page="'+pageId+'"]');if(mi)mi.classList.add('active');

  var titles={dashboard:CLIENT_CONFIG.DASHBOARD_TITLE||'Sesi Aktif',newsession:'Sesi baru',history:'Riwayat',session:'Sesi',profile:'More'};
  document.getElementById('topbar-title').textContent=titles[pageId]||'InLens';

  if(pageId!=='session'&&document.getElementById('topbar-info'))document.getElementById('topbar-info').textContent='';
  var mt=document.querySelector('.mobile-topbar'),mn=document.querySelector('.mobile-nav');

  if(mn)mn.style.display=pageId==='profile'?'none':'flex';
  if(pageId==='dashboard')loadDashboard();
  if(pageId==='session')loadSession(true);
  if(pageId==='history')loadHistory();
  if(pageId==='newsession')populateDropdowns();
}

      // === EMPTY STATE ===
      if((!d.mySessions||d.mySessions.length===0)&&(!d.otherSessions||d.otherSessions.length===0)){
        html+='<div class="card"><div class="empty-state">';
        html+='<div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>';

    })
    .catch(function(err){
      crudTrace('loadDashboard',requestId,'client_failure',{message:err&&err.toString?err.toString():String(err)});
      _dashRetryCount++;
      if (_dashRetryCount <= 3) {
        // Exponential backoff: 2s → 4s → 8s
        var delay = Math.pow(2, _dashRetryCount) * 1000;
        var msg = err && err.message ? err.message : String(err);
        el.innerHTML='<div style="text-align:center;padding:24px">'
          +'<p style="color:#64748b;font-size:13px">Mencoba ulang dalam '+(delay/1000)+' detik... ('+_dashRetryCount+'/3)</p>'
          +'<p style="color:#94a3b8;font-size:11px;margin-top:4px">'+msg+'</p></div>';
        setTimeout(loadDashboard, delay);
      } else {
        _dashRetryCount = 0;
        var msg = err && err.message ? err.message : String(err);
        el.innerHTML='<div style="text-align:center;padding:24px">'
          +'<p style="color:#dc2626;font-weight:600;margin-bottom:8px">Gagal terhubung ke server</p>'
          +'<p style="color:#64748b;font-size:12px;margin-bottom:12px">'+msg+'</p>'
          +'<button onclick="loadDashboard()" style="padding:8px 20px;border:none;border-radius:8px;background:#1d4ed8;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">Coba Lagi</button></div>';

// =========================================================================
// V6 FIX: gasRun() wrapper (timeout 30s) + retry 2x + notifikasi jelas
var _sessionLoadRetry = 0;
function loadSession(forceFresh){
  if(!state.activeSessionId)return navigateTo('dashboard');
  var requestedSessionId=String(state.activeSessionId||'');
  var sessionLoadSeq=++_sessionLoadSeq;
  var requestId=createCrudTraceId('loadSession');
  crudTrace('loadSession',requestId,'client_start',{forceFresh:forceFresh===true,sessionId:requestedSessionId,sessionLoadSeq:sessionLoadSeq});
  var listEl=document.getElementById('split-list');
  if(listEl&&(!state.containers||state.containers.length===0))listEl.innerHTML=renderSkeleton(4);
  gasRun('syncSessionData', [requestedSessionId, forceFresh===true, requestId], 30000)
    .then(function(res){
      crudTrace('loadSession',requestId,'client_success',{success:!!(res&&res.success)});
      if(sessionLoadSeq!==_sessionLoadSeq||String(state.activeSessionId||'')!==requestedSessionId){
        crudTrace('loadSession',requestId,'skip_stale_response',{requestedSessionId:requestedSessionId,activeSessionId:state.activeSessionId,sessionLoadSeq:sessionLoadSeq,currentSeq:_sessionLoadSeq});
        return;
      }
      _sessionLoadRetry = 0;
      if(!res || !res.success){
        state.activeSessionId=null;state.containers=[];state.viewMode=false;save();
        navigateTo('dashboard');
        Toast.fire({icon:'info',title:'Sesi sudah berakhir', text: res&&res.message||''});
        return;
      }
      var responseSessionId=String((res.data&&res.data.session&&res.data.session.id)||requestedSessionId);
      if(responseSessionId!==requestedSessionId){
        crudTrace('loadSession',requestId,'skip_wrong_session_payload',{requestedSessionId:requestedSessionId,responseSessionId:responseSessionId});
        return;
      }
      state.containers=res.data.containers;
      state._users=res.data.users||[];
      state.sjQtyStatus=res.data.sjQty||null;
      if(res.data.session){state.activeSession={brand:res.data.session.brand,shipment:res.data.session.shipment,date:res.data.session.date,pic:res.data.session.pic,createdBy:res.data.session.createdBy,forwarder:res.data.session.forwarder||'',lossPreventionName:res.data.session.lossPreventionName||'',lossPreventionDate:res.data.session.lossPreventionDate||'',lossPreventionFilledBy:res.data.session.lossPreventionFilledBy||'',lossPreventionSignatureMode:res.data.session.lossPreventionSignatureMode||'',lossPreventionSignatureFileId:res.data.session.lossPreventionSignatureFileId||'',lossPreventionSignatureFileUrl:res.data.session.lossPreventionSignatureFileUrl||'',lossPreventionSignatureSignedAt:res.data.session.lossPreventionSignatureSignedAt||''};}
      var me=(res.data.users||[]).find(function(u){return u.name.toLowerCase()===(state.fullName||state.username).toLowerCase();});
      if(me){state.myStatus=me.status;if(state.viewMode)state.viewMode=false;} else state.myStatus='WORKING';
      save();
      var sess=res.data.session;
      document.getElementById('topbar-title').textContent=sess.brand;
      document.getElementById('topbar-info').textContent=sess.shipment;
      document.getElementById('mobile-title').textContent=sess.brand;
      renderSplitList(res.data);
      if(state.activeContainerId)renderSplitDetail();
      else document.getElementById('split-detail').innerHTML='<div class="empty-state" style="margin-top:60px"><h3>Pilih armada dari daftar</h3>'+(state.viewMode?'':'<p>Atau tambah armada baru</p>')+'</div>';
      crudTraceAfterRender('loadSession',requestId,'ui_render_done');
    })
    .catch(function(err){
      if(sessionLoadSeq!==_sessionLoadSeq||String(state.activeSessionId||'')!==requestedSessionId){
        crudTrace('loadSession',requestId,'skip_stale_failure',{requestedSessionId:requestedSessionId,activeSessionId:state.activeSessionId,sessionLoadSeq:sessionLoadSeq,currentSeq:_sessionLoadSeq});
        return;
      }
      _sessionLoadRetry++;
      var msg = err && err.message ? err.message : String(err);
      if (_sessionLoadRetry <= 2) {
        var delay = _sessionLoadRetry * 2000; // 2s, 4s
        Toast.fire({icon:'warning', title:'Koneksi lambat, mencoba ulang...', timer: delay});
        setTimeout(function(){
          if(sessionLoadSeq===_sessionLoadSeq&&String(state.activeSessionId||'')===requestedSessionId)loadSession(forceFresh===true);
        }, delay);
      } else {
        _sessionLoadRetry = 0;
        Swal.fire({icon:'error',title:'Gagal memuat sesi',
          html:'<p style="font-size:13px;color:#64748b">'+msg+'</p>'
            +'<p style="font-size:11px;color:#94a3b8;margin-top:8px">Periksa koneksi internet Anda.</p>',
          confirmButtonText:'Coba Lagi', showCancelButton:true, cancelButtonText:'Kembali',
          customClass:{popup:'custom-swal',confirmButton:'btn-primary'},buttonsStyling:false
        }).then(function(r){ if(r.isConfirmed)loadSession(true); else navigateTo('dashboard'); });
      }
    });
}

  var img=document.getElementById('lightbox-img');

  if(!img)return;
  img.classList.toggle('zoomed');
  if(wrapper && !img.classList.contains('zoomed')){
    wrapper.scrollTop=0;
    wrapper.scrollLeft=0;
  }
}

  var lightbox=document.getElementById('lightbox');

  if(lightbox)lightbox.classList.remove('show');

function handleEditPaletPhotos(ids){
  if(!ensureCanEditSession('mengedit data palet'))return;
  if(uploadInProgress||deleteInProgress)return;
  var c=state.containers.find(function(x){return x.id===state.activeContainerId;});
  if(!c)return Toast.fire({icon:'warning',title:'Pilih armada dulu'});
  if(!ensureCanChangePhotosInContainer(c,'mengedit data palet'))return;
  var idMap={};(ids||[]).forEach(function(id){idMap[id]=true;});
  var photos=(c.photos||[]).filter(function(p){return normalizePhotoType(p.type)==='palet'&&idMap[p.id];});
  if(!photos.length)return Toast.fire({icon:'info',title:'Pilih foto palet dulu'});

  var items=photos.map(function(p,idx){
    return {
      previewUrl:p.dataUrl,
      label:p.fileName||('Foto palet '+(idx+1)),
      paletName:p.paletName||'',
      paletKoli:p.paletKoli||''
    };
  });

  promptPaletDetails(items,{
    title:photos.length>1?'Edit Data Palet ('+photos.length+' foto)':'Edit Data Palet',
    confirmButtonText:'Simpan Data'
  }).then(function(details){
    if(!details)return;
    var backup=JSON.stringify(c.photos||[]);
    var sjBackup=JSON.stringify(state.sjQtyStatus||null);
    var updates=details.map(function(d,idx){
      return {
        photoId:photos[idx].id,
        paletName:d.paletName,
        paletKoli:d.paletKoli,
        fileName:generatePhotoFileName('palet',idx,d)
      };
    });

    updates.forEach(function(u){
      var p=(c.photos||[]).find(function(x){return x.id===u.photoId;});
      if(p){p.paletName=u.paletName;p.paletKoli=u.paletKoli;p.fileName=u.fileName;}
    });
    markSjQtyStatusRefreshing_('Data Actual berubah. Menunggu validasi server terbaru.');
    markLocalMutation_('edit_palet_local');
    batchSelectMode=false;
    batchSelectedIds=[];
    save();
    renderContainersLocal();

    Swal.fire({title:'Menyimpan data palet...',allowOutsideClick:false,customClass:{popup:'custom-swal'},didOpen:function(){Swal.showLoading();}});
    google.script.run.withSuccessHandler(function(res){
      if(res&&res.success){
        Swal.close();

      }

      save();renderContainersLocal();
      Swal.fire({icon:'error',title:'Error',text:err.toString(),customClass:{popup:'custom-swal'}});
    }).updatePhotoMetaBatch(updates);
  });

function cloudSync(forceFresh){
  if(!state.activeSessionId||deleteInProgress)return;
  if(_syncRunning){
    if(forceFresh===true)_syncQueuedForceFresh=true;
    crudTrace('cloudSync','sync-queued','skip_running',{forceFresh:forceFresh===true});
    return;
  }
  _syncRunning=true;
  var syncSessionId=state.activeSessionId;
  var syncRequestId='sync-'+(++_syncRequestSeq);
  var mutationAtStart=_stateMutationSeq;
  crudTrace('cloudSync',syncRequestId,'client_start',{forceFresh:forceFresh===true,mutationSeq:mutationAtStart});
  function runQueuedSync_(){
    if(_syncQueuedForceFresh){
      _syncQueuedForceFresh=false;
      setTimeout(function(){if(state.activeSessionId)cloudSync(true);},0);
    }
  }
  google.script.run.withSuccessHandler(function(res){
    _syncRunning=false;
    crudTrace('cloudSync',syncRequestId,'client_success',{success:!!(res&&res.success),forceFresh:forceFresh===true});
    if(state.activeSessionId!==syncSessionId){runQueuedSync_();return;}
    if(!res||!res.success){syncFailCount++;handleSyncFailure();runQueuedSync_();return;}
    var responseSessionId=String((res.data&&res.data.session&&res.data.session.id)||syncSessionId);
    if(responseSessionId!==syncSessionId){
      crudTrace('cloudSync',syncRequestId,'skip_wrong_session_payload',{syncSessionId:syncSessionId,responseSessionId:responseSessionId});
      runQueuedSync_();
      return;
    }
    syncFailCount=0;syncConsecutiveFails=0;
    if(mutationAtStart!==_stateMutationSeq){
      crudTrace('cloudSync',syncRequestId,'skip_stale_response',{startedAt:mutationAtStart,current:_stateMutationSeq});
      if(forceFresh===true)_syncQueuedForceFresh=true;
      runQueuedSync_();
      return;
    }
    var newHash=buildSyncHash(res.data.containers,res.data.sjQty,res.data.users,res.data.session);
    if(forceFresh!==true&&newHash===lastSyncHash){runQueuedSync_();return;}
    lastSyncHash=newHash;state.containers=res.data.containers;state._users=res.data.users||[];state.sjQtyStatus=res.data.sjQty||null;
    if(res.data.session){state.activeSession={brand:res.data.session.brand,shipment:res.data.session.shipment,date:res.data.session.date,pic:res.data.session.pic,createdBy:res.data.session.createdBy,forwarder:res.data.session.forwarder||'',lossPreventionName:res.data.session.lossPreventionName||'',lossPreventionDate:res.data.session.lossPreventionDate||'',lossPreventionFilledBy:res.data.session.lossPreventionFilledBy||'',lossPreventionSignatureMode:res.data.session.lossPreventionSignatureMode||'',lossPreventionSignatureFileId:res.data.session.lossPreventionSignatureFileId||'',lossPreventionSignatureFileUrl:res.data.session.lossPreventionSignatureFileUrl||'',lossPreventionSignatureSignedAt:res.data.session.lossPreventionSignatureSignedAt||''};}
    var me=(res.data.users||[]).find(function(u){return u.name.toLowerCase()===(state.fullName||state.username).toLowerCase();});if(me)state.myStatus=me.status;
    save();
    if(document.getElementById('page-session').classList.contains('active')){renderSplitList(res.data);if(state.activeContainerId)renderSplitDetail();}
    crudTraceAfterRender('cloudSync',syncRequestId,'ui_render_done',{forceFresh:forceFresh===true});
    runQueuedSync_();
  }).withFailureHandler(function(){
    _syncRunning=false;
    crudTrace('cloudSync',syncRequestId,'client_failure');
    if(state.activeSessionId!==syncSessionId){runQueuedSync_();return;}
    syncFailCount++;handleSyncFailure();runQueuedSync_();
  }).syncSessionData(syncSessionId,forceFresh===true,syncRequestId);
}

function compressImgToBlob(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function(e) {
      var img = new Image();
      img.onerror = function() { reject(new Error('Gagal baca gambar')); };
      img.onload = function() {
        var MAX = CLIENT_CONFIG.MAX_IMAGE_PX, w = img.width, h = img.height;
        if (w > h) { if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; } }
        else { if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; } }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(function(blob) {
          blob ? resolve(blob) : reject(new Error('Compress gagal'));
        }, 'image/jpeg', CLIENT_CONFIG.JPEG_QUALITY);
      };
      img.src = e.target.result;
    };
    reader.onerror = function() { reject(new Error('Gagal baca file')); };
    reader.readAsDataURL(file);
  });
}

function getUploadCredentials(meta) {
  return new Promise(function(resolve, reject) {
    google.script.run
      .withSuccessHandler(function(res) {
        res.success ? resolve(res.data) : reject(new Error(res.message));
      })
      .withFailureHandler(reject)
      .requestUploadCredentials(meta);
  });
}

function directUploadToDrive(blob, fileName, folderId, token, retryMeta, opts) {
  if (token === 'MOCK_TOKEN') {
    return new Promise(function(resolve) {
      setTimeout(function() { resolve('MOCK_ID_' + Date.now()); }, 300);
    });
  }
  function attempt(tkn) {
    var form = new FormData();
    form.append('metadata', new Blob([JSON.stringify({
      name: fileName, parents: [folderId]
    })], { type: 'application/json' }));
    form.append('file', blob);
    var fetchOptions = {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + tkn },
      body: form
    };
    if (opts && opts.signal) fetchOptions.signal = opts.signal;
    return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id&supportsAllDrives=true', fetchOptions);
  }
  return attempt(token).then(function(res) {
    if (res.status === 401 && retryMeta) {
      return getUploadCredentials(retryMeta).then(function(nc) {
        return attempt(nc.token);
      });
    }
    return res;
  }).then(function(res) {
    if (!res.ok) {
      return res.text().then(function(body) {
        var err = new Error('Upload gagal (' + res.status + ')');
        err.status = res.status;
        err.body = body;
        throw err;
      });
    }
    return res.json().then(function(json) { return json.id; });
  });
}

function blobToBase64(blob) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onloadend = function() {
      var result = reader.result || '';
      var comma = result.indexOf(',');
      resolve(comma >= 0 ? result.slice(comma + 1) : result);
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function deprecatedFallbackUploadViaGAS_(meta, containerId, uploadType, blobs, paletDetails, tracker) {
  // Chunked fallback — kirim per 5 foto, bukan sekaligus
  var CHUNK_SIZE = 5;
  return new Promise(async function(resolve, reject) {
    var allResults = [], allFailed = [];
    try {
      for (var i = 0; i < blobs.length; i += CHUNK_SIZE) {
        var chunk = blobs.slice(i, i + CHUNK_SIZE);
        var items = await Promise.all(
          chunk.map(function(entry, idx) {
            var isWrapped = entry && typeof entry === 'object' && Object.prototype.hasOwnProperty.call(entry, 'blob');
            var sourceIndex = isWrapped ? entry.sourceIndex : (i + idx);
            var blob = isWrapped ? entry.blob : entry;
            var paletInfo = paletDetails ? paletDetails[sourceIndex] : null;
            return blobToBase64(blob).then(function(b64) {
              var item = { containerId: containerId, type: uploadType, base64Data: b64, fileName: generatePhotoFileName(uploadType, sourceIndex, paletInfo) };
              if (paletInfo) {
                item.paletName = paletInfo.paletName;
                item.paletKoli = paletInfo.paletKoli;
              }
              return item;
            });
          })
        );
        var res = await new Promise(function(res2, rej2) {
          google.script.run
            .withSuccessHandler(function(r) { r && r.success ? res2(r) : rej2(new Error(r ? r.message : 'Fallback gagal')); })
            .withFailureHandler(rej2)
            .uploadPhotoBatch({ meta: meta, items: items });
        });
        if (res.data) allResults = allResults.concat(res.data);
        if (res.failed) allFailed = allFailed.concat(res.failed);
        // Update tracker
        var t = tracker || deprecatedUploadTracker_;
        t.uploaded += (res.data ? res.data.length : 0);
        t.failed += (res.failed ? res.failed.length : 0);
        deprecatedRenderUploadTracker_();
      }
      resolve({
        success: true, data: allResults,
        totalUploaded: allResults.length,
        totalFailed: allFailed.length,
        failed: allFailed
      });
    } catch(e) {
      reject(e);
    }
  });
}

function generatePhotoFileName(tab, globalIndex, paletMeta) {
  if (tab === 'palet' && paletMeta && paletMeta.paletName) {
    return 'Palet ' + safeFileSegment(paletMeta.paletName) + ' - ' + cleanPaletKoli(paletMeta.paletKoli) + ' Koli.jpg';
  }
  var subName = CLIENT_CONFIG.DOC_SUBFOLDER;
  if (tab === 'palet') subName = CLIENT_CONFIG.PALET_SUBFOLDER;
  else if (tab === 'suratjalan') subName = CLIENT_CONFIG.SURAT_SUBFOLDER;
  var now = new Date();
  var dateStr = now.getFullYear()
    + ('0' + (now.getMonth() + 1)).slice(-2)
    + ('0' + now.getDate()).slice(-2) + '_'
    + ('0' + now.getHours()).slice(-2)
    + ('0' + now.getMinutes()).slice(-2)
    + ('0' + now.getSeconds()).slice(-2);
  return subName + '_' + dateStr + '_' + (globalIndex + 1) + '.jpg';
}

// =========================================================================
// handleMultiUpload — Pipeline: compress + upload jalan bersamaan
// =========================================================================
async function deprecatedHandleMultiUpload_(input) {
  var uploadTabType = state.activeTab; // FIX: Bekukan tipe tab saat tombol ditekan
  var files = Array.from(input.files);
  if (!files.length) return;
  if(!ensureCanEditSession('upload foto')){input.value='';return;}
  var c = state.containers.find(function(x) { return x.id === state.activeContainerId; });
  if (!c) { Toast.fire({ icon: 'warning', title: 'Pilih armada dulu' }); input.value = ''; return; }
  if(!ensureCanUploadToContainer(c,'upload foto')){input.value='';return;}
  
  var paletDetails = null;
  if (uploadTabType === 'palet') {
    paletDetails = await promptPaletUploadDetails(files);
    if (!paletDetails) { input.value = ''; return; }
  }
  
  uploadInProgress = true;

  var sess = state.activeSession || {};
  var meta = {
    sessionId: state.activeSessionId, brand: sess.brand || '',
    shipment: sess.shipment || '', date: sess.date || '', pic: sess.pic || '',
    fleetNo: c.number, uploadedBy: state.username,
    containerId: c.id,
    uploadType: uploadTabType, // Pakai variabel beku
    driver: c.driver || '', plate: c.plate || '', type: c.type || ''
  };

  // Init tracker
  deprecatedUploadTracker_ = {
    total: files.length, compressed: 0, uploaded: 0, logged: 0, failed: 0,
    failedItems: [], active: true
  };
  deprecatedRenderUploadTracker_();

  // === PHASE 1: Get credentials (minta akses folder dulu) ===
  var credentials = null, useFallback = false;
  try {
    credentials = await getUploadCredentials(meta);
  } catch(e) {
    useFallback = true;
  }

  if (!useFallback) {
    var folderId = credentials.folderIds[uploadTabType];
    var successItems = [];
    var directFailed = false;
    var COMPRESS_C = CLIENT_CONFIG.COMPRESS_CONCURRENCY || 3;
    var UPLOAD_C = CLIENT_CONFIG.UPLOAD_CONCURRENCY || 3;
    var LOG_BATCH_SIZE = 20;

    // === PIPELINE: compress → queue → upload → log ===
    var uploadQueue = [];         // blob siap upload
    var compressDoneFlag = false;
    var pendingLog = [];          // items menunggu log ke database

    // --- Compress workers ---
    var compressCursor = 0;
    async function compressWorker() {
      while (compressCursor < files.length) {
        var idx = compressCursor++;
        try {
          var blob = await compressImgToBlob(files[idx]);
          uploadQueue.push({ blob: blob, index: idx });
        } catch(e) {
          uploadQueue.push({ blob: null, index: idx, error: e.message || 'Compress gagal' });
        }
        deprecatedUploadTracker_.compressed++;
        deprecatedRenderUploadTracker_();
      }
    }

    // --- Upload workers: ambil dari queue begitu ada ---
    var _uploadCount = 0;
    var _tokenRefreshPromise = null;
    async function refreshTokenIfNeeded() {
      _uploadCount++;
      // Refresh token setiap 40 foto untuk cegah expire
      if (_uploadCount % 40 === 0) {
        if (!_tokenRefreshPromise) {
          _tokenRefreshPromise = getUploadCredentials(meta).then(function(nc) {
            credentials = nc;
            _tokenRefreshPromise = null;
          }).catch(function() { _tokenRefreshPromise = null; });
        }
        await _tokenRefreshPromise;
      }
    }

    async function uploadWorker() {
      while (true) {
        if (directFailed) break;
        if (uploadQueue.length > 0) {
          var item = uploadQueue.shift();
          if (!item.blob) {
            deprecatedUploadTracker_.failed++;
            deprecatedUploadTracker_.uploaded++;
            deprecatedRenderUploadTracker_();
            continue;
          }
          var fileName = generatePhotoFileName(uploadTabType, item.index, paletDetails ? paletDetails[item.index] : null);
          var metaWithPalet = JSON.parse(JSON.stringify(meta));
          if (paletDetails) {
            metaWithPalet.paletName = paletDetails[item.index].paletName;
            metaWithPalet.paletKoli = paletDetails[item.index].paletKoli;
          }
          try {
            await refreshTokenIfNeeded();
            var fileId = await directUploadToDrive(
              item.blob, fileName, folderId, credentials.token, metaWithPalet
            );
            // V7: validasi fileId — jangan log row dengan ID kosong ke sheet
            if (!fileId || typeof fileId !== 'string' || !fileId.trim()) {
              throw new Error('Drive API return fileId kosong');
            }
            fileId = fileId.trim();
            var logItem = { fileId: fileId, containerId: c.id, type: uploadTabType, fileName: fileName };
            if (paletDetails && paletDetails[item.index]) {
              logItem.paletName = paletDetails[item.index].paletName;
              logItem.paletKoli = paletDetails[item.index].paletKoli;
            }
            successItems.push(logItem);
            pendingLog.push(logItem);

            // Batch log setiap LOG_BATCH_SIZE foto
            if (pendingLog.length >= LOG_BATCH_SIZE) {
              var logChunk = pendingLog.splice(0, LOG_BATCH_SIZE);
              (function(lc) {
                google.script.run
                  .withSuccessHandler(function(){})
                  .withFailureHandler(function(){})
                  .logDirectUploads({ meta: meta, items: lc });
              })(logChunk);
            }
          } catch(e) {
            var errMsg = e.message || 'Upload gagal';
            if (errMsg.indexOf('403') >= 0) directFailed = true;
            // Langsung masuk retry queue — jangan block worker
            var retryMeta = JSON.parse(JSON.stringify(metaWithPalet));
            retryMeta.containerId = c.id;
            deprecatedAddToRetryQueue_(item.blob, retryMeta, fileName, item.index, errMsg);
          }
          deprecatedUploadTracker_.uploaded++;
          deprecatedRenderUploadTracker_();
        } else if (compressDoneFlag && uploadQueue.length === 0) {
          break;
        } else {
          await new Promise(function(r) { setTimeout(r, 20); });
        }
      }
    }

    // Start pipeline
    var cWorkers = [];
    for (var ci = 0; ci < Math.min(COMPRESS_C, files.length); ci++) cWorkers.push(compressWorker());
    var uWorkers = [];
    for (var ui = 0; ui < UPLOAD_C; ui++) uWorkers.push(uploadWorker());

    await Promise.all(cWorkers);
    compressDoneFlag = true;
    await Promise.all(uWorkers);

    // Flush sisa pending log
    var logFlushFailed = false;
    var logFlushPendingCount = pendingLog.length;
    if (pendingLog.length > 0) {
      await new Promise(function(resolve) {
        google.script.run
          .withSuccessHandler(function() { pendingLog = []; resolve(); })
          .withFailureHandler(function() { logFlushFailed = true; resolve(); })
          .logDirectUploads({ meta: meta, items: pendingLog });
      });
    }

    // Fallback check
    if (directFailed && successItems.length === 0) {
      useFallback = true;
    } else {
      uploadInProgress = false;
      deprecatedUploadTracker_.active = false;
      lastSyncHash = ''; cloudSync(true);
      input.value = '';
      deprecatedRenderUploadTracker_(true); // force final render

      if ((typeof isUploadOfflineNow === 'function' && isUploadOfflineNow()) || logFlushFailed) {
        deprecatedRenderUploadTracker_();
        if (deprecatedUploadRetryQueue_.length > 0 && !(typeof isUploadOfflineNow === 'function' && isUploadOfflineNow())) {
          setTimeout(function() {
            if (deprecatedUploadRetryQueue_.length > 0 && !deprecatedUploadTracker_.active) deprecatedRetryFailedUploads_(true);
          }, 2000);
        }
        Swal.fire({
          icon: 'warning',
          title: (typeof isUploadOfflineNow === 'function' && isUploadOfflineNow()) ? 'Upload dijeda' : 'Data belum tersimpan',
          html: '<div style="text-align:left">'
            + '<p style="font-size:13px;color:#64748b;margin-bottom:12px">Koneksi/sinkronisasi belum stabil, jadi upload belum ditandai selesai.</p>'
            + '<div style="display:flex;gap:8px;margin-bottom:12px">'
            + '<div style="flex:1;background:#f0fdf4;border-radius:8px;padding:10px;text-align:center">'
            + '<div style="font-size:20px;font-weight:700;color:#15803d">' + successItems.length + '</div>'
            + '<div style="font-size:11px;color:#22c55e">Masuk Drive</div></div>'
            + '<div style="flex:1;background:#fffbeb;border-radius:8px;padding:10px;text-align:center">'
            + '<div style="font-size:20px;font-weight:700;color:#92400e">' + (deprecatedUploadRetryQueue_.length + (logFlushFailed ? logFlushPendingCount : 0)) + '</div>'
            + '<div style="font-size:11px;color:#f59e0b">Menunggu</div></div></div>'
            + '<p style="font-size:12px;color:#64748b;margin:0">Tunggu koneksi kembali lalu cek tracker upload sampai bersih.</p></div>',
          confirmButtonText: 'OK',
          customClass: { popup: 'custom-swal', confirmButton: 'btn-primary' },
          buttonsStyling: false
        });
        return;
      }

      // Auto retry foto gagal di background
      if (deprecatedUploadRetryQueue_.length > 0) {
        deprecatedRenderUploadTracker_();
        Swal.fire({
          icon: 'warning',
          title: 'Sebagian foto belum terkirim',
          html: '<div style="text-align:left">'
            + '<div style="display:flex;gap:8px;margin-bottom:12px">'
            + '<div style="flex:1;background:#f0fdf4;border-radius:8px;padding:10px;text-align:center">'
            + '<div style="font-size:20px;font-weight:700;color:#15803d">' + successItems.length + '</div>'
            + '<div style="font-size:11px;color:#22c55e">Berhasil</div></div>'
            + '<div style="flex:1;background:#fef2f2;border-radius:8px;padding:10px;text-align:center">'
            + '<div style="font-size:20px;font-weight:700;color:#dc2626">' + deprecatedUploadRetryQueue_.length + '</div>'
            + '<div style="font-size:11px;color:#ef4444">Gagal</div></div></div>'
            + '<p style="font-size:12px;color:#64748b;margin:0">Foto gagal akan dicoba ulang otomatis dalam 2 detik.</p></div>',
          confirmButtonText: 'OK',
          customClass: { popup: 'custom-swal', confirmButton: 'btn-primary' },
          buttonsStyling: false
        });
        // Auto retry dengan backoff (retry-until-success)
        setTimeout(function() {
          if (deprecatedUploadRetryQueue_.length > 0 && !deprecatedUploadTracker_.active) {
            deprecatedRetryFailedUploads_(true); // true = auto mode
          }
        }, 2000);
      } else {
        deprecatedRenderUploadTracker_();
        Swal.fire({
          icon: 'success',
          title: 'Upload Selesai!',
          html: '<div style="text-align:center">'
            + '<div style="font-size:36px;font-weight:700;color:#15803d;margin:4px 0">' + successItems.length + '</div>'
            + '<div style="font-size:13px;color:#64748b">foto berhasil diupload</div></div>',
          confirmButtonText: 'OK',
          customClass: { popup: 'custom-swal', confirmButton: 'btn-primary' },
          buttonsStyling: false
        });
      }
      return;
    }
  }

  // === FALLBACK VIA GAS (chunked) ===
  if (useFallback) {
    deprecatedUploadTracker_.compressed = files.length; // skip compress tracking
    deprecatedRenderUploadTracker_();

    // Compress semua dulu (paralel)
    var compBlobs = [];
    var COMPRESS_C_FB = CLIENT_CONFIG.COMPRESS_CONCURRENCY || 3;
    var fbCursor = 0;
    async function fbCompressWorker() {
      while (fbCursor < files.length) {
        var idx = fbCursor++;
        try { compBlobs[idx] = await compressImgToBlob(files[idx]); }
        catch(e) { compBlobs[idx] = null; }
        deprecatedUploadTracker_.compressed++;
        deprecatedRenderUploadTracker_();
      }
    }
    var fbCW = [];
    for (var fi = 0; fi < Math.min(COMPRESS_C_FB, files.length); fi++) fbCW.push(fbCompressWorker());
    await Promise.all(fbCW);

    var validBlobs = compBlobs.map(function(blob, idx) {
      return blob ? { blob: blob, sourceIndex: idx } : null;
    }).filter(function(entry) { return entry !== null; });
    if (!validBlobs.length) {
      uploadInProgress = false;
      deprecatedUploadTracker_.active = false;
      deprecatedRenderUploadTracker_();
      input.value = '';
      Swal.fire({ icon: 'error', title: 'Gagal',
        text: 'Tidak ada foto yang berhasil dikompres.',
        customClass: { popup: 'custom-swal' } });
      return;
    }

    try {
      var fbRes = await deprecatedFallbackUploadViaGAS_(meta, c.id, uploadTabType, validBlobs, paletDetails, deprecatedUploadTracker_);
      uploadInProgress = false;
      deprecatedUploadTracker_.active = false;
      lastSyncHash = ''; cloudSync(true);
      input.value = '';
      deprecatedRenderUploadTracker_();
      if (typeof isUploadOfflineNow === 'function' && isUploadOfflineNow()) {
        Swal.fire({
          icon: 'warning', title: 'Upload belum bisa diverifikasi',
          html: '<div style="text-align:left">'
            + '<p style="font-size:13px;color:#64748b;margin-bottom:12px">Koneksi sedang offline, jadi aplikasi belum menampilkan status selesai.</p>'
            + '<div style="display:flex;gap:8px;margin-bottom:8px">'
            + '<div style="flex:1;background:#f0fdf4;border-radius:8px;padding:10px;text-align:center">'
            + '<div style="font-size:20px;font-weight:700;color:#15803d">' + fbRes.totalUploaded + '</div><div style="font-size:11px;color:#22c55e">Dikirim</div></div>'
            + '<div style="flex:1;background:#fef2f2;border-radius:8px;padding:10px;text-align:center">'
            + '<div style="font-size:20px;font-weight:700;color:#dc2626">' + fbRes.totalFailed + '</div><div style="font-size:11px;color:#ef4444">Gagal</div></div></div></div>',
          confirmButtonText: 'OK',
          customClass: { popup: 'custom-swal', confirmButton: 'btn-primary' },
          buttonsStyling: false
        });
      } else if (fbRes.totalFailed > 0 && fbRes.totalUploaded > 0) {
        Swal.fire({
          icon: 'warning', title: 'Sebagian foto belum terkirim (via Server)',
          html: '<div style="display:flex;gap:8px;margin-bottom:8px">'
            + '<div style="flex:1;background:#f0fdf4;border-radius:8px;padding:10px;text-align:center">'
            + '<div style="font-size:20px;font-weight:700;color:#15803d">' + fbRes.totalUploaded + '</div>'
            + '<div style="font-size:11px;color:#22c55e">Berhasil</div></div>'
            + '<div style="flex:1;background:#fef2f2;border-radius:8px;padding:10px;text-align:center">'
            + '<div style="font-size:20px;font-weight:700;color:#dc2626">' + fbRes.totalFailed + '</div>'
            + '<div style="font-size:11px;color:#ef4444">Gagal</div></div></div>',
          confirmButtonText: 'OK',
          customClass: { popup: 'custom-swal', confirmButton: 'btn-primary' },
          buttonsStyling: false
        });
      } else if (fbRes.totalUploaded === 0) {
        Swal.fire({ icon: 'error', title: 'Gagal total',
          text: 'Upload via server juga gagal.',
          customClass: { popup: 'custom-swal' } });
      } else {
        Swal.fire({
          icon: 'success', title: 'Upload Selesai!',
          html: '<div style="text-align:center">'
            + '<div style="font-size:36px;font-weight:700;color:#15803d;margin:4px 0">' + fbRes.totalUploaded + '</div>'
            + '<div style="font-size:13px;color:#64748b">foto berhasil diupload (via server)</div></div>',
          confirmButtonText: 'OK',
          customClass: { popup: 'custom-swal', confirmButton: 'btn-primary' },
          buttonsStyling: false
        });
      }
    } catch(fbErr) {
      uploadInProgress = false;
      deprecatedUploadTracker_.active = false;
      deprecatedRenderUploadTracker_();
      input.value = '';
      Swal.fire({ icon: 'error', title: 'Fallback gagal',
        text: fbErr.message, customClass: { popup: 'custom-swal' } });
    }
  }
}

// condition antara syncSessionData dan addContainer yang bikin TEMP row hilang.
function renderContainersLocal(){
  if(!state.activeSession)return;
  var page=document.getElementById('page-session');
  if(!page||!page.classList.contains('active'))return;
  renderSplitList({session:state.activeSession,users:state._users||[],sjQty:state.sjQtyStatus||null});
  if(state.activeContainerId)renderSplitDetail(true);
  else document.getElementById('split-detail').innerHTML='<div class="empty-state" style="margin-top:60px"><h3>Pilih armada dari daftar</h3></div>';
}
function markSjQtyStatusRefreshing_(message){
  if(!state.sjQtyStatus)return;
  state.sjQtyStatus.status='CHECKING';
  state.sjQtyStatus.statusText='Memperbarui validasi';
  state.sjQtyStatus.subText=message||'Menunggu data terbaru dari server';
  state.sjQtyStatus.reasonCode='ACTUAL_CHANGED_PENDING_VALIDATION';
  state.sjQtyStatus.canHandover=false;
  state.sjQtyStatus.validationFinal=false;
}
function removePhotosFromLocal_(photoIds){
  var idMap={};(photoIds||[]).forEach(function(id){idMap[String(id||'').trim()]=true;});
  var changed=false, touchedPalet=false;
  state.containers.forEach(function(c){
    if(!c.photos||!c.photos.length)return;
    var kept=[];
    c.photos.forEach(function(p){
      if(idMap[String((p&&p.id)||'').trim()]){
        changed=true;
        if(normalizePhotoType(p&&p.type)==='palet')touchedPalet=true;
      }else kept.push(p);
    });
    c.photos=kept;
  });
  return {changed:changed,touchedPalet:touchedPalet};
}
function movePhotosLocal_(photoIds,toContainerId){
  var idMap={};(photoIds||[]).forEach(function(id){idMap[String(id||'').trim()]=true;});
  var target=state.containers.find(function(c){return c.id===toContainerId;});
  if(!target)return {changed:false,touchedPalet:false};
  var moved=[], touchedPalet=false;
  state.containers.forEach(function(c){
    if(!c.photos||!c.photos.length)return;
    var kept=[];
    c.photos.forEach(function(p){
      if(idMap[String((p&&p.id)||'').trim()]){
        moved.push(p);
        if(normalizePhotoType(p&&p.type)==='palet')touchedPalet=true;
      }else kept.push(p);
    });
    c.photos=kept;
  });
  if(moved.length){
    target.photos=target.photos||[];
    moved.forEach(function(p){target.photos.push(p);});
  }
  return {changed:moved.length>0,touchedPalet:touchedPalet};
}
function renderLocalPhotoMutation_(result){
  if(!result||!result.changed)return;
  if(result.touchedPalet)markSjQtyStatusRefreshing_('Data Actual berubah. Menunggu validasi server terbaru.');
  markLocalMutation_('photo_mutation');
  save();
  renderContainersLocal();
}
function showAddContainer(){
  if(!ensureCanEditSession('menambah armada'))return;

function applyLossPreventionState_(sessionId, data){
  var lpName=String(data&&data.lossPreventionName||'').trim();
  var lpDate=String(data&&(data.lossPreventionDate||data.lossPreventionFilledAt)||'').trim();
  var lpBy=String(data&&data.lossPreventionFilledBy||'').trim();
  var lpSignatureMode=String(data&&data.lossPreventionSignatureMode||'').trim();
  var lpSignatureFileId=String(data&&data.lossPreventionSignatureFileId||'').trim();
  var lpSignatureFileUrl=String(data&&data.lossPreventionSignatureFileUrl||'').trim();
  var lpSignatureSignedAt=String(data&&data.lossPreventionSignatureSignedAt||'').trim();
  if(state.activeSessionId===sessionId&&state.activeSession){
    state.activeSession.lossPreventionName=lpName;
    state.activeSession.lossPreventionDate=lpDate;
    state.activeSession.lossPreventionFilledBy=lpBy;
    state.activeSession.lossPreventionSignatureMode=lpSignatureMode;
    state.activeSession.lossPreventionSignatureFileId=lpSignatureFileId;
    state.activeSession.lossPreventionSignatureFileUrl=lpSignatureFileUrl;
    state.activeSession.lossPreventionSignatureSignedAt=lpSignatureSignedAt;
    save();
  }
  if(typeof _historyDataCache!=='undefined'&&_historyDataCache[sessionId]){
    _historyDataCache[sessionId].lossPreventionName=lpName;
    _historyDataCache[sessionId].lossPreventionDate=lpDate;
    _historyDataCache[sessionId].lossPreventionFilledBy=lpBy;
    _historyDataCache[sessionId].lossPreventionSignatureMode=lpSignatureMode;
    _historyDataCache[sessionId].lossPreventionSignatureFileId=lpSignatureFileId;
    _historyDataCache[sessionId].lossPreventionSignatureFileUrl=lpSignatureFileUrl;
    _historyDataCache[sessionId].lossPreventionSignatureSignedAt=lpSignatureSignedAt;
  }
}
