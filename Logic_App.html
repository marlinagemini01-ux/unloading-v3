  function setupLpSignaturePad_(){
    var canvas=document.getElementById('lp-signature-pad');
    if(!canvas||canvas.dataset.ready==='1')return;
    signatureCanvas=canvas;
    canvas.dataset.ready='1';
    var ratio=Math.max(window.devicePixelRatio||1,1);
    function resizeCanvas(){
      var rect=canvas.getBoundingClientRect();
      var width=Math.max(280,Math.round(rect.width||320));
      var height=180;
      canvas.width=Math.round(width*ratio);
      canvas.height=Math.round(height*ratio);
      canvas.style.height=height+'px';
      signatureCtx=canvas.getContext('2d');
      signatureCtx.setTransform(ratio,0,0,ratio,0,0);
      signatureCtx.clearRect(0,0,width,height);
      signatureCtx.lineWidth=3;
      signatureCtx.lineCap='round';
      signatureCtx.lineJoin='round';
      signatureCtx.strokeStyle='#0f172a';
      signatureHasInk=false;
    }
    function pointFromEvent(e){
      var rect=canvas.getBoundingClientRect();
      return {x:e.clientX-rect.left,y:e.clientY-rect.top};
    }
    var drawing=false;
    canvas.addEventListener('pointerdown',function(e){
      e.preventDefault();
      if(!signatureCtx)resizeCanvas();
      drawing=true;
      signatureHasInk=true;
      canvas.setPointerCapture(e.pointerId);
      var p=pointFromEvent(e);
      signatureCtx.beginPath();
      signatureCtx.moveTo(p.x,p.y);
    });
    canvas.addEventListener('pointermove',function(e){
      if(!drawing||!signatureCtx)return;
      e.preventDefault();
      var p=pointFromEvent(e);
      signatureCtx.lineTo(p.x,p.y);
      signatureCtx.stroke();
    });
    ['pointerup','pointercancel','pointerleave'].forEach(function(evt){
      canvas.addEventListener(evt,function(e){
        if(!drawing)return;
        drawing=false;
        try{canvas.releasePointerCapture(e.pointerId);}catch(err){}
      });
    });
    var clearBtn=document.getElementById('lp-signature-clear');
    if(clearBtn){
      clearBtn.addEventListener('click',function(){
        if(!signatureCtx)resizeCanvas();
        signatureCtx.clearRect(0,0,canvas.width/ratio,canvas.height/ratio);
        signatureHasInk=false;
      });
    }
    resizeCanvas();
  }
  Swal.fire({
    title:'Data Loss Prevention',
    html:'<div class="lp-signature-form">'
      +'<label class="lp-field"><span>Nama LP</span><input id="lp-name" class="fi" type="text" value="'+escapeHtml(currentName)+'" placeholder="Contoh: Budi Santoso"></label>'
      +'<div class="lp-mode-row" role="radiogroup" aria-label="Metode tanda tangan">'
      +'<label class="lp-mode-option"><input type="radio" name="lp-signature-mode" value="MANUAL"'+(preferDigital?'':' checked')+'><span>Manual</span></label>'
      +'<label class="lp-mode-option"><input type="radio" name="lp-signature-mode" value="DIGITAL"'+(preferDigital?' checked':'')+'><span>Digital</span></label>'
      +'</div>'
      +'<div id="lp-signature-panel" class="lp-signature-panel" style="display:none">'
      +'<div class="lp-signature-caption">Gambar tanda tangan LP di kotak ini.</div>'
      +'<canvas id="lp-signature-pad" class="lp-signature-pad"></canvas>'
      +'<button type="button" id="lp-signature-clear" class="lp-signature-clear">Hapus tanda tangan</button>'
      +'</div>'
      +'<p class="lp-signature-note">Default manual: PDF menyiapkan area kosong. Digital: tanda tangan LP disimpan sebagai file PNG di folder Handover.</p>'
      +'</div>',
    showCancelButton:true,
    confirmButtonText:'Simpan & lanjut',
    cancelButtonText:'Batal',
    customClass:{popup:'custom-swal',confirmButton:'btn-primary',cancelButton:'btn-primary'},
    buttonsStyling:false,
    didOpen:function(){
      var panel=document.getElementById('lp-signature-panel');
      function updateMode(){
        var modeEl=document.querySelector('input[name="lp-signature-mode"]:checked');
        var isDigital=modeEl&&modeEl.value==='DIGITAL';
        if(panel)panel.style.display=isDigital?'grid':'none';
        if(isDigital)setTimeout(setupLpSignaturePad_,50);
      }
      document.querySelectorAll('input[name="lp-signature-mode"]').forEach(function(input){
        input.addEventListener('change',updateMode);
      });
      updateMode();
      var nameInput=document.getElementById('lp-name');
      if(nameInput)nameInput.focus();
    },
    preConfirm:function(){
      var nameInput=document.getElementById('lp-name');
      var finalName=toTitleCaseText(nameInput&&nameInput.value||'');
      if(!finalName||finalName.length<2){
        Swal.showValidationMessage('Nama Loss Prevention wajib diisi.');
        return false;
      }
      var modeEl=document.querySelector('input[name="lp-signature-mode"]:checked');
      var mode=modeEl?modeEl.value:'MANUAL';
      var signatureDataUrl='';
      if(mode==='DIGITAL'){
        if(!signatureHasInk||!signatureCanvas){
          Swal.showValidationMessage('Tanda tangan digital LP wajib digambar.');
          return false;
        }
        signatureDataUrl=signatureCanvas.toDataURL('image/png');
      }
      return {name:finalName,signatureMode:mode,signatureDataUrl:signatureDataUrl};
    }
  }).then(function(r){
    if(!r.isConfirmed)return;
    Swal.fire({title:r.value.signatureMode==='DIGITAL'?'Menyimpan tanda tangan LP...':'Menyimpan data LP...',allowOutsideClick:false,customClass:{popup:'custom-swal'},didOpen:function(){Swal.showLoading();}});
    google.script.run
      .withSuccessHandler(function(res){
        Swal.close();
        if(res&&res.success){
          if(r.value.signatureMode==='DIGITAL'&&!(res.data&&res.data.lossPreventionSignatureFileId)){
            Swal.fire({icon:'error',title:'Tanda tangan belum tersimpan',text:'File tanda tangan LP belum berhasil dibuat di Drive. Silakan coba simpan ulang sebelum finish.',customClass:{popup:'custom-swal'}});
            return;
          }
          applyLossPreventionState_(sessionId,res.data||{});
          if(onReady)onReady(res.data||{},r.value);
        }else{
          Swal.fire({icon:'error',title:'Gagal',text:res?res.message:'Nama Loss Prevention gagal disimpan.',customClass:{popup:'custom-swal'}});
        }
      })
      .withFailureHandler(function(err){
        Swal.close();
        Swal.fire({icon:'error',title:'Error',text:err.toString(),customClass:{popup:'custom-swal'}});
      })
      .setLossPreventionInfo(sessionId,r.value.name,state.fullName||state.username,r.value.signatureMode,r.value.signatureDataUrl);

}

function ensureLossPreventionInfo(sessionId, onReady){

  }
  Swal.fire({title:'Memeriksa data LP...',allowOutsideClick:false,customClass:{popup:'custom-swal'},didOpen:function(){Swal.showLoading();}});
  google.script.run
    .withSuccessHandler(function(res){
      Swal.close();
      if(!res||!res.success){
        return Swal.fire({icon:'error',title:'Gagal',text:res?res.message:'Gagal membaca data Loss Prevention.',customClass:{popup:'custom-swal'}});
      }
      applyLossPreventionState_(sessionId,res.data||{});
      var lpName=String(res.data&&res.data.lossPreventionName||'').trim();
      var sigMode=String(res.data&&res.data.lossPreventionSignatureMode||'').toUpperCase();
      var sigFileId=String(res.data&&res.data.lossPreventionSignatureFileId||'').trim();

    })

      Swal.close();
      Swal.fire({icon:'error',title:'Error',text:err.toString(),customClass:{popup:'custom-swal'}});
    })

function handleFinish(){
  var finishRequestId=createCrudTraceId('finishSession');
  crudTrace('finishSession',finishRequestId,'client_click');
  function containerList(items){
    return (items||[]).map(function(c){
      var missing=(c&&c.missingTypes&&c.missingTypes.length)?' <span style="color:#b45309">['+c.missingTypes.join(', ')+']</span>':'';
      return '<div>#'+escapeHtml(c.number||'?')+' - '+escapeHtml(c.driver||'-')+' ('+escapeHtml(c.plate||'-')+')'+missing+'</div>';
    }).join('');
  }
  var unfinishedFleetWork=state.containers.filter(function(c){return !isFleetWorkDone(c);});
  if(unfinishedFleetWork.length>0){
    return Swal.fire({
      title:'Armada Belum Finish',
      html:'<p>Semua armada harus klik <b>Finish Armada</b> sebelum sesi bisa dikirim WA.</p><div style="margin-top:8px;text-align:left;font-size:12px;color:#475569;max-height:180px;overflow:auto">'+containerList(unfinishedFleetWork)+'</div>',
      icon:'warning',
      customClass:{popup:'custom-swal'}
    });
  }
  var missingPhotoTypes=[];
  state.containers.forEach(function(c){
    var stats=getContainerPhotoStats(c);
    var missing=[];
    if(stats.dokumen===0)missing.push(CLIENT_CONFIG.DOC_SUBFOLDER);
    if(stats.palet===0)missing.push(CLIENT_CONFIG.PALET_SUBFOLDER);
    if(stats.suratjalan===0)missing.push(CLIENT_CONFIG.SURAT_SUBFOLDER);
    if(missing.length){
      missingPhotoTypes.push({
        number:c.number,
        driver:c.driver,
        plate:c.plate,
        missingTypes:missing
      });
    }
  });
  if(missingPhotoTypes.length>0){
    return Swal.fire({
      title:'Foto Armada Belum Lengkap',
      html:'<p>Setiap armada wajib punya minimal 1 foto di '+CLIENT_CONFIG.DOC_SUBFOLDER+', '+CLIENT_CONFIG.PALET_SUBFOLDER+', dan '+CLIENT_CONFIG.SURAT_SUBFOLDER+'.</p><div style="margin-top:8px;text-align:left;font-size:12px;color:#475569;max-height:180px;overflow:auto">'+containerList(missingPhotoTypes)+'</div>',
      icon:'warning',
      customClass:{popup:'custom-swal'}
    });
  }
  var missingPalet=[];
  var incompletePaletPhotos=0;
  state.containers.forEach(function(c){
    var summary=getContainerPaletSummary(c);
    if(summary.valid.length===0)missingPalet.push(c);
    incompletePaletPhotos+=summary.incomplete;
  });
  if(missingPalet.length>0){
    return Swal.fire({
      title:'Data Palet Belum Lengkap',
      html:'<p>'+missingPalet.length+' armada belum punya foto Palet dengan Nama Palet dan Jumlah Koli.</p>'
        +'<div style="margin-top:8px;text-align:left;font-size:12px;color:#475569;max-height:180px;overflow:auto">'+containerList(missingPalet)+'</div>',
      icon:'warning',
      customClass:{popup:'custom-swal'}
    });
  }
  if(incompletePaletPhotos>0){
    return Swal.fire({
      title:'Data Palet Belum Lengkap',
      html:'<p>Masih ada <b>'+incompletePaletPhotos+' foto Palet</b> yang belum diberi Nama Palet dan Jumlah Koli.</p>'
        +'<p style="font-size:12px;color:#64748b;margin-top:6px;">Buka tab Palet, pilih foto-foto tersebut, lalu klik <b>Edit Palet</b> sebelum finish.</p>',
      icon:'warning',
      customClass:{popup:'custom-swal'}
    });
  }
  function runFinishSession_(lpData, lpPayload){
    Swal.fire({title:'Mengirim laporan...',allowOutsideClick:false,customClass:{popup:'custom-swal'},didOpen:function(){Swal.showLoading()}});
    crudTrace('finishSession',finishRequestId,'before_server_call');
    var lpSignaturePayload=null;
    if(lpPayload&&lpPayload.signatureMode==='DIGITAL'&&lpPayload.signatureDataUrl){
      lpSignaturePayload={
        lpName:lpPayload.name,
        signatureMode:'DIGITAL',
        signatureDataUrl:lpPayload.signatureDataUrl
      };
    }
    google.script.run.withSuccessHandler(function(res){
      crudTrace('finishSession',finishRequestId,'client_success',{success:!!(res&&res.success),rekapSuccess:res&&res.rekapSuccess,waSuccess:res&&res.waSuccess});
      if(res.success){
        var icon='success',msg=[];
        if(res.waSuccess===false){icon='warning';msg.push('WA gagal: '+(res.waError||'Device offline'));}
        else{msg.push('Laporan WA terkirim.');}
        if(res.rekapSuccess===false){icon='warning';msg.push('Riwayat/Rekap gagal dibuat: '+(res.rekapError||'server belum mengembalikan detail error'));}
        if(res.handoverPdfSuccess===false){icon='warning';msg.push('PDF Handover gagal dibuat: '+(res.handoverPdfError||'server belum mengembalikan detail error'));}
        else if(res.handoverPdf&&res.handoverPdf.fileUrl){msg.push('PDF Handover tersimpan di Drive.');}
        clearActiveSessionLocal();
        resetHistoryCacheLocal();
        _dashboardForceFreshOnce=true;
        lastSyncHash='';
        crudTraceAfterRender('finishSession',finishRequestId,'state_cleared');
        Swal.fire({icon:icon,title:'Selesai!',html:msg.map(function(m){return'<p>'+m+'</p>';}).join(''),customClass:{popup:'custom-swal'}}).then(function(){navigateTo('dashboard');});
      }else if(res&&res.code==='SJ_QTY_INVALID'){
        showSjQtyInvalidAlert(res.sjQty||res.data||buildSjQtyInvalidAlertData_(res,null,state.activeSessionId,finishRequestId));
      }else if(res&&res.code==='FLEET_WORK_NOT_DONE'){
        var pendingList=containerList(res.pendingFleets||[]);
        Swal.fire({icon:'warning',title:'Armada Belum Finish',html:'<p>'+(res.message||'Finish semua armada dulu.')+'</p>'+(pendingList?'<div style="margin-top:8px;text-align:left;font-size:12px;color:#475569;max-height:180px;overflow:auto">'+pendingList+'</div>':''),customClass:{popup:'custom-swal'}});

        Swal.fire({icon:'warning',title:warnTitle,html:'<p>'+(res.message||'Lengkapi data sebelum finish.')+'</p>'+(list?'<div style="margin-top:8px;text-align:left;font-size:12px;color:#475569;max-height:180px;overflow:auto">'+list+'</div>':''),customClass:{popup:'custom-swal'}});
      }else Swal.fire({icon:'error',title:'Gagal',text:res.message,customClass:{popup:'custom-swal'}});
    }).withFailureHandler(function(err){crudTrace('finishSession',finishRequestId,'client_failure',{message:err&&err.toString?err.toString():String(err)});Swal.fire({icon:'error',title:'Error',text:err.toString(),customClass:{popup:'custom-swal'}});}).finishSession(state.activeSessionId,state.username,finishRequestId,lpSignaturePayload);
  }
  ensureSjQtyReadyForHandover(function(){
    Swal.fire({title:'Kirim laporan WA?',html:'<p>Sesi akan dikunci dan laporan dikirim ke grup WA.</p>',icon:'info',showCancelButton:true,confirmButtonText:'Kirim',cancelButtonText:'Batal',customClass:{popup:'custom-swal',confirmButton:'btn-primary',cancelButton:'btn-primary'},buttonsStyling:false}).then(function(r){
      if(!r.isConfirmed)return;
      ensureLossPreventionInfo(state.activeSessionId,runFinishSession_);
    });
  },state.activeSessionId,finishRequestId);
}

function historyArtifactLabel_(status) {
  status = String(status || '').toUpperCase();
  if (status === 'SUCCESS') return 'Sukses';
  if (status === 'FAILED') return 'Gagal';
  if (status === 'PENDING') return 'Pending';
  if (status === 'SKIPPED') return 'Tidak aktif';
  return '';
}

function historyArtifactColor_(status) {
  status = String(status || '').toUpperCase();
  if (status === 'SUCCESS') return '#047857';
  if (status === 'FAILED') return '#b91c1c';
  if (status === 'PENDING') return '#92400e';
  if (status === 'SKIPPED') return '#64748b';
  return '#334155';
}

function renderHistoryArtifactRow_(label, status, error) {
  var text = historyArtifactLabel_(status);
  if (!text) return '';
  var color = historyArtifactColor_(status);
  var err = String(error || '').trim();
  return '<div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #f8fafc;">'
    + '<span style="color:#64748b;font-size:12px">'+escapeHtml(label)+'</span>'

    + '</div>';
}

function retryHistoryWa(sessionId) {

  if(!s) return;
  
  Swal.fire({
    title: 'Kirim Ulang WA?',
    text: 'Sistem akan mengirim notifikasi WhatsApp ke grup sekarang.',
    icon: 'question',
    showCancelButton: true,
    confirmButtonText: 'Ya, Kirim',
    cancelButtonText: 'Batal'
  }).then(function(res) {
    if(res.isConfirmed) {
      Swal.fire({
        title: 'Mengirim WA...',
        text: 'Mohon tunggu sebentar',
        allowOutsideClick: false,
        didOpen: function() { Swal.showLoading(); }
      });
      google.script.run
        .withSuccessHandler(function(r) {
          if(r && r.success) {
            Swal.fire('Berhasil', 'Pesan WA telah dikirim', 'success').then(function() {
              _historyDataCache[sessionId].waStatus = "SUCCESS";
              showHistoryDetail(sessionId);
              // Opsional: panggil loadHistory() agar UI list ikut update
              if(typeof loadHistory === 'function') loadHistory();
            });
          } else {
            Swal.fire('Gagal', (r && r.message) ? r.message : 'Gagal mengirim pesan WA', 'error').then(function() {
              showHistoryDetail(sessionId);
            });
          }
        })
        .withFailureHandler(function(e) {
          Swal.fire('Error', e.message || 'Terjadi kesalahan jaringan', 'error').then(function() {
            showHistoryDetail(sessionId);
          });
        })
        .retryWaNotification(sessionId);
    } else {
      showHistoryDetail(sessionId);
    }
  });
}

function updateHistoryHandoverCache_(sessionId, data) {
  var s = _historyDataCache[sessionId] || { id: sessionId };
  data = data || {};
  if (Object.prototype.hasOwnProperty.call(data, 'fileId')) s.handoverFileId = data.fileId || '';
  if (Object.prototype.hasOwnProperty.call(data, 'fileUrl')) s.handoverFileUrl = data.fileUrl || '';
  if (Object.prototype.hasOwnProperty.call(data, 'revisionId')) s.handoverRevisionId = data.revisionId || '';
  if (Object.prototype.hasOwnProperty.call(data, 'versionNo')) s.handoverVersionNo = data.versionNo || 0;
  if (Object.prototype.hasOwnProperty.call(data, 'generatedAt')) s.handoverGeneratedAt = data.generatedAt || '';
  _historyDataCache[sessionId] = s;
}

function openHandoverPdfUrl_(url) {
  if (!url) return false;
  var win = window.open(url, '_blank');
  if (!win) {
    Swal.fire({
      icon:'warning',
      title:'Popup diblokir',
      html:'<p style="font-size:13px;color:#64748b">Izinkan popup atau buka lewat tombol di bawah.</p><a href="'+escapeHtml(url)+'" target="_blank" style="display:inline-flex;margin-top:10px;padding:10px 14px;border-radius:8px;background:#1d4ed8;color:#fff;text-decoration:none;font-weight:700;font-size:13px">Buka PDF</a>',
      customClass:{popup:'custom-swal'}
    });
    return false;
  }
  return true;
}

function handleHistoryHandoverClick(sessionId) {
  var s = _historyDataCache[sessionId] || {};
  if (s.handoverFileUrl) {
    openHandoverPdfUrl_(s.handoverFileUrl);
    return;
  }

  Swal.fire({title:'Mengecek PDF...',allowOutsideClick:false,customClass:{popup:'custom-swal'},didOpen:function(){Swal.showLoading();}});
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.success && res.data && res.data.exists && res.data.fileUrl) {
        updateHistoryHandoverCache_(sessionId, res.data);
        Swal.close();
        openHandoverPdfUrl_(res.data.fileUrl);
        return;
      }
      Swal.fire({
        icon:'info',
        title:'PDF Handover belum ada',
        html:'<p style="font-size:13px;color:#64748b">Session lama bisa dibuatkan PDF pertama dari data aplikasi.</p>',
        showCancelButton:true,
        confirmButtonText:'Buat PDF',
        cancelButtonText:'Batal',
        customClass:{popup:'custom-swal',confirmButton:'btn-primary',cancelButton:'btn-primary'},
        buttonsStyling:false
      }).then(function(r) {
        if (r.isConfirmed) updateHistoryHandoverPdf(sessionId, true);
      });
    })
    .withFailureHandler(function(err) {
      Swal.fire({icon:'error',title:'Gagal',text:err.toString(),customClass:{popup:'custom-swal'}});
    })
    .getLatestHandoverPdf(sessionId);
}

function updateHistoryHandoverPdf(sessionId, skipConfirm) {
  function runUpdate_() {
    Swal.fire({title:'Membuat PDF...',html:'<p style="font-size:13px;color:#64748b">Jika PDF sudah ada, file yang sama akan di-update.</p>',allowOutsideClick:false,customClass:{popup:'custom-swal'},didOpen:function(){Swal.showLoading();}});
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success && res.data) {
          updateHistoryHandoverCache_(sessionId, res.data);
          var url = res.data.fileUrl || '';
          var html = '<p style="font-size:13px;color:#64748b">PDF Handover tersimpan sebagai versi '+escapeHtml(res.data.versionNo||'-')+'.</p>';
          if (res.data.revisionWarning) html += '<p style="font-size:12px;color:#b45309;margin-top:6px">'+escapeHtml(res.data.revisionWarning)+'</p>';
          if (url) html += '<a href="'+escapeHtml(url)+'" target="_blank" style="display:inline-flex;margin-top:10px;padding:10px 14px;border-radius:8px;background:#1d4ed8;color:#fff;text-decoration:none;font-weight:700;font-size:13px">Buka PDF</a>';
          Swal.fire({icon:'success',title:'PDF Handover siap',html:html,customClass:{popup:'custom-swal'}});
        } else {
          Swal.fire({icon:'error',title:'Gagal',text:(res&&res.message)||'PDF gagal dibuat.',customClass:{popup:'custom-swal'}});
        }
      })
      .withFailureHandler(function(err) {
        Swal.fire({icon:'error',title:'Error',text:err.toString(),customClass:{popup:'custom-swal'}});
      })
      .createOrUpdateHandoverPdf(sessionId, state.fullName || state.username, 'Update dari riwayat', createCrudTraceId('handoverPdf'));
  }
  function ensureLpThenRunUpdate_() {
    ensureLossPreventionInfo(sessionId, function() {
      runUpdate_();
    });
  }

  if (skipConfirm) {
    ensureLpThenRunUpdate_();
    return;
  }
  Swal.fire({
    icon:'question',
    title:'Update PDF Handover?',
    html:'<p style="font-size:13px;color:#64748b">File PDF yang sama akan di-update sehingga versi lama tersimpan di Google Drive Manage versions.</p>',
    showCancelButton:true,
    confirmButtonText:'Update',
    cancelButtonText:'Batal',
    customClass:{popup:'custom-swal',confirmButton:'btn-primary',cancelButton:'btn-primary'},
    buttonsStyling:false
  }).then(function(r) {
    if (r.isConfirmed) ensureLpThenRunUpdate_();
  });
}

function showHandoverRevisionLog(sessionId) {
  Swal.fire({title:'Memuat revision log...',allowOutsideClick:false,customClass:{popup:'custom-swal'},didOpen:function(){Swal.showLoading();}});
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.success) {
        Swal.fire({icon:'error',title:'Gagal',text:(res&&res.message)||'Revision log gagal dimuat.',customClass:{popup:'custom-swal'}});
        return;
      }
      var rows = res.data || [];
      var html = rows.length

/* =========================================================
   HOTFIX SJ QTY CLIENT FINAL
   Tujuan:
   1) Detail Validasi selalu memakai response server kalau server sukses.
   2) Print/Finish hanya lolos kalau canHandover=true dan validationFinal=true.
   3) Error render/local cache tidak boleh membuat response server VALID dianggap fallback.
   ========================================================= */

var _sjQtyValidationSeq = 0;

function getSjQtyErrorMessage_(err) {
  if (!err) return '';
  return err.message ? String(err.message) : String(err);
}

function hasSjQtyMismatch_(sj) {
  var mismatch = sj && sj.qtyMismatch;
  if (!mismatch) return false;
  if (Array.isArray(mismatch)) return mismatch.length > 0;
  return String(mismatch).trim() !== '';
}

function isSjQtyFinalReady_(sj) {
  return !!sj
    && String(sj.status || '').toUpperCase() === 'VALID'
    && sj.canHandover === true
    && sj.validationFinal === true;
}

function isSjQtyHandoverResponseReady_(res) {
  return !!(res && res.success === true && res.data && isSjQtyFinalReady_(res.data));
}

function getSjQtyResponseDebug_(res) {
  var data = res && res.data;
  return {
    success: res && res.success,
    status: data && data.status,
    canHandover: data && data.canHandover,
    validationFinal: data && data.validationFinal,
    reasonCode: data && data.reasonCode,
    qtyMismatch: data && data.qtyMismatch,
    message: res && res.message
  };
}

function logSjQtyGateDebug_(step, payload) {
  if (typeof console === 'undefined') return;
  try {
    console.log('[SJ_QTY_GATE_DEBUG]', step, payload || {});
  } catch (e) {}
}

function buildSjQtyInvalidAlertData_(res, err, sessionId, requestId) {
  if (res && res.data) return res.data;
  var message = getSjQtyErrorMessage_(err) || (res && res.message) || 'Server tidak mengembalikan response validasi SJ Qty.';
  var summary = getSjQtyResponseDebug_(res);
  return {
    status: 'NOT_FINAL',
    statusText: 'Belum final',
    subText: message,
    reasonCode: err ? 'SERVER_REFRESH_FAILED' : 'SERVER_RESPONSE_NOT_FINAL',
    canHandover: false,
    validationFinal: false,
    _debugMessage: 'requestId=' + (requestId || '-') +
      ' | sessionId=' + (sessionId || '-') +
      ' | res.success=' + (summary.success === undefined ? '-' : summary.success) +
      ' | status=' + (summary.status || '-') +
      ' | canHandover=' + (summary.canHandover === undefined ? '-' : summary.canHandover) +
      ' | validationFinal=' + (summary.validationFinal === undefined ? '-' : summary.validationFinal) +
      ' | error=' + message
  };
}

function safeRenderSjQtyAfterValidation_() {
  try { save(); } catch (e) {
    console.error('[SJ_GATE_FIX] save failed:', e);
  }

  try { renderSessionFromState(); } catch (e2) {
    // Jangan biarkan error render membuat response server valid dianggap fallback/cache.
    console.error('[SJ_GATE_FIX] renderSessionFromState failed:', e2);
  }
}

function markSjQtyValidationNotFinal_(message, reasonCode) {
  var prev = state.sjQtyStatus || {};
  state.sjQtyStatus = Object.assign({}, prev, {
    status: 'NOT_FINAL',
    statusText: 'Belum final',
    subText: message || 'Server belum mengembalikan validasi final. Coba sinkronkan ulang.',
    reasonCode: reasonCode || 'SERVER_REFRESH_FAILED',
    canHandover: false,
    validationFinal: false
  });
  safeRenderSjQtyAfterValidation_();
}

function refreshSjQtyValidation(sessionId, requestId) {
  sessionId = String(sessionId || state.activeSessionId || '').trim();
  requestId = requestId || createCrudTraceId('sjQtyValidation');
  var seq = ++_sjQtyValidationSeq;

  crudTrace('sjQtyValidation', requestId, 'before_server_call', { sessionId: sessionId });
  logSjQtyGateDebug_('before validateSjQtyMatching', {
    requestId: requestId,
    sessionId: sessionId,
    seq: seq
  });

  return gasRun('validateSjQtyMatching', [sessionId, requestId], 45000)
    .then(function(res) {
      var activeSessionId = String(state.activeSessionId || '').trim();
      var canApply = sessionId && sessionId === activeSessionId && seq === _sjQtyValidationSeq;
      var debugSummary = getSjQtyResponseDebug_(res);
      logSjQtyGateDebug_('validateSjQtyMatching raw response', {
        requestId: requestId,
        sessionId: sessionId,
        seq: seq,
        applied: canApply,
        success: debugSummary.success,
        status: debugSummary.status,
        canHandover: debugSummary.canHandover,
        validationFinal: debugSummary.validationFinal,
        reasonCode: debugSummary.reasonCode,
        qtyMismatch: debugSummary.qtyMismatch,
        rawResponse: res
      });
      crudTrace('sjQtyValidation', requestId, 'client_success', {
        success: !!(res && res.success),
        status: res && res.data && res.data.status,
        canHandover: res && res.data && res.data.canHandover,
        validationFinal: res && res.data && res.data.validationFinal
      });

      if (res && res.success && res.data && canApply) {
        state.sjQtyStatus = Object.assign({}, res.data, {
          canHandover: res.data.canHandover === true,
          validationFinal: res.data.validationFinal === true
        });
        safeRenderSjQtyAfterValidation_();
      } else if (canApply) {
        markSjQtyValidationNotFinal_(
          (res && res.message) || 'Server belum mengembalikan validasi final.',
          'SERVER_RESPONSE_NOT_FINAL'
        );
      }

      return res;
    })
    .catch(function(err) {
      var activeSessionId = String(state.activeSessionId || '').trim();
      var canApply = sessionId && sessionId === activeSessionId && seq === _sjQtyValidationSeq;
      var message = getSjQtyErrorMessage_(err);
      logSjQtyGateDebug_('validateSjQtyMatching catch', {
        requestId: requestId,
        sessionId: sessionId,
        seq: seq,
        applied: canApply,
        error: err,
        message: message
      });
      crudTrace('sjQtyValidation', requestId, 'client_failure', {
        message: message
      });
      if (canApply) {
        markSjQtyValidationNotFinal_(
          message || 'Validasi SJ Qty gagal dibaca dari server. Coba sinkronkan ulang.',
          'SERVER_REFRESH_FAILED'
        );
      }
      throw err;
    });
}

function showSjQtyCompareDetail() {
  if (!state.activeSessionId) return;

  var fallback = getSjQtyStatusData();

  Swal.fire({
    title: 'Memuat detail...',
    allowOutsideClick: false,
    customClass: { popup: 'custom-swal' },
    didOpen: function() { Swal.showLoading(); }
  });

  refreshSjQtyValidation(state.activeSessionId, createCrudTraceId('sjQtyDetail'))
    .then(function(res) {
      if (res && res.success && res.data) {
        // Pakai response server langsung. Jangan pakai fallback kalau server sukses.
        return renderSjValidationDetailModal(res.data);
      }

      if (hasSjDisplayableDetail(fallback)) {
        var fallbackCopy = JSON.parse(JSON.stringify(fallback || {}));
        fallbackCopy._fallbackNotice =
          'Server belum mengembalikan validasi final. Detail ini berasal dari data lokal/cache dan belum boleh dijadikan dasar print.';
        return renderSjValidationDetailModal(fallbackCopy);
      }

      Swal.fire({
        icon: 'error',
        title: 'Detail belum tersedia',
        text: res ? res.message : 'Tidak ada data yang bisa ditampilkan.',
        customClass: { popup: 'custom-swal' }
      });
    })
    .catch(function(err) {
      console.error('[SJ_GATE_FIX] show detail failed:', err);

      if (hasSjDisplayableDetail(fallback)) {
        var fallbackCopy = JSON.parse(JSON.stringify(fallback || {}));
        fallbackCopy._fallbackNotice =
          'Server gagal memuat validasi final. Detail ini berasal dari data lokal/cache dan belum boleh dijadikan dasar print.';
        return renderSjValidationDetailModal(fallbackCopy);
      }

      Swal.fire({
        icon: 'error',
        title: 'Detail belum tersedia',
        text: err && err.message ? err.message : String(err),
        customClass: { popup: 'custom-swal' }
      });
    });
}

function ensureSjQtyReadyForHandover(callback, sessionId, requestId) {
  requestId = requestId || createCrudTraceId('handoverValidation');
  sessionId = String(sessionId || state.activeSessionId || '').trim();
  if (!sessionId) {
    logSjQtyGateDebug_('blocked empty sessionId', { requestId: requestId, sessionId: sessionId });
    showSjQtyInvalidAlert(buildSjQtyInvalidAlertData_(null, new Error('Session ID kosong saat validasi SJ Qty.'), sessionId, requestId));
    return;
  }

  ensureNoPendingUploadForHandover(sessionId).then(function(ok) {
    if (!ok) return;

    Swal.fire({
      title: 'Memeriksa SJ Qty...',
      allowOutsideClick: false,
      customClass: { popup: 'custom-swal' },
      didOpen: function() { Swal.showLoading(); }
    });

    refreshSjQtyValidation(sessionId, requestId)
      .then(function(res) {
        Swal.close();

        if (isSjQtyHandoverResponseReady_(res)) {
          crudTrace('sjQtyValidation', requestId, 'validated_ok');
          logSjQtyGateDebug_('validated_ok', {
            requestId: requestId,
            sessionId: sessionId,
            success: res.success,
            status: res.data.status,
            canHandover: res.data.canHandover,
            validationFinal: res.data.validationFinal,
            qtyMismatch: res.data.qtyMismatch
          });
          callback();
          return;
        }

        crudTrace('sjQtyValidation', requestId, 'validated_blocked', {
          status: res && res.data && res.data.status,
          canHandover: res && res.data && res.data.canHandover,
          validationFinal: res && res.data && res.data.validationFinal,
          reasonCode: res && res.data && res.data.reasonCode,
          message: res && res.message
        });
        logSjQtyGateDebug_('validated_blocked', {
          requestId: requestId,
          sessionId: sessionId,
          success: res && res.success,
          status: res && res.data && res.data.status,
          canHandover: res && res.data && res.data.canHandover,
          validationFinal: res && res.data && res.data.validationFinal,
          reasonCode: res && res.data && res.data.reasonCode,
          qtyMismatch: res && res.data && res.data.qtyMismatch,
          rawResponse: res
        });

        showSjQtyInvalidAlert(buildSjQtyInvalidAlertData_(res, null, sessionId, requestId));
      })
      .catch(function(err) {
        Swal.close();
        logSjQtyGateDebug_('validated_refresh_failed', {
          requestId: requestId,
          sessionId: sessionId,
          error: err,
          message: getSjQtyErrorMessage_(err)
        });
        showSjQtyInvalidAlert(buildSjQtyInvalidAlertData_(null, err, sessionId, requestId));
      });
  });
}

function debugSjQtyBrowserTest() {
  var sid = state && state.activeSessionId;
  if (!sid) {
    console.warn('[SJ_BROWSER_TEST] Tidak ada activeSessionId. Buka sesi dulu.');
    alert('Tidak ada sesi aktif. Buka sesi dulu.');
    return Promise.resolve(null);
  }
  var trace = 'BROWSER_TEST_' + Date.now();
  console.log('[SJ_BROWSER_TEST] sessionId=', sid, 'trace=', trace);
  return refreshSjQtyValidation(sid, trace)
    .then(function(res) {
      console.log('[SJ_BROWSER_TEST_RESULT]', res);
      if (isSjQtyHandoverResponseReady_(res)) {
        alert('SJ Qty VALID dari browser. canHandover=true, validationFinal=true.');
      } else {
        alert('SJ Qty dari browser belum valid. Lihat Console untuk detail.');
      }
      return res;
    })
    .catch(function(err) {
      console.error('[SJ_BROWSER_TEST_ERROR]', err);
      alert('Browser test error: ' + (err && err.message ? err.message : String(err)));
      throw err;
    });
}

function handlePauseFleetWork(cid) {
  var c = (state.containers || []).find(function(x) { return x.id === cid; });
  Swal.fire({
    title: 'Break?',
    html: '<p>Timer akan diberhentikan, tapi Anda tetap bisa mengupload sisa foto.</p>',
    icon: 'info',
    showCancelButton: true,
    confirmButtonText: 'Ya, Jeda Timer',
    cancelButtonText: 'Batal',
    customClass: { popup: 'custom-swal', confirmButton: 'btn-primary', cancelButton: 'btn-primary' },
    buttonsStyling: false
  }).then(function(r) {
    if (!r.isConfirmed) return;
    if (!beginCrudAction_('pauseFleetWork', 'Status armada sedang diproses')) return;
    var requestId = createCrudTraceId('pauseFleetWork');
    Swal.fire({ title: 'Menjeda timer...', allowOutsideClick: false, customClass: { popup: 'custom-swal' }, didOpen: function() { Swal.showLoading(); } });
    google.script.run.withSuccessHandler(function(res) {
      endCrudAction_('pauseFleetWork');
      Swal.close();
      if (res && res.success) {
        applyFleetLifecycleLocal_(cid, res.data);
        batchSelectMode = false; batchSelectedIds = [];
        markLocalMutation_('pause_fleet_work');
        save(); renderSessionFromState();
        lastSyncHash = ''; cloudSync(true);
        Toast.fire({ icon: 'success', title: 'Break ditandai' });
      } else {
        Swal.fire({ icon: 'error', title: 'Gagal', text: res ? res.message : 'Error tidak diketahui', customClass: { popup: 'custom-swal' } });
      }
    }).withFailureHandler(function(err) {
      endCrudAction_('pauseFleetWork');
      Swal.fire({ icon: 'error', title: 'Error', text: err.toString(), customClass: { popup: 'custom-swal' } });
    }).pauseFleetWork(cid, { userName: state.fullName || state.username }, requestId);
  });
}
