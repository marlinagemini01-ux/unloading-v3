  <style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Inter',system-ui,sans-serif; background:#f1f5f9; color:#0f172a; -webkit-tap-highlight-color:transparent; overflow-x:hidden; }
  .login-wrapper { min-height:100vh; min-height:100dvh; display:flex; justify-content:center; background-color:#ffffff; font-family:'Poppins',system-ui,sans-serif; -webkit-tap-highlight-color:transparent; }
  .login-container { width:100%; max-width:400px; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; justify-content:center; position:relative; padding:40px 24px 12vh 24px; background-color:#ffffff; }

  .input-pill:focus-within { background-color:#ffffff; border-color:#fbbf24; box-shadow:0 4px 12px rgba(251,191,36,0.15); }

  .input-field[type="password"], .input-field[type="text"].has-toggle { padding-right:56px; }
  .input-pill label { position:absolute; left:24px; top:50%; transform:translateY(-50%); font-size:15px; color:#9ca3af; font-weight:500; pointer-events:none; transition:all 0.2s ease; margin:0; font-family:'Poppins',sans-serif; }
  .input-field:focus ~ label, .input-field:not(:placeholder-shown) ~ label { top:20px; font-size:11px; }
  .input-pill:focus-within label { color:#fbbf24; }
  .toggle-password { position:absolute; right:20px; top:50%; transform:translateY(-50%); background:none; border:none; color:#9ca3af; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:4px; z-index:10; }
  .toggle-password svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .login-btn { width:100%; height:56px; background-color:#fbbf24; color:#111827; border-radius:9999px; border:none; font-size:15px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; cursor:pointer; margin-top:16px; transition:all 0.2s ease; box-shadow:0 8px 20px rgba(251,191,36,0.3); font-family:'Poppins',sans-serif; }
  .login-btn:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 12px 24px rgba(251,191,36,0.4); background-color:#f59e0b; }
  .login-btn:active:not(:disabled) { transform:scale(0.98); }
  .login-btn:disabled { background-color:#f3f4f6; color:#d1d5db; box-shadow:none; cursor:not-allowed; }
  .login-btn:not(:disabled) { background-color:#fbbf24; }
  .login-error { width:100%; text-align:center; color:#dc2626; font-size:13px; font-weight:600; display:none; padding:8px 16px; margin-top:12px; background:#fef2f2; border-radius:12px; font-family:'Poppins',sans-serif; }
  .version-label { position:absolute; bottom:40px; left:0; right:0; text-align:center; font-size:11px; font-weight:500; color:#d1d5db; letter-spacing:0.5px; font-family:'Poppins',sans-serif; }
  .fg { margin-bottom:16px; }
  .fg label { display:block; font-size:12px; font-weight:500; color:#475569; margin-bottom:6px; }
  .fi { width:100%; padding:10px 14px; border:1px solid #e2e8f0; border-radius:8px; font-size:14px; font-family:inherit; color:#0f172a; background:#f8fafc; transition:border-color 0.2s; }
  .fi[type="date"] { text-align:left; direction:ltr; }

  .fi[type="date"]::-webkit-calendar-picker-indicator { margin-left:auto; }
  .fi:focus { outline:none; border-color:#3b82f6; background:#fff; box-shadow:0 0 0 3px rgba(59,130,246,0.1); }
  .btn-primary { width:100%; padding:12px; border:none; border-radius:8px; background:#1e3a5f; color:#fff; font-size:14px; font-weight:600; font-family:inherit; cursor:pointer; transition:background 0.2s; margin-top:8px; }
  .btn-primary:hover { background:#15304f; }

  .btn-primary:disabled { background:#94a3b8; cursor:not-allowed; }

  .btn-processing { pointer-events:none !important; opacity:0.6 !important; position:relative; }

  .app-shell { display:none; height:100vh; height:100dvh; }
  .app-shell.active { display:flex; }
  .sidebar { display:none; background:#0f2744; flex-direction:column; transition:width 0.25s ease; overflow:hidden; flex-shrink:0; }
  .sidebar.collapsed { width:60px; }

  .sidebar-divider { height:1px; background:rgba(255,255,255,0.06); margin:4px 16px; }

  .sidebar-item:hover { background:rgba(255,255,255,0.04); color:rgba(255,255,255,0.7); }
  .sidebar-item.active { background:rgba(59,130,246,0.12); color:#60a5fa; border-right-color:#3b82f6; }
  .sidebar-item svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  .sidebar-item .item-label { overflow:hidden; }
  .collapsed .sidebar-item { justify-content:center; padding:10px 0; }
  .collapsed .sidebar-item .item-label { display:none; }
  .collapsed .sidebar-item .badge-count { display:none; }
  .sidebar-footer { margin-top:auto; padding:12px 16px; font-size:10px; color:rgba(255,255,255,0.15); white-space:nowrap; overflow:hidden; }
  .collapsed .sidebar-footer { text-align:center; }
  .badge-count { margin-left:auto; font-size:10px; padding:2px 8px; border-radius:10px; background:rgba(59,130,246,0.2); color:#60a5fa; font-weight:600; }
  .topbar { display:none; height:52px; border-bottom:1px solid #e2e8f0; align-items:center; padding:0 16px; gap:12px; background:#fff; flex-shrink:0; }
  .btn-hamburger { width:32px; height:32px; border-radius:6px; border:none; background:transparent; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#475569; }
  .btn-hamburger:hover { background:#f1f5f9; }
  .btn-hamburger svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .topbar-title { font-size:15px; font-weight:600; }
  .topbar-info { font-size:11px; color:#64748b; }
  .topbar-spacer { flex:1; }
  .user-chip { display:flex; align-items:center; gap:6px; padding:4px 12px 4px 4px; border-radius:20px; border:1px solid #e2e8f0; cursor:pointer; position:relative; }
  .user-chip:hover { background:#f8fafc; }
  .user-avatar { width:28px; height:28px; border-radius:50%; background:#1e3a5f; color:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; }
  .user-name { font-size:12px; font-weight:500; }
  .user-dropdown { position:fixed; top:52px; right:16px; width:200px; background:#fff; border:1px solid #e2e8f0; border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.1); z-index:9999; display:none; overflow:hidden; animation:dropIn 0.2s ease; }
  .user-dropdown.show { display:block; }
  @media (max-width: 767px) { .user-dropdown.show { display:none !important; } }
  @keyframes dropIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
  .user-dropdown-header { padding:12px 16px; border-bottom:1px solid #f1f5f9; }
  .user-dropdown-header p { font-size:13px; font-weight:600; margin-bottom:2px; }
  .user-dropdown-header small { font-size:11px; color:#64748b; }
  .user-dropdown-item { display:flex; align-items:center; gap:8px; padding:10px 16px; font-size:13px; cursor:pointer; transition:background 0.1s; }
  .user-dropdown-item:hover { background:#f8fafc; }
  .user-dropdown-item svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .user-dropdown-item.danger { color:#dc2626; }
  .profile-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:2000; display:none; opacity:0; transition:opacity 0.2s; }
  .profile-overlay.show { display:block; opacity:1; }
  .profile-sheet { position:fixed; bottom:0; left:0; right:0; background:#fff; border-radius:24px 24px 0 0; padding:24px 20px 32px; z-index:2001; transform:translateY(100%); transition:transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow:0 -4px 24px rgba(0,0,0,0.1); }
  .profile-sheet.show { transform:translateY(0); }
  .sheet-header { display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:20px; }
  .sheet-avatar { width:64px; height:64px; border-radius:50%; background:linear-gradient(135deg, #1e3a5f, #3b82f6); color:#fff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; margin-bottom:12px; border:3px solid #eff6ff; }
  .sheet-name { font-size:18px; font-weight:700; color:#0f172a; margin-bottom:4px; }
  .sheet-role { font-size:13px; color:#64748b; font-weight:500; }
  .sheet-divider { height:1px; background:#e2e8f0; margin:0 -20px 20px -20px; }
  .sheet-logout-btn { width:100%; padding:14px; background:#dc2626; color:#fff; border:none; border-radius:12px; font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:background 0.2s; }
  .sheet-logout-btn:active { background:#b91c1c; transform:scale(0.98); }
  .sheet-logout-btn svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
  .content-area { flex:1; display:flex; flex-direction:column; overflow:hidden; background:#f8fafc; }
  .content-body { flex:1; overflow-y:auto; padding:12px; }
  .page { display:none; }
  .page.active { display:block; animation:fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:16px; margin-bottom:16px; }
  .card-title { font-size:13px; font-weight:600; color:#0f172a; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .card-title svg { width:16px; height:16px; fill:none; stroke:#3b82f6; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .card-subtitle { font-size:11px; color:#64748b; margin-bottom:12px; }

  .empty-icon svg { width:28px; height:28px; fill:none; stroke:#94a3b8; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }

  .team-card { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:10px; margin-bottom:12px; }

  /* =========================================================================
     UPLOAD MODULE V2 — WhatsApp-style Retry UI
     ========================================================================= */

  /* Overlay for failed photos */
  .photo-overlay-failed {
    position:absolute; inset:0; z-index:3;
    background:rgba(0,0,0,0.55);
    border-radius:6px;
    pointer-events:none;
  }

  /* Overlay for uploading */
  .photo-overlay-uploading {
    position:absolute; inset:0; z-index:3;
    background:rgba(255,255,255,0.35);
    border-radius:6px;
    pointer-events:none;
  }

  /* Overlay for retrying */
  .photo-overlay-retrying {
    position:absolute; inset:0; z-index:3;
    background:rgba(245,158,11,0.22);
    border-radius:6px;
    pointer-events:none;
  }

  /* Overlay for log pending */
  .photo-overlay-log-pending {
    position:absolute; inset:0; z-index:3;
    background:rgba(245,158,11,0.12);
    border-radius:6px;
    pointer-events:none;
  }

  /* Overlay for waiting */
  .photo-overlay-waiting {
    position:absolute; inset:0; z-index:3;
    background:rgba(255,255,255,0.5);
    border-radius:6px;
    pointer-events:none;
  }

  /* Retry button — circle in center of failed thumbnail */
  .btn-retry-center {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    z-index:8;
    width:56px; height:56px;
    min-width:56px; min-height:56px;
    border-radius:50%;
    background:rgba(29,78,216,0.94);
    border:3px solid rgba(255,255,255,0.9);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.2s ease;
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    pointer-events:auto;
    box-shadow:0 8px 22px rgba(0,0,0,0.28);
    touch-action:manipulation;
  }
  .btn-retry-center:hover {
    background:rgba(37,99,235,1);
    border-color:#fff;
    transform:translate(-50%, -50%) scale(1.08);
  }
  .btn-retry-center:active {
    transform:translate(-50%, -50%) scale(0.95);
  }
  .btn-retry-center svg {
    filter:drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }

  /* Status badges at bottom of thumbnail */
  .photo-status-badge {
    position:absolute;
    left:4px; right:4px; bottom:4px;
    z-index:4;
    border-radius:6px;
    padding:5px 8px;
    font-size:10px;
    font-weight:600;
    text-align:center;
    line-height:1.3;
    pointer-events:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:5px;
    border:0;
    font-family:inherit;
  }
  .photo-status-badge.clickable {
    pointer-events:auto;
    cursor:pointer;
    min-height:30px;
    touch-action:manipulation;
  }
  .photo-status-badge.uploading {
    background:rgba(29,78,216,0.88);
    color:#fff;
  }
  .photo-status-badge.retrying {
    background:rgba(255,251,235,0.94);
    color:#92400e;
    border:1px solid rgba(245,158,11,0.45);
    font-weight:700;
  }
  .photo-status-badge.failed {
    background:rgba(220,38,38,0.88);
    color:#fff;
  }
  .photo-status-badge.log-pending {
    background:rgba(245,158,11,0.88);
    color:#fff;
  }
  .photo-status-badge.waiting {
    background:rgba(100,116,139,0.75);
    color:#fff;
  }
  .photo-status-badge.done {
    background:rgba(21,128,61,0.85);
    color:#fff;
  }

  .btn-retry-now-mini {
    position:absolute;
    left:8px; right:8px; top:8px;
    z-index:7;
    min-height:30px;
    border:none;

    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    pointer-events:auto;
    touch-action:manipulation;
  }

  /* Small spinner for uploading state */
  .spinner-small {

  <button class="trigger-btn" onclick="showPaletDemo()">Tampilkan Desain Data Palet</button>

  <script>
    const mockItems = [
      {
        id: '1',
        label: 'Palet_20260701_163856_1.jpg',
        previewUrl: 'https://images.unsplash.com/photo-1614088616147-380d91176b92?w=300&h=300&fit=crop', 
        paletName: '',
        paletKoli: ''
      },
      {
        id: '2',
        label: 'Palet_20260701_163856_2.jpg',
        previewUrl: 'https://images.unsplash.com/photo-1577720643272-265f09367456?w=300&h=300&fit=crop',
        paletName: '',
        paletKoli: ''
      }
    ];

    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function cleanPaletName(value) {
      if (!value) return '';
      return String(value).toUpperCase().replace(/[^A-Z0-9s-]/g, '').replace(/s+/g, ' ').trim();
    }
    function cleanPaletKoli(value) {
      if (!value) return 0;
      var num = parseInt(String(value).replace(/D/g, ''), 10);
      return isNaN(num) ? 0 : num;
    }

    // Fungsi Global untuk Toggle Accordion
    window.togglePaletRow = function(rowId) {
      const row = document.getElementById(rowId);
      if(row) row.classList.toggle('is-collapsed');
    };

    window.deletePaletRow = function(rowId) {
      const row = document.getElementById(rowId);
      if(row) {
        row.remove();
        // Update penomoran badge setelah ada yang dihapus
        const badges = document.querySelectorAll('.palet-badge-number');
        badges.forEach((badge, idx) => {
          badge.textContent = (idx + 1);
        });
      }
    };

    function showPaletDemo() {
      let rowsHtml = mockItems.map((item, index) => {
        let rowId = 'palet-row-' + index;
        return '<div class="palet-upload-row" id="'+rowId+'">'
          + '<button class="palet-upload-thumb" type="button" aria-label="Perbesar foto" onclick="alert(\'Zoom foto '+escapeHtml(item.label)+'\')"><img src="'+escapeHtml(item.previewUrl)+'" alt="Preview"><span class="palet-zoom-hint">Zoom</span></button>'
          
          + '<div class="palet-upload-body">'
          +   '<div class="palet-upload-head-top">'
          +     '<div>'
          +       '<div class="palet-upload-file"><span class="palet-badge-number" style="background:#f59e0b;color:#fff;border-radius:4px;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;margin-right:8px;">'+(index+1)+'</span><strong class="palet-title-display" data-original="'+escapeHtml(item.label)+'">'+escapeHtml(item.label)+'</strong></div>'
          +       '<div class="palet-upload-note" style="color:#64748b;font-size:11px;margin-top:4px;">Data otomatis tersimpan sebagai draft saat diketik.</div>'
          +     '</div>'
          +     '<div class="palet-row-actions">'
          +       '<button type="button" class="btn-row-action btn-toggle" onclick="togglePaletRow(\''+rowId+'\')" title="Tutup/Buka Form">'
          +         '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>'
          +       '</button>'
          +       '<button type="button" class="btn-row-action btn-delete" onclick="deletePaletRow(\''+rowId+'\')" title="Hapus Foto">'
          +         '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path></svg>'
          +       '</button>'
          +     '</div>'
          +   '</div>'
          
          +   '<div class="palet-upload-collapsible">'
          +     '<div class="palet-upload-fields">'
          +       '<label><span>Nama/Nomor Palet</span><input class="palet-name-input" type="text" placeholder="Contoh: A12 / P-07"></label>'
          +       '<label><span>Jumlah Koli</span><input class="palet-koli-input" type="tel" inputmode="numeric" placeholder="0"></label>'
          +     '</div>'
          +     '<div class="palet-filename-preview">File: isi Nama/Nomor Palet dan Jumlah Koli dulu</div>'
          +   '</div>'
          
          + '</div>'
          + '</div>';
      }).join('');

      const introHtml = '<div class="palet-upload-intro" style="background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:12px;border-radius:8px;margin-bottom:16px;text-align:left;"><strong>Foto sudah aman tersimpan di perangkat.</strong><br><span style="font-size:12px;opacity:0.9;">Isi nama palet dan koli. Jika halaman tertutup, draft terakhir tetap disimpan.</span></div>';

      const actionButtons = 
        '<div class="palet-custom-actions">' +
          '<button type="button" class="btn-batal" onclick="Swal.close()">Batal</button>' +
          '<button type="button" class="btn-nanti" onclick="Swal.fire(\'Isi Nanti\', \'\', \'info\')">Isi Nanti</button>' +
          '<button type="button" class="btn-kamera" onclick="Swal.fire(\'Buka Kamera\', \'\', \'info\')">Kamera</button>' +
          '<button type="button" class="btn-simpan" onclick="Swal.fire(\'Simpan\', \'\', \'success\')">Simpan</button>' +
        '</div>';

      Swal.fire({
        title: 'Data Palet',
        html: introHtml + '<div class="palet-upload-modal">' + rowsHtml + '</div>' + actionButtons,
        showConfirmButton: false,
        customClass: { popup:'custom-swal palet-swal' },
        buttonsStyling: false,
        width: 'min(760px, calc(100vw - 16px))',
        didOpen: function() {
          const names = document.querySelectorAll('.palet-name-input');
          const kolis = document.querySelectorAll('.palet-koli-input');
          const previews = document.querySelectorAll('.palet-filename-preview');
          const titles = document.querySelectorAll('.palet-title-display');

          function updatePreviews() {
            for (let i = 0; i < names.length; i++) {
              let pName = cleanPaletName(names[i].value) || '';
              let pKoli = cleanPaletKoli(kolis[i].value) || '';
              
              if (!pName || !pKoli) {
                previews[i].textContent = 'File: isi Nama/Nomor Palet dan Jumlah Koli dulu';
                previews[i].style.color = '#64748b';
                if(titles[i]) {
                  titles[i].textContent = titles[i].getAttribute('data-original');
                }
              } else {
                let segment = pName.replace(/s+/g, ' ') || 'PALET';
                let newFileName = 'Palet ' + segment + ' - ' + pKoli + ' Koli.jpg';
                previews[i].textContent = 'File: ' + newFileName;
                previews[i].style.color = '#059669';
                if(titles[i]) {
                  titles[i].textContent = newFileName;
                }
              }
            }
          }

          names.forEach(input => {
            input.addEventListener('input', () => { input.value = cleanPaletName(input.value); updatePreviews(); });
          });
          kolis.forEach(input => {
            input.addEventListener('input', () => { updatePreviews(); });
          });
        }
      });
    }

    window.onload = () => { setTimeout(showPaletDemo, 500); };
  </script>
